name: 'DevOps Metrics from GitHub'
author: 'Sten Otto Johnsen'
description: 'Outputs a set of key metrics based on GitHub issues and releases'
branding:
  icon: 'align-justify'
  color: 'green'
inputs:
  owner: # organization
    description: 'Owner of the repo. Org or user. Validated against GitHub
      naming rules (letters, digits, "_", ".", "-"; 1-100 chars; no "..")'
    required: false
  repo: # repository
    description: 'Repository name(s), separated by comma, whitespace or given
      as a list. Entries may be "name" or "owner/name"; each part is validated
      against GitHub naming rules before any API call'
    required: false
  token: # repository
    description: 'Repository access token. Falls back to the GH_TOKEN
      environment variable when empty.'
    required: false
    default: ${{ github.token }}
  logging: # history
    description: 'Emit the *-log outputs (JSON arrays of the releases and pull
      requests behind each metric) when exactly "true"; other values warn and
      count as false'
    required: false
  filtered:
    description: 'Filtering only feat and fix as basis for lead time when
      exactly "true"; other values warn and count as false'
    required: false
  bug-label:
    description: 'Issue label that identifies a bug/incident for mttr and
      change-failure-rate. Trimmed; at most 50 characters'
    required: false
    default: 'bug'
outputs:
  deploy-rate: # pull requests merged to main per week
    description: 'Deployment rate (deploys/week)'

  lead-time: # Average time between first commit on a feature and its deployment into production
    description: 'Feature lead-time (days)'

  change-failure-rate: # Percentage of releases causing an Issue tagged with bug-label
    description: 'Change failure rate (%)'

  mttr: # Average time between releases where an issue tagged with bug-label is created and closed
    description: 'Mean time to restore (days)'

  deploy-rate-log: # list of releases that forms the basis of the deployment rate
    description: 'JSON array of {kind:"release", repo, at, name} records if
      logging true; sanitized and capped, ends with {kind:"truncated", omitted}
      when cut'

  lead-time-log: # list of pull requests that forms the basis of the lead-time
    description: 'JSON array of {kind:"pull", repo, at, title, commitAt,
      commitMessage, releaseAt, release, leadTimeDays} records if logging true;
      sanitized and capped, ends with {kind:"truncated", omitted} when cut'

  change-failure-rate-log: # list of failed releases and the bugs opened after them
    description: 'JSON array of {kind:"failed-release", repo, at, name,
      bugs:[{number, title, createdAt}]} records if logging true; sanitized and
      capped, ends with {kind:"truncated", omitted} when cut'

  mttr-log: # list of bugs and the releases that bound their restore time
    description: 'JSON array of {kind:"restore", repo, number, title, createdAt,
      closedAt, releaseBefore, releaseBeforeAt, releaseAfter, releaseAfterAt,
      restoreDays} records if logging true; sanitized and capped, ends with
      {kind:"truncated", omitted} when cut'

  metrics-status: # which metrics had data to compute from
    description: 'JSON object mapping deploy-rate, lead-time,
      change-failure-rate and mttr to "computed" or "no-data"; a "no-data"
      metric was defaulted to 0 and a warning was written'

runs:
  using: 'node24'
  main: 'dist/index.js'
