dapter} from './interfaces/ICommitsAdapter'\nimport {isoTimestamp} from './types/Timestamp'\n\ntype MergedPullRequest = PullRequest & {mergedAt: number}\n\nconst ONE_DAY = 24 * 60 * 60 * 1000\nexport class LeadTime {\n  log: PullLogEntry[] = []\n  pulls: MergedPullRequest[]\n  releases: Release[]\n  today: Date\n  commitsAdapter: ICommitsAdapter\n\n  constructor(\n    pulls: PullRequest[],\n    releases: Release[],\n    commitsAdapter: ICommitsAdapter,\n    today: Date | null = null\n  ) {\n    if (today === null) {\n      this.today = new Date()\n    } else {\n      this.today = today\n    }\n\n    const since = this.today.valueOf() - 31 * ONE_DAY\n    this.pulls = pulls.filter(\n      (p): p is MergedPullRequest => p.mergedAt !== null && p.mergedAt > since\n    )\n    this.releases = releases\n    this.commitsAdapter = commitsAdapter\n  }\n\n  getLog(): PullLogEntry[] {\n    return this.log\n  }\n  async getLeadTime(filtered = false): Promise<"+"number> {\n    const leadTimes: number[] = []\n    for (const pull of this.pulls) {\n      if (pull.baseRef !== 'main') {\n        continue\n      }\n      if (\n        filtered &&\n        !(pull.title.startsWith('feat') || pull.title.startsWith('fix'))\n      ) {\n        continue\n      }\n\n      const laterReleases = this.releases.filter(\n        r => r.publishedAt > pull.mergedAt && r.repo === pull.repo\n      )\n      if (laterReleases.length === 0) {\n        continue\n      }\n      const deployTime: number = laterReleases[0].publishedAt\n      const commits = await this.commitsAdapter.getCommits(\n        pull.repo,\n        pull.number\n      )\n      const firstCommit = commits.sort(\n        (a, b) => a.committedAt - b.committedAt\n      )[0]\n\n      const leadTime = (deployTime - firstCommit.committedAt) / ONE_DAY\n      leadTimes.push(leadTime)\n      this.log.push({\n        kind: 'pull',\n        at: isoTimestamp(pull.mergedAt),\n        title: pull.title,\n        commitAt: isoTimestamp(firstCommit.committedAt),\n        commitMessage: firstCommit.message,\n        releaseAt: isoTimestamp(deployTime),\n        release: laterReleases[0].name,\n        leadTimeDays: Math.round(leadTime * 100) / 100\n      })\n    }\n    if (leadTimes.length === 0) {\n      return 0\n    }\n\n    return (\n      Math.round((leadTimes.reduce((p, c) => p + c) / leadTimes.length) * 100) /\n      100\n    )\n  }\n}\n"},"src/DeployFrequency.ts":{"language":"typescript","mutants":[{"id":"98","mutatorName":"ArithmeticOperator","replacement":"1000 * 60 * 60 / 24","status":"Survived","static":true,"testsCompleted":2,"coveredBy":["168","169"],"location":{"end":{"column":36,"line":8},"start":{"column":17,"line":8}}},{"id":"99","mutatorName":"ArithmeticOperator","replacement":"1000 * 60 / 60","status":"Survived","static":true,"testsCompleted":2,"coveredBy":["168","169"],"location":{"end":{"column":31,"line":8},"start":{"column":17,"line":8}}},{"id":"101","mutatorName":"ArrayDeclaration","replacement":"[\"Stryker was here\"]","statusReason":"src/DeployFrequency.ts(11,29): error TS2322: Type 'string' is not assignable to type 'ReleaseLogEntry'.\n","status":"CompileError","static":false,"coveredBy":["154","184","185","186","187","188","189","190","191","192","193","194","195","196","197","198"],"location":{"end":{"column":30,"line":11},"start":{"column":28,"line":11}}},{"id":"100","mutatorName":"ArithmeticOperator","replacement":"1000 / 60","status":"Survived","static":true,"testsCompleted":2,"coveredBy":["168","169"],"location":{"end":{"column":26,"line":8},"start":{"column":17,"line":8}}},{"id":"102","mutatorName":"ArrayDeclaration","replacement":"new Array([])","statusReason":"src/DeployFrequency.ts(13,3): error TS2322: Type 'never[][]' is not assignable to type 'Release[]'.\n  Type 'never[]' is missing the following properties from type 'Release': repo, name, publishedAt\n","status":"CompileError","static":false,"coveredBy":["154","184","185","186","187","188","189","190","191","192","193","19 illed","static":false,"testsCompleted":3,"killedBy":["82"],"coveredBy":["80","81","82","83","84","89","90","91","92"],"location":{"end":{"column":4,"line":147},"start":{"column":56,"line":145}}},{"id":"603","mutatorName":"CallExpression","replacement":";","statusReason":"expected [] to deeply equal [ [ 'deploy-rate', '5' ], …(6) ]","status":"Killed","static":false,"testsCompleted":3,"killedBy":["82"],"coveredBy":["80","81","82","83","84","89","90","91","92"],"location":{"end":{"column":32,"line":146},"start":{"column":5,"line":146}}}],"source":"import type * as core from '@actions/core'\nimport type {GitHubClient} from './GitHubClient'\nimport {ReleaseAdapter} from './ReleaseAdapter'\nimport {DeployFrequency} from './DeployFrequency'\nimport {ChangeFailureRate} from './ChangeFailureRate'\nimport {IssuesAdapter} from './IssuesAdapter'\nimport {MeanTimeToRestore} from './MeanTimeToRestore'\nimport {PullRequestsAdapter} from './PullRequestsAdapter'\nimport {CommitsAdapter} from './CommitsAdapter'\nimport {LeadTime} from './LeadTime'\nimport {serializeLog} from './log'\n\nexport interface Inputs {\n  owner: string\n  repositories: string[]\n  token: string\n  logging: boolean\n  filtered: boolean\n  bugLabel: string\n}\n\nexport interface Outputs {\n  'deploy-rate': string\n  'deploy-rate-log'?: string\n  'lead-time': number\n  'lead-time-log'?: string\n  'change-failure-rate': number\n  'change-failure-rate-log'?: string\n  mttr: number\n}\n\nexport type ActionsCore = Pick<"+"\n  typeof core,\n  'getInput' | 'info' | 'setOutput' | 'setSecret'\n>\n\nexport const TOKEN_REQUIRED_MESSAGE =\n  'A GitHub token is required: set the `token` input or the GH_TOKEN environment variable'\n\nexport interface RepoContext {\n  owner: string\n  repo: string\n}\n\n// `github.context.repo` is a getter that throws outside Actions, so it must stay lazy.\nexport interface ActionsContext {\n  readonly repo: RepoContext\n}\n\nexport interface RunDeps {\n  inputs: Inputs\n  client: GitHubClient\n  core: Pick<"+"ActionsCore, 'info' | 'setOutput'>\n}\n\nexport function parseInputs(\n  core: Pick<"+"ActionsCore, 'getInput' | 'info' | 'setSecret'>,\n  context: ActionsContext,\n  env: NodeJS.ProcessEnv\n): Inputs {\n  let repo: string = core.getInput('repo')\n  if (repo === '' || repo === null) {\n    repo = context.repo.repo\n    core.info(`${context.repo.repo} - default repo.`)\n  }\n\n  // Allow for multiple repos, ex: [val1, val2, val3]\n  const repositories = repo\n    .split(/[[\\]\\n,]+/)\n    .map(s => s.trim())\n    .filter(x => x !== '')\n\n  let owner: string = core.getInput('owner')\n  if (owner === '' || owner === null) {\n    owner = context.repo.owner\n    core.info(`${context.repo.owner} - default owner.`)\n  }\n\n  for (const repository of repositories) {\n    core.info(`${owner}/${repository}`)\n  }\n\n  const repoCount = repositories.length\n  if (repoCount > 1) {\n    core.info(`${repoCount.toString()} repositories registered.`)\n  } else {\n    core.info(`${repoCount.toString()} repository registered.`)\n  }\n\n  let token: string | undefined = core.getInput('token')\n  if (token === '' || token === null) {\n    token = env.GH_TOKEN\n  }\n  if (token === undefined || token === '') {\n    throw new Error(TOKEN_REQUIRED_MESSAGE)\n  }\n  // The GH_TOKEN fallback is not masked by the runner unless registered here.\n  core.setSecret(token)\n\n  return {\n    owner,\n    repositories,\n    token,\n    logging: core.getInput('logging') === 'true',\n    filtered: core.getInput('filtered') === 'true',\n    bugLabel: core.getInput('bug-label') || 'bug'\n  }\n}\n\nexport async function run({inputs, client, core}: RunDeps): Promise<"+"Outputs> {\n  const {owner, repositories, logging, filtered, bugLabel} = inputs\n\n  // Fetch everything first so an API failure aborts before any output is set.\n  const releaseList = await new ReleaseAdapter(\n    client,\n    owner,\n    repositories\n  ).GetAllReleasesLastMonth()\n  const pulls = await new PullRequestsAdapter(\n    client,\n    owner,\n    repositories\n  ).GetAllPRsLastMonth()\n  const issueList = await new IssuesAdapter(\n    client,\n    owner,\n    repositories\n  ).GetAllIssuesLastMonth()\n\n  const df = new DeployFrequency(releaseList)\n  const lt = new LeadTime(pulls, releaseList, new CommitsAdapter(client))\n  const leadTime = await lt.getLeadTime(filtered)\n  const cfr = new ChangeFailureRate(issueList, releaseList, null, bugLabel)\n  const mttr = new MeanTimeToRestore(issueList, releaseList, null, bugLabel)\n\n  const outputs: Outputs = {\n    'deploy-rate': df.rate(),\n    ...(logging && {'deploy-rate-log': serializeLog(df.getLog())}),\n    'lead-time': leadTime,\n    ...(logging && {'lead-time-log': serializeLog(lt.getLog())}),\n    'change-failure-rate': cfr.Cfr(),\n    ...(logging && {'change-failure-rate-log': serializeLog(cfr.getLog())}),\n    mttr: mttr.mttr()\n  }\n  for (const [name, value] of Object.entries(outputs)) {\n    core.setOutput(name, value)\n  }\n\n  return outputs\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":95,"low":90,"break":90},"testFiles":{"__tests__/LeadTime.test.ts":{"tests":[{"id":"0","name":"LeadTime should return 0 on no pull-requests"},{"id":"1","name":"LeadTime should return 0 on no closed pull-requests"},{"id":"2","name":"LeadTime should return 0 on no releases"},{"id":"3","name":"LeadTime should return 0 on no pull-requests with baseRef = main"},{"id":"4","name":"LeadTime should return 8 on pull-requests with baseRef = main"},{"id":"5","name":"LeadTime should return 8 on pull-requests with baseRef = main and earlier release on other repo"},{"id":"6","name":"LeadTime should return 0 on too old pull-requests"},{"id":"7","name":"LeadTime should return 11 on pull-requests with two commits"},{"id":"8","name":"LeadTime should return 10.5 on pull-requests with two pulls on different repos"},{"id":"9","name":"LeadTime should return 8.5 on two pull-requests with two commits"},{"id":"10","name":"LeadTime should return 6,67 on three pull-requests with one commit each"},{"id":"11","name":"LeadTime should return 6 on three pull-requests with one commit each and two latest not released"},{"id":"12","name":"LeadTime should return 8 on three pull-requests with one commit each and two repos, latest not released"},{"id":"13","name":"LeadTime should not attribute releases of a repo whose name is a prefix of another"},{"id":"14","name":"LeadTime should get an empty log of releases or pulls"},{"id":"15","name":"LeadTime should get release log list weekly when rate calculated"},{"id":"16","name":"LeadTime should get event log list when lead time calculated"},{"id":"17","name":"LeadTime should get event log list when lead time calculated and filtered"},{"id":"18","name":"LeadTime should get event log list when lead time calculated and filtered with no fix or feat"},{"id":"19","name":"LeadTime should edge cases exclude a pull merged exactly 31 days ago"},{"id":"20","name":"LeadTime should edge cases include a pull merged just under 31 days ago"},{"id":"21","name":"LeadTime should edge cases not write the filtered log line when there are no pulls"},{"id":"22","name":"LeadTime should edge cases not write the filtered log line when there are no releases"},{"id":"23","name":"LeadTime should edge cases log only pull records whether filtered or not"},{"id":"24","name":"LeadTime should edge cases drop unmerged pulls in the constructor"},{"id":"25","name":"LeadTime should edge cases ignore a pull not merged to main even when releases exist"},{"id":"26","name":"LeadTime should edge cases ignore a release published at the exact merge time"},{"id":"27","name":"LeadTime should edge cases only match titles starting with feat or fix when filtered"},{"id":"28","name":"LeadTime should edge cases log the earliest commit even when commits are unsorted"}],"source":"import {CommitsAdapter} from '../src/CommitsAdapter'\nimport {GitHubClient} from '../src/GitHubClient'\nimport type {Commit} from '../src/types/Commit'\nimport type {PullRequest} from '../src/types/PullRequest'\nimport type {Release} from '../src/types/Release'\nimport type {RepoKey} from '../src/types/RepoKey'\nimport {LeadTime} from '../src/LeadTime'\nimport {commit, pull, release, ts} from './helpers/domain'\n\nconst DMA = 'stenjo/devops-metrics-action'\nconst OTHER = 'stenjo/other-repo'\n\ndescribe('LeadTime should', () => {\n  const commitsAdapter: CommitsAdapter = new CommitsAdapter(new GitHubClient())\n  commitsAdapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => {\n    return Promise.resolve([commit('2023-04-22T17:50:53Z')])\n  })\n\n  it('return 0 on no pull-requests', async () => {\n    const pulls = [] as PullRequest[]\n    const lt = new LeadTime(\n      pulls,\n      [release('2023-04-30T17:50:53Z')],\n      commitsAdapter,\n      new Date()\n    )\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(0)\n  })\n\n  it('return 0 on no closed pull-requests', async () => {\n    const pulls = [pull({mergedAt: null})]\n    const lt = new LeadTime(\n      pulls,\n      [release('2023-04-30T17:50:53Z')],\n      commitsAdapter,\n      new Date('2023-05-01')\n    )\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(0)\n  })\n\n  it('return 0 on no releases', async () => {\n    const pulls = [pull({mergedAt: ts('2023-04-28T17:50:53Z')})]\n\n    const lt = new LeadTime(pulls, [], commitsAdapter, new Date('2023-05-01'))\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(0)\n  })\n\n  it('return 0 on no pull-requests with baseRef = main', async () => {\n    const pulls = [pull({baseRef: 'other'})]\n    const lt = new LeadTime(\n      pulls,\n      [release('2023-04-30T17:50:53Z')],\n      commitsAdapter,\n      new Date('2023-05-01')\n    )\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(0)\n  })\n\n  it('return 8 on pull-requests with baseRef = main', async () => {\n    const pullRequests = [pull({mergedAt: ts('2023-04-28T17:50:53Z')})] // 30-22 = 8\n    const releases = [release('2023-04-30T17:50:53Z')]\n    commitsAdapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => {\n      return Promise.resolve([commit('2023-04-22T17:50:53Z')])\n    })\n    const lt = new LeadTime(\n      pullRequests,\n      releases,\n      commitsAdapter,\n      new Date('2023-05-01')\n    )\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(8)\n  })\n\n  it('return 8 on pull-requests with baseRef = main and earlier release on other repo', async () => {\n    const pullRequests = [\n      pull({\n        mergedAt: ts('2023-04-28T17:50:53Z'),\n        number: 1\n      }) // 30-22 = 8\n    ]\n    const releases = [\n      release('2023-04-29T17:50:53Z', OTHER),\n      release('2023-04-30T17:50:53Z', DMA)\n    ]\n    commitsAdapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => {\n      return Promise.resolve([commit('2023-04-22T17:50:53Z')])\n    })\n    const lt = new LeadTime(\n      pullRequests,\n      releases,\n      commitsAdapter,\n      new Date('2023-05-01')\n    )\n\n    const leadTime = await lt.getLeadTime()\n\n    // eslint-disable-next-line @typescript-eslint/unbound-method\n    expect(commitsAdapter.getCommits).toHaveBeenCalled()\n    // eslint-disable-next-line @typescript-eslint/unbound-method\n    expect(commitsAdapter.getCommits).toHaveBeenLastCalledWith(DMA, 1)\n    expect(leadTime).toBe(8)\n  })\n\n  it('return 0 on too old pull-requests', async () => {\n    const pulls = [pull({mergedAt: ts('2023-04-29T17:50:53Z')})]\n    const rels = [release('2023-04-30T17:50:53Z')]\n    const lt = new LeadTime(\n      pulls,\n      rels,\n      commitsAdapter,\n      new Date('2023-06-29T17:50:53Z')\n    )\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(0)\n  })\n\n  it('return 11 on pull-requests with two commits', async () => {\n    const pulls = [pull({mergedAt: ts('2023-04-29T17:50:53Z')})] // 30-19 = 11\n    const rels = [release('2023-04-30T17:50:53Z')]\n    commitsAdapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => {\n      return Promise.resolve([\n        commit('2023-04-22T17:50:53Z'),\n        commit('2023-04-19T17:50:53Z')\n      ])\n    })\n\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(11)\n  })\n\n  it('return 10.5 on pull-requests with two pulls on different repos', async () => {\n    const pulls = [\n      pull({mergedAt: ts('2023-04-29T17:50:53Z'), repo: DMA}), // 30-19 = 11\n      pull({mergedAt: ts('2023-04-28T17:50:53Z'), repo: OTHER}) // 29-19 = 10\n    ]\n    const rels = [\n      release('2023-04-30T17:50:53Z', DMA),\n      release('2023-04-29T17:50:53Z', OTHER)\n    ]\n    commitsAdapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => {\n      return Promise.resolve([\n        commit('2023-04-22T17:50:53Z'),\n        commit('2023-04-19T17:50:53Z')\n      ])\n    })\n\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(10.5)\n  })\n\n  it('return 8.5 on two pull-requests with two commits', async () => {\n    commitsAdapter.getCommits = vi.fn(getCommits)\n    // Returning commits from (10)=>22/4, (15)=>27/4 and (47)=>19/4\n    const pulls = [\n      pull({mergedAt: ts('2023-04-29T17:50:53Z'), number: 47}), // 30-19 = 11\n      pull({mergedAt: ts('2023-04-27T17:50:53Z'), number: 10}) // 28-22 = 6\n    ]\n    const rels = [\n      release('2023-04-28T17:50:53Z'),\n      release('2023-04-30T17:50:53Z'),\n      release('2023-04-02T17:50:53Z')\n    ]\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(8.5) // (11+6)/2\n  })\n\n  it('return 6,67 on three pull-requests with one commit each', async () => {\n    commitsAdapter.getCommits = vi.fn(getCommits)\n    // Returning commits from (10)=>22/4, (15)=>27/4 and (47)=>19/4\n    const pulls = [\n      pull({mergedAt: ts('2023-04-29T17:50:53Z'), number: 47}), // commit 19/4, release 30/4 -> 11 days\n      pull({mergedAt: ts('2023-04-27T17:50:53Z'), number: 10}), // commit 22/4, release 28/4 -> 6 days\n      pull({mergedAt: ts('2023-04-29T17:50:53Z'), number: 15}) // commit 27/4, release 30/4 -> 3 days\n    ]\n    const rels = [\n      release('2023-04-28T17:50:53Z'),\n      release('2023-04-30T17:50:53Z'),\n      release('2023-04-02T17:50:53Z')\n    ]\n\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(6.67) // (11+6+3)/3\n  })\n\n  it('return 6 on three pull-requests with one commit each and two latest not released', async () => {\n    commitsAdapter.getCommits = vi.fn(getCommits)\n    const pulls = [\n      pull({mergedAt: ts('2023-04-29T17:50:53Z'), number: 47}),\n      pull({mergedAt: ts('2023-04-27T17:50:53Z'), number: 10}), // commit 22/4, release 28/4 -> 6 days\n      pull({mergedAt: ts('2023-04-29T17:50:53Z'), number: 15})\n    ]\n    const rels = [\n      release('2023-04-28T17:50:53Z'),\n      release('2023-04-02T17:50:53Z')\n    ]\n\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(6) // (6)/1\n  })\n\n  it('return 8 on three pull-requests with one commit each and two repos, latest not released', async () => {\n    commitsAdapter.getCommits = vi.fn(getCommits)\n    const pulls = [\n      pull({\n        mergedAt: ts('2023-04-27T17:50:53Z'),\n        number: 47,\n        repo: OTHER\n      }), // commit 19/4, release 29/4 -> 10 days\n      pull({mergedAt: ts('2023-04-27T17:50:53Z'), number: 10, repo: DMA}), // commit 22/4, release 28/4 -> 6 days\n      pull({mergedAt: ts('2023-04-29T17:50:53Z'), number: 15, repo: DMA}) // not released\n    ]\n    const rels = [\n      release('2023-04-28T17:50:53Z', DMA),\n      release('2023-04-29T17:50:53Z', OTHER),\n      release('2023-04-02T17:50:53Z', DMA)\n    ]\n\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(8) // (6+10)/2\n  })\n\n  it('not attribute releases of a repo whose name is a prefix of another', async () => {\n    commitsAdapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => [\n      commit('2023-04-22T17:50:53Z')\n    ])\n    const pulls = [pull({mergedAt: ts('2023-04-28T17:50:53Z'), repo: 'o/api'})]\n    const onlyGateway = [release('2023-04-30T17:50:53Z', 'o/api-gateway')]\n    const both = [\n      release('2023-04-29T17:50:53Z', 'o/api-gateway'),\n      release('2023-05-01T17:50:53Z', 'o/api')\n    ]\n\n    const unreleased = new LeadTime(\n      pulls,\n      onlyGateway,\n      commitsAdapter,\n      new Date('2023-05-02')\n    )\n    const released = new LeadTime(\n      pulls,\n      both,\n      commitsAdapter,\n      new Date('2023-05-02')\n    )\n\n    expect(await unreleased.getLeadTime()).toBe(0)\n    expect(await released.getLeadTime()).toBe(9) // 1/5 - 22/4, not 29/4\n  })\n\n  it('get an empty log of releases or pulls', async () => {\n    const lt = new LeadTime([], [], commitsAdapter)\n\n    expect(lt.getLog().length).toBe(0)\n  })\n\n  it('get release log list weekly when rate calculated', async () => {\n    commitsAdapter.getCommits = vi.fn(getCommits)\n    const pulls = [\n      pull({\n        mergedAt: ts('2023-04-27T17:50:53Z'),\n        number: 47,\n        repo: OTHER\n      }),\n      pull({mergedAt: ts('2023-04-27T17:50:53Z'), number: 10, repo: DMA}),\n      pull({mergedAt: ts('2023-04-29T17:50:53Z'), number: 15, repo: DMA})\n    ]\n    const rels = [\n      release('2023-04-28T17:50:53Z', DMA, 'v1.1.0'),\n      release('2023-04-29T17:50:53Z', OTHER, 'v0.1.0'),\n      release('2023-04-02T17:50:53Z', DMA, 'v0.0.1')\n    ]\n\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n    await lt.getLeadTime()\n\n    expect(lt.getLog().map(l => l.release)).toEqual(['v0.1.0', 'v1.1.0'])\n  })\n\n  it('get event log list when lead time calculated', async () => {\n    commitsAdapter.getCommits = vi.fn(getCommits)\n    const pulls = [\n      pull({\n        mergedAt: ts('2023-04-27T17:50:53Z'),\n        number: 47,\n        repo: OTHER,\n        title: 'feat(docs): better description'\n      }),\n      pull({\n        mergedAt: ts('2023-04-27T17:50:53Z'),\n        number: 10,\n        repo: DMA,\n        title: 'fix: removed error message'\n      }),\n      pull({\n        mergedAt: ts('2023-04-29T17:50:53Z'),\n        number: 15,\n        repo: DMA,\n        title: 'feat: handle several repos'\n      })\n    ]\n    const rels = [\n      release('2023-04-28T17:50:53Z', DMA, 'v1.1.0'),\n      release('2023-04-29T17:50:53Z', OTHER, 'v0.1.0'),\n      release('2023-04-02T17:50:53Z', DMA, 'v0.0.1')\n    ]\n\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n    await lt.getLeadTime()\n\n    const log = lt.getLog()\n\n    expect(log.filter(l => l.kind === 'pull').length).toBe(2)\n  })\n\n  it('get event log list when lead time calculated and filtered', async () => {\n    commitsAdapter.getCommits = vi.fn(getCommits)\n    const pulls = [\n      pull({\n        mergedAt: ts('2023-04-27T17:50:53Z'),\n        number: 47,\n        repo: OTHER,\n        title: 'feat(docs): better description'\n      }),\n      pull({\n        mergedAt: ts('2023-04-27T17:50:53Z'),\n        number: 10,\n        repo: DMA,\n        title: 'chore: cleaned up'\n      }),\n      pull({\n        mergedAt: ts('2023-04-29T17:50:53Z'),\n        number: 15,\n        repo: DMA,\n        title: 'fix: removed error message'\n      })\n    ]\n    const rels = [\n      release('2023-04-28T17:50:53Z', DMA, 'v1.1.0'),\n      release('2023-04-29T17:50:53Z', OTHER, 'v0.1.0'),\n      release('2023-04-02T17:50:53Z', DMA, 'v0.0.1')\n    ]\n\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n    const leadTime = await lt.getLeadTime(true)\n\n    const log = lt.getLog()\n\n    expect(log.filter(l => l.kind === 'pull').length).toBe(1)\n\n    expect(leadTime).toBe(10)\n  })\n\n  it('get event log list when lead time calculated and filtered with no fix or feat', async () => {\n    commitsAdapter.getCommits = vi.fn(getCommits)\n    const pulls = [\n      pull({\n        mergedAt: ts('2023-04-27T17:50:53Z'),\n        number: 47,\n        repo: OTHER,\n        title: 'chore(docs): better description'\n      }),\n      pull({\n        mergedAt: ts('2023-04-27T17:50:53Z'),\n        number: 10,\n        repo: DMA,\n        title: 'chore: cleaned up'\n      }),\n      pull({\n        mergedAt: ts('2023-04-29T17:50:53Z'),\n        number: 15,\n        repo: DMA,\n        title: 'ci: removed error message'\n      })\n    ]\n    const rels = [\n      release('2023-04-28T17:50:53Z', DMA, 'v1.1.0'),\n      release('2023-04-29T17:50:53Z', OTHER, 'v0.1.0'),\n      release('2023-04-02T17:50:53Z', DMA, 'v0.0.1')\n    ]\n\n    const lt = new LeadTime(pulls, rels, commitsAdapter, new Date('2023-05-01'))\n    const leadTime = await lt.getLeadTime(true)\n\n    const log = lt.getLog()\n\n    expect(log.filter(l => l.kind === 'pull').length).toBe(0)\n\n    expect(leadTime).toBe(0)\n  })\n\n  describe('edge cases', () => {\n    const repoRelease: Release = release('2023-04-30T17:50:53Z', DMA, 'v1.0.0')\n    const today = new Date('2023-05-01T00:00:00Z')\n    const mainPull = pull({\n      mergedAt: ts('2023-04-28T17:50:53Z'),\n      number: 47,\n      title: 'feat: something'\n    })\n    const adapter: CommitsAdapter = new CommitsAdapter(new GitHubClient())\n    adapter.getCommits = vi.fn(getCommits)\n\n    it('exclude a pull merged exactly 31 days ago', async () => {\n      const pulls = [{...mainPull, mergedAt: ts('2023-03-31T00:00:00Z')}]\n      const lt = new LeadTime(pulls, [repoRelease], adapter, today)\n\n      expect(await lt.getLeadTime()).toBe(0)\n      expect(lt.getLog()).toEqual([])\n    })\n\n    it('include a pull merged just under 31 days ago', async () => {\n      const pulls = [{...mainPull, mergedAt: ts('2023-03-31T00:00:01Z')}]\n      const lt = new LeadTime(pulls, [repoRelease], adapter, today)\n\n      expect(await lt.getLeadTime()).toBeGreaterThan(0)\n    })\n\n    it('not write the filtered log line when there are no pulls', async () => {\n      const lt = new LeadTime([], [repoRelease], adapter, today)\n\n      expect(await lt.getLeadTime(true)).toBe(0)\n      expect(lt.getLog()).toEqual([])\n    })\n\n    it('not write the filtered log line when there are no releases', async () => {\n      const lt = new LeadTime([mainPull], [], adapter, today)\n\n      expect(await lt.getLeadTime(true)).toBe(0)\n      expect(lt.getLog()).toEqual([])\n    })\n\n    it('log only pull records whether filtered or not', async () => {\n      const filtered = new LeadTime([mainPull], [repoRelease], adapter, today)\n      await filtered.getLeadTime(true)\n      const unfiltered = new LeadTime([mainPull], [repoRelease], adapter, today)\n      await unfiltered.getLeadTime(false)\n\n      expect(filtered.getLog().map(l => l.kind)).toEqual(['pull'])\n      expect(unfiltered.getLog()).toEqual(filtered.getLog())\n    })\n\n    it('drop unmerged pulls in the constructor', () => {\n      const lt = new LeadTime(\n        [mainPull, {...mainPull, mergedAt: null}],\n        [repoRelease],\n        adapter,\n        today\n      )\n\n      expect(lt.pulls).toEqual([mainPull])\n    })\n\n    it('ignore a pull not merged to main even when releases exist', async () => {\n      const pulls = [{...mainPull, baseRef: 'develop'}]\n      const lt = new LeadTime(pulls, [repoRelease], adapter, today)\n\n      expect(await lt.getLeadTime()).toBe(0)\n    })\n\n    it('ignore a release published at the exact merge time', async () => {\n      const rel = {...repoRelease, publishedAt: mainPull.mergedAt as number}\n      const lt = new LeadTime([mainPull], [rel], adapter, today)\n\n      expect(await lt.getLeadTime()).toBe(0)\n    })\n\n    it('only match titles starting with feat or fix when filtered', async () => {\n      const pulls = [\n        {...mainPull, title: 'chore: hotfix'},\n        {...mainPull, title: 'fix: real'},\n        {...mainPull, title: 'feat: real'},\n        {...mainPull, title: 'refactor: feat'}\n      ]\n      const lt = new LeadTime(pulls, [repoRelease], adapter, today)\n      await lt.getLeadTime(true)\n\n      expect(lt.getLog().map(l => [l.at, l.title])).toEqual([\n        ['2023-04-28T17:50:53Z', 'fix: real'],\n        ['2023-04-28T17:50:53Z', 'feat: real']\n      ])\n    })\n\n    it('log the earliest commit even when commits are unsorted', async () => {\n      adapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => [\n        commit('2023-04-25T00:00:00Z', 'later'),\n        commit('2023-04-20T00:00:00Z', 'first'),\n        commit('2023-04-22T00:00:00Z', 'middle')\n      ])\n      const lt = new LeadTime([mainPull], [repoRelease], adapter, today)\n\n      const leadTime = await lt.getLeadTime()\n\n      expect(leadTime).toBe(10.74)\n      expect(lt.getLog()).toEqual([\n        {\n          kind: 'pull',\n          at: '2023-04-28T17:50:53Z',\n          title: 'feat: something',\n          commitAt: '2023-04-20T00:00:00Z',\n          commitMessage: 'first',\n          releaseAt: '2023-04-30T17:50:53Z',\n          release: 'v1.0.0',\n          leadTimeDays: 10.74\n        }\n      ])\n    })\n  })\n\n  // Returning commits from (10)=>22/4, (15)=>27/4 and (47)=>19/4\n  async function getCommits(\n    _repo: RepoKey,\n    pullNumber: number\n  ): Promise<"+"Commit[]> {\n    if (pullNumber === 10) {\n      return [commit('2023-04-22T17:50:53Z', 'wip: changed to commonjs')]\n    }\n    if (pullNumber === 15) {\n      return [\n        commit(\n          '2023-04-27T17:50:53Z',\n          'fix(workflow): update release and dora workflows'\n        )\n      ]\n    }\n    if (pullNumber === 47) {\n      return [commit('2023-04-19T17:50:53Z', 'all passing')]\n    }\n    return []\n  }\n})\n"},"__tests__/ChangeFailureRate.test.ts":{"tests":[{"id":"29","name":"ChangeFailureRate should get number of bugs created"},{"id":"30","name":"ChangeFailureRate should get percentage rate"},{"id":"31","name":"ChangeFailureRate should calculate 0 failures on 0 releases"},{"id":"32","name":"ChangeFailureRate should calculate 0 failures on 0 issues"},{"id":"33","name":"ChangeFailureRate should calculate 100% failures on 1 issues on 1 release"},{"id":"34","name":"ChangeFailureRate should boundaries exclude releases published exactly 31 days ago"},{"id":"35","name":"ChangeFailureRate should boundaries not count a bug created at the exact release time"},{"id":"36","name":"ChangeFailureRate should boundaries sort releases by date before pairing them"},{"id":"37","name":"ChangeFailureRate should boundaries not attribute bugs from another repo to this repo releases"},{"id":"38","name":"ChangeFailureRate should boundaries not attribute bugs of a repo whose name is a prefix of another"},{"id":"39","name":"ChangeFailureRate should boundaries ignore bugs created in the future without failing"},{"id":"40","name":"ChangeFailureRate should log be empty before Cfr() runs and when nothing failed"},{"id":"41","name":"ChangeFailureRate should log record one failed-release per counted interval with its bugs"},{"id":"42","name":"ChangeFailureRate should log attribute a bug after the latest release to that release"},{"id":"43","name":"ChangeFailureRate should log keep one record per repo interval and the count equal to failed deploys"},{"id":"44","name":"ChangeFailureRate should log match the fixture rate: failed intervals over releases in window"},{"id":"45","name":"ChangeFailureRate should calculate 0% failures on 1 issues on 1 release when more than a month ago"},{"id":"46","name":"ChangeFailureRate should calculate 0% failures on 1 issues on release on other repo"},{"id":"47","name":"ChangeFailureRate should calculate 50% failures on 1 issues on 2 releases"},{"id":"48","name":"ChangeFailureRate should calculate 0% failures on 1 issues that is not a bug on 2 releases"},{"id":"49","name":"ChangeFailureRate should calculate 50% failures on 2 issues after latest release"},{"id":"50","name":"ChangeFailureRate should calculate 100% failures on 2 issues after no releases this month"},{"id":"51","name":"ChangeFailureRate should calculate 100% failures on 2 issues after latest release and one before"},{"id":"52","name":"ChangeFailureRate should calculate 33% failures on 3 issues after first release and none after second of 3 releases"},{"id":"53","name":"ChangeFailureRate should calculate 50% failures on 3 issues on two repos on two of 4 releases"},{"id":"54","name":"ChangeFailureRate should calculate 50% failures on 3 issues after first release no older than a month"},{"id":"55","name":"ChangeFailureRate should with a custom bug label count issues tagged with the custom label"},{"id":"56","name":"ChangeFailureRate should with a custom bug label ignore issues tagged bug when a custom label is given"},{"id":"57","name":"ChangeFailureRate should with a custom bug label default to the bug label when none is given"}],"source":"import type {Issue} from '../src/types/Issue'\nimport type {Release} from '../src/types/Release'\nimport type {RepoKey} from '../src/types/RepoKey'\nimport type {\n  GitHubIssuePayload,\n  GitHubReleasePayload\n} from '../src/github/payloads'\nimport {toIssue, toRelease} from '../src/github/mappers'\nimport fs from 'fs'\nimport {ChangeFailureRate} from '../src/ChangeFailureRate'\nimport {issue, release, ts} from './helpers/domain'\n\nconst ONE_DAY = 24 * 60 * 60 * 1000\nconst DORA = 'stenjo/dora'\nconst REPOSITORY = 'somepath/repository'\nconst OTHER = 'somepath/other-repo'\n\nconst fixtureIssues = (): Issue[] =>\n  (\n    JSON.parse(\n      fs.readFileSync('./__tests__/test-data/issue-list.json', 'utf8')\n    ) as GitHubIssuePayload[]\n  ).map(p => toIssue('stenjo', 'devops-metrics-action', p))\nconst fixtureReleases = (): Release[] =>\n  (\n    JSON.parse(\n      fs.readFileSync('./__tests__/test-data/releases.json', 'utf8')\n    ) as GitHubReleasePayload[]\n  ).map(p => toRelease('stenjo', 'devops-metrics-action', p))\n\nconst bug = (createdAt: string, repo: RepoKey = REPOSITORY): Issue =>\n  issue({repo, createdAt: ts(createdAt), closedAt: null})\n\ndescribe('ChangeFailureRate should', () => {\n  it('get number of bugs created', () => {\n    const cfr = new ChangeFailureRate(\n      fixtureIssues(),\n      fixtureReleases(),\n      new Date('2023-04-23T16:50:53Z')\n    )\n\n    const bugs = cfr.getBugs()\n\n    expect(bugs.length).toBe(2)\n  })\n\n  it('get percentage rate', () => {\n    const cfr = new ChangeFailureRate(\n      fixtureIssues(),\n      fixtureReleases(),\n      new Date('2023-04-23T16:50:53Z')\n    )\n\n    const cfrPercentage = cfr.Cfr()\n\n    expect(cfrPercentage).toBe(14)\n  })\n\n  it('calculate 0 failures on 0 releases', () => {\n    const cfr = new ChangeFailureRate(\n      fixtureIssues(),\n      [],\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 0 failures on 0 issues', () => {\n    const cfr = new ChangeFailureRate(\n      [],\n      fixtureReleases(),\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 100% failures on 1 issues on 1 release', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z', DORA)]\n    const releases = [release('2023-04-30T16:50:53Z', DORA)]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(100)\n    expect(cfr.repos).toEqual([DORA])\n  })\n\n  describe('boundaries', () => {\n    const today = new Date('2023-05-01T00:00:00Z')\n    const doraBug = (createdAt: string, repo: RepoKey = DORA): Issue =>\n      bug(createdAt, repo)\n    const doraRelease = (publishedAt: string, repo: RepoKey = DORA): Release =>\n      release(publishedAt, repo)\n\n    it('exclude releases published exactly 31 days ago', () => {\n      const onBoundary = new ChangeFailureRate(\n        [doraBug('2023-04-15T00:00:00Z')],\n        [doraRelease('2023-03-31T00:00:00Z')],\n        today\n      )\n      const inside = new ChangeFailureRate(\n        [doraBug('2023-04-15T00:00:00Z')],\n        [doraRelease('2023-03-31T00:00:01Z')],\n        today\n      )\n\n      expect(onBoundary.Cfr()).toBe(0)\n      expect(inside.Cfr()).toBe(100)\n    })\n\n    it('not count a bug created at the exact release time', () => {\n      const releases = [\n        doraRelease('2023-04-10T00:00:00Z'),\n        doraRelease('2023-04-20T00:00:00Z')\n      ]\n      const atFirst = new ChangeFailureRate(\n        [doraBug('2023-04-10T00:00:00Z')],\n        [...releases],\n        today\n      )\n      const atSecond = new ChangeFailureRate(\n        [doraBug('2023-04-20T00:00:00Z')],\n        [...releases],\n        today\n      )\n\n      expect(atFirst.Cfr()).toBe(0)\n      expect(atSecond.Cfr()).toBe(0)\n    })\n\n    it('sort releases by date before pairing them', () => {\n      const releases = [\n        doraRelease('2023-04-10T00:00:00Z'),\n        doraRelease('2023-04-20T00:00:00Z'),\n        doraRelease('2023-04-30T00:00:00Z')\n      ]\n      const cfr = new ChangeFailureRate(\n        [doraBug('2023-04-15T00:00:00Z'), doraBug('2023-04-25T00:00:00Z')],\n        releases,\n        today\n      )\n\n      expect(cfr.Cfr()).toBe(67)\n    })\n\n    it('not attribute bugs from another repo to this repo releases', () => {\n      const other = 'stenjo/other'\n      const releases = [\n        doraRelease('2023-04-10T00:00:00Z'),\n        doraRelease('2023-04-20T00:00:00Z'),\n        doraRelease('2023-04-12T00:00:00Z', other)\n      ]\n      const cfr = new ChangeFailureRate(\n        [\n          doraBug('2023-04-25T00:00:00Z'),\n          doraBug('2023-04-15T00:00:00Z', other)\n        ],\n        releases,\n        today\n      )\n\n      expect(cfr.Cfr()).toBe(67)\n    })\n\n    it('not attribute bugs of a repo whose name is a prefix of another', () => {\n      // api: one release followed by two bugs -> 1 failed deploy of 3.\n      // Prefix matching on \"api\" would also pair the bugs with the two\n      // api-gateway releases and count 2 failed deploys (67%).\n      const releases = [\n        doraRelease('2023-04-10T00:00:00Z', 'o/api'),\n        doraRelease('2023-04-12T00:00:00Z', 'o/api-gateway'),\n        doraRelease('2023-04-20T00:00:00Z', 'o/api-gateway')\n      ]\n      const cfr = new ChangeFailureRate(\n        [\n          doraBug('2023-04-11T00:00:00Z', 'o/api'),\n          doraBug('2023-04-15T00:00:00Z', 'o/api')\n        ],\n        releases,\n        today\n      )\n\n      expect(cfr.Cfr()).toBe(33)\n      expect(cfr.repos).toEqual(['o/api'])\n    })\n\n    it('ignore bugs created in the future without failing', () => {\n      const now = Date.now()\n      const cfr = new ChangeFailureRate(\n        [doraBug(new Date(now + ONE_DAY).toISOString())],\n        [doraRelease(new Date(now - ONE_DAY).toISOString())]\n      )\n\n      expect(cfr.Cfr()).toBe(0)\n    })\n  })\n\n  describe('log', () => {\n    const today = new Date('2023-05-01T00:00:00Z')\n\n    it('be empty before Cfr() runs and when nothing failed', () => {\n      const cfr = new ChangeFailureRate(\n        [bug('2023-04-05T00:00:00Z', DORA)],\n        [release('2023-04-10T00:00:00Z', DORA, 'v1')],\n        today\n      )\n\n      expect(cfr.getLog()).toEqual([])\n      expect(cfr.Cfr()).toBe(0)\n      expect(cfr.getLog()).toEqual([])\n    })\n\n    it('record one failed-release per counted interval with its bugs', () => {\n      const releases = [\n        release('2023-04-30T00:00:00Z', DORA, 'v3'),\n        release('2023-04-10T00:00:00Z', DORA, 'v1'),\n        release('2023-04-20T00:00:00Z', DORA, 'v2')\n      ]\n      const bugs = [\n        issue({\n          repo: DORA,\n          number: 7,\n          title: 'bug: crash',\n          createdAt: ts('2023-04-25T00:00:00Z'),\n          closedAt: null\n        }),\n        issue({\n          repo: DORA,\n          number: 5,\n          title: 'bug: slow',\n          createdAt: ts('2023-04-12T00:00:00Z'),\n          closedAt: null\n        }),\n        issue({\n          repo: DORA,\n          number: 6,\n          title: 'bug: wrong',\n          createdAt: ts('2023-04-15T00:00:00Z'),\n          closedAt: null\n        })\n      ]\n      const cfr = new ChangeFailureRate(bugs, releases, today)\n\n      expect(cfr.Cfr()).toBe(67)\n      expect(cfr.getLog()).toEqual([\n        {\n          kind: 'failed-release',\n          at: '2023-04-10T00:00:00Z',\n          name: 'v1',\n          bugs: [\n            {number: 5, title: 'bug: slow', createdAt: '2023-04-12T00:00:00Z'},\n            {number: 6, title: 'bug: wrong', createdAt: '2023-04-15T00:00:00Z'}\n          ]\n        },\n        {\n          kind: 'failed-release',\n          at: '2023-04-20T00:00:00Z',\n          name: 'v2',\n          bugs: [\n            {number: 7, title: 'bug: crash', createdAt: '2023-04-25T00:00:00Z'}\n          ]\n        }\n      ])\n    })\n\n    it('attribute a bug after the latest release to that release', () => {\n      const cfr = new ChangeFailureRate(\n        [bug('2023-04-30T17:50:53Z', DORA)],\n        [release('2023-04-30T16:50:53Z', DORA, 'v9')],\n        today\n      )\n\n      expect(cfr.Cfr()).toBe(100)\n      expect(cfr.getLog()).toHaveLength(1)\n      expect(cfr.getLog()[0]).toMatchObject({\n        at: '2023-04-30T16:50:53Z',\n        name: 'v9'\n      })\n    })\n\n    it('keep one record per repo interval and the count equal to failed deploys', () => {\n      const other = 'stenjo/other'\n      const releases = [\n        release('2023-04-10T00:00:00Z', DORA, 'd1'),\n        release('2023-04-20T00:00:00Z', DORA, 'd2'),\n        release('2023-04-12T00:00:00Z', other, 'o1')\n      ]\n      const cfr = new ChangeFailureRate(\n        [bug('2023-04-25T00:00:00Z', DORA), bug('2023-04-15T00:00:00Z', other)],\n        releases,\n        today\n      )\n\n      expect(cfr.Cfr()).toBe(67)\n      expect(cfr.getLog().map(e => `${e.name}@${e.at}`)).toEqual([\n        'd2@2023-04-20T00:00:00Z',\n        'o1@2023-04-12T00:00:00Z'\n      ])\n    })\n\n    it('match the fixture rate: failed intervals over releases in window', () => {\n      const cfr = new ChangeFailureRate(\n        fixtureIssues(),\n        fixtureReleases(),\n        new Date('2023-04-23T16:50:53Z')\n      )\n\n      expect(cfr.Cfr()).toBe(14)\n      expect(cfr.getLog()).toHaveLength(1)\n      expect(\n        Math.round((cfr.getLog().length / cfr.releases.length) * 100)\n      ).toBe(14)\n      expect(cfr.getLog()[0].kind).toBe('failed-release')\n      expect(cfr.getLog()[0].bugs).toHaveLength(2)\n    })\n  })\n\n  it('calculate 0% failures on 1 issues on 1 release when more than a month ago', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z', DORA)]\n    const releases = [release('2023-04-30T16:50:53Z', DORA)]\n\n    const cfr = new ChangeFailureRate(bugs, releases)\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 0% failures on 1 issues on release on other repo', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z', DORA)]\n    const releases = [release('2023-04-30T16:50:53Z', 'stenjo/other-repo')]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 50% failures on 1 issues on 2 releases', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z')]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(50)\n  })\n\n  it('calculate 0% failures on 1 issues that is not a bug on 2 releases', () => {\n    const bugs = [{...bug('2023-04-30T17:50:53Z'), labels: ['feature']}]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 50% failures on 2 issues after latest release', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z'), bug('2023-04-30T17:50:53Z')]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(50)\n  })\n\n  it('calculate 100% failures on 2 issues after no releases this month', () => {\n    const bugs = [bug('2023-04-29T17:50:53Z'), bug('2023-05-01T17:50:53Z')]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-05-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(100)\n  })\n\n  it('calculate 100% failures on 2 issues after latest release and one before', () => {\n    const bugs = [\n      bug('2023-04-29T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z')\n    ]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(100)\n  })\n\n  it('calculate 33% failures on 3 issues after first release and none after second of 3 releases', () => {\n    const bugs = [\n      bug('2023-04-29T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z')\n    ]\n    const releases = [\n      release('2023-04-28T16:50:53Z', REPOSITORY),\n      release('2023-04-30T19:50:53Z', REPOSITORY),\n      release('2023-05-02T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(33)\n  })\n\n  it('calculate 50% failures on 3 issues on two repos on two of 4 releases', () => {\n    const bugs = [\n      bug('2023-04-29T17:50:53Z'), // bug on 28, repository\n      bug('2023-04-30T17:50:53Z', OTHER), // bug on 28, other-repo\n      bug('2023-04-30T17:50:53Z') // bug on 28, repository\n    ]\n    const releases = [\n      release('2023-04-28T16:50:53Z', REPOSITORY),\n      release('2023-04-28T16:50:53Z', OTHER),\n      release('2023-04-30T19:50:53Z', REPOSITORY),\n      release('2023-05-02T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-04-30T17:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(50)\n  })\n\n  it('calculate 50% failures on 3 issues after first release no older than a month', () => {\n    const bugs = [\n      bug('2023-04-29T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z')\n    ]\n    const releases = [\n      release('2023-04-28T16:50:53Z', REPOSITORY),\n      release('2023-04-30T19:50:53Z', REPOSITORY),\n      release('2023-04-02T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(\n      bugs,\n      releases,\n      new Date('2023-05-29T10:50:53Z')\n    )\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(50)\n  })\n\n  describe('with a custom bug label', () => {\n    const releases = [release('2023-04-30T16:50:53Z', DORA)]\n    const today = new Date('2023-04-30T17:50:53Z')\n\n    const issuesLabelled = (label: string): Issue[] => [\n      {...bug('2023-04-30T17:50:53Z', DORA), labels: [label]}\n    ]\n\n    it('count issues tagged with the custom label', () => {\n      const cfr = new ChangeFailureRate(\n        issuesLabelled('incident'),\n        releases,\n        today,\n        'incident'\n      )\n\n      expect(cfr.getBugs().length).toBe(1)\n      expect(cfr.Cfr()).toBe(100)\n    })\n\n    it('ignore issues tagged bug when a custom label is given', () => {\n      const cfr = new ChangeFailureRate(\n        issuesLabelled('bug'),\n        releases,\n        today,\n        'incident'\n      )\n\n      expect(cfr.getBugs().length).toBe(0)\n      expect(cfr.Cfr()).toBe(0)\n    })\n\n    it('default to the bug label when none is given', () => {\n      const cfrDefault = new ChangeFailureRate(\n        issuesLabelled('bug'),\n        releases,\n        today\n      )\n      const cfrIncident = new ChangeFailureRate(\n        issuesLabelled('incident'),\n        releases,\n        today\n      )\n\n      expect(cfrDefault.getBugs().length).toBe(1)\n      expect(cfrIncident.getBugs().length).toBe(0)\n    })\n  })\n})\n"},"__tests__/main.test.ts":{"tests":[{"id":"58","name":"main.ts performs no I/O when imported"},{"id":"59","name":"parseInputs uses the provided token, owner and repo inputs without touching the context"},{"id":"60","name":"parseInputs falls back to GH_TOKEN when the token input is empty"},{"id":"61","name":"parseInputs falls back to GH_TOKEN when the token input is null"},{"id":"62","name":"parseInputs registers the provided token input as a secret"},{"id":"63","name":"parseInputs fails with the required-token message when the token input is empty and GH_TOKEN unset"},{"id":"64","name":"parseInputs fails with the required-token message when the token input is empty and GH_TOKEN empty"},{"id":"65","name":"parseInputs names both the input and the environment variable in the required-token message"},{"id":"66","name":"parseInputs uses the context repo and owner when inputs are not provided and logs it"},{"id":"67","name":"parseInputs uses the context repo and owner when inputs are null"},{"id":"68","name":"parseInputs does not log defaults when repo and owner are provided"},{"id":"69","name":"parseInputs parses bracketed, newline and comma separated repos and trims them"},{"id":"70","name":"parseInputs logs every repository and pluralises the count"},{"id":"71","name":"parseInputs maps filtered input 'true' to true"},{"id":"72","name":"parseInputs maps filtered input 'false' to false"},{"id":"73","name":"parseInputs maps filtered input '' to false"},{"id":"74","name":"parseInputs maps filtered input 'yes' to false"},{"id":"75","name":"parseInputs maps logging input 'true' to true"},{"id":"76","name":"parseInputs maps logging input 'false' to false"},{"id":"77","name":"parseInputs maps logging input '' to false"},{"id":"78","name":"parseInputs passes the 'bug-label' input through"},{"id":"79","name":"parseInputs defaults 'bug-label' to 'bug' when the input is empty"},{"id":"80","name":"run wires the injected client, owner and repositories into every adapter"},{"id":"81","name":"run feeds the fetched releases, pulls, commits and issues into the metrics"},{"id":"82","name":"run sets and returns all outputs including logs when logging is enabled"},{"id":"83","name":"run does not set log outputs when logging is disabled"},{"id":"84","name":"run reports an empty issue list instead of computing change-failure-rate and mttr"},{"id":"85","name":"run aborts before any output is set when fetching releases fails"},{"id":"86","name":"run aborts before any output is set when fetching pulls fails"},{"id":"87","name":"run aborts before any output is set when fetching issues fails"},{"id":"88","name":"run aborts before any output is set when fetching commits (via lead time) fails"},{"id":"89","name":"run fetches releases, pulls and issues before computing any metric"},{"id":"90","name":"run passes filtered=true to LeadTime"},{"id":"91","name":"run passes filtered=false to LeadTime"},{"id":"92","name":"run passes the bug label to ChangeFailureRate and MeanTimeToRestore"}],"source":"import * as core from '@actions/core'\nimport {ReleaseAdapter} from '../src/ReleaseAdapter'\nimport {DeployFrequency} from '../src/DeployFrequency'\nimport {ChangeFailureRate} from '../src/ChangeFailureRate'\nimport {IssuesAdapter} from '../src/IssuesAdapter'\nimport {MeanTimeToRestore} from '../src/MeanTimeToRestore'\nimport {PullRequestsAdapter} from '../src/PullRequestsAdapter'\nimport {CommitsAdapter} from '../src/CommitsAdapter'\nimport {LeadTime} from '../src/LeadTime'\nimport type {GitHubClient} from '../src/GitHubClient'\nimport {parseInputs, run, TOKEN_REQUIRED_MESSAGE} from '../src/main'\nimport type {ActionsContext, Inputs} from '../src/main'\nimport type {Release} from '../src/types/Release'\nimport type {PullRequest} from '../src/types/PullRequest'\nimport type {Issue} from '../src/types/Issue'\n\nvi.mock('@actions/core')\nvi.mock('../src/ReleaseAdapter')\nvi.mock('../src/DeployFrequency')\nvi.mock('../src/ChangeFailureRate')\nvi.mock('../src/IssuesAdapter')\nvi.mock('../src/MeanTimeToRestore')\nvi.mock('../src/PullRequestsAdapter')\nvi.mock('../src/CommitsAdapter')\nvi.mock('../src/LeadTime')\n\nconst context: ActionsContext = {\n  repo: {owner: 'defaultOwner', repo: 'defaultRepo'}\n}\n\n// Mirrors github.context.repo outside Actions: throws unless the fallback is needed.\nconst throwingContext: ActionsContext = {\n  get repo(): never {\n    throw new Error('context.repo requires a GITHUB_REPOSITORY')\n  }\n}\n\nfunction fakeCore(inputs: Record<"+"string, string | null>): {\n  getInput: Mock<"+"(name: string) => string>\n  info: Mock<"+"(message: string) => void>\n  setOutput: Mock<"+"(name: string, value: unknown) => void>\n  setSecret: Mock<"+"(secret: string) => void>\n} {\n  return {\n    getInput: vi.fn((name: string) =>\n      name in inputs ? (inputs[name] as string) : ''\n    ),\n    info: vi.fn(),\n    setOutput: vi.fn(),\n    setSecret: vi.fn()\n  }\n}\n\ndescribe('main.ts', () => {\n  it('performs no I/O when imported', async () => {\n    const fetchSpy = vi.spyOn(globalThis, 'fetch')\n    vi.resetModules()\n\n    await import('../src/main')\n\n    expect(fetchSpy).not.toHaveBeenCalled()\n    expect(core.setOutput).not.toHaveBeenCalled()\n    expect(core.getInput).not.toHaveBeenCalled()\n    expect(core.setFailed).not.toHaveBeenCalled()\n  })\n})\n\ndescribe('parseInputs', () => {\n  it('uses the provided token, owner and repo inputs without touching the context', () => {\n    const inputs = parseInputs(\n      fakeCore({token: 'provided-token', repo: 'repo1', owner: 'o'}),\n      throwingContext,\n      {GH_TOKEN: 'env-token'}\n    )\n\n    expect(inputs).toEqual<"+"Inputs>({\n      owner: 'o',\n      repositories: ['repo1'],\n      token: 'provided-token',\n      logging: false,\n      filtered: false,\n      bugLabel: 'bug'\n    })\n  })\n\n  it('falls back to GH_TOKEN when the token input is empty', () => {\n    const fake = fakeCore({token: '', repo: 'repo1', owner: 'o'})\n\n    const inputs = parseInputs(fake, context, {GH_TOKEN: 'env-token'})\n\n    expect(inputs.token).toBe('env-token')\n    expect(fake.setSecret).toHaveBeenCalledExactlyOnceWith('env-token')\n  })\n\n  it('falls back to GH_TOKEN when the token input is null', () => {\n    const inputs = parseInputs(\n      fakeCore({token: null, repo: 'repo1', owner: 'o'}),\n      context,\n      {GH_TOKEN: 'env-token'}\n    )\n\n    expect(inputs.token).toBe('env-token')\n  })\n\n  it('registers the provided token input as a secret', () => {\n    const fake = fakeCore({token: 'provided-token', repo: 'repo1', owner: 'o'})\n\n    parseInputs(fake, context, {GH_TOKEN: 'env-token'})\n\n    expect(fake.setSecret).toHaveBeenCalledExactlyOnceWith('provided-token')\n  })\n\n  it.each([\n    ['GH_TOKEN unset', {}],\n    ['GH_TOKEN empty', {GH_TOKEN: ''}]\n  ])(\n    'fails with the required-token message when the token input is empty and %s',\n    (_label, env) => {\n      const fake = fakeCore({repo: 'repo1', owner: 'o'})\n\n      expect(() => parseInputs(fake, context, env)).toThrow(\n        new Error(TOKEN_REQUIRED_MESSAGE)\n      )\n      expect(fake.setSecret).not.toHaveBeenCalled()\n    }\n  )\n\n  it('names both the input and the environment variable in the required-token message', () => {\n    expect(TOKEN_REQUIRED_MESSAGE).toBe(\n      'A GitHub token is required: set the `token` input or the GH_TOKEN environment variable'\n    )\n  })\n\n  it('uses the context repo and owner when inputs are not provided and logs it', () => {\n    const fake = fakeCore({token: 'mock-token', logging: 'false'})\n\n    const inputs = parseInputs(fake, context, {})\n\n    expect(inputs.owner).toBe('defaultOwner')\n    expect(inputs.repositories).toEqual(['defaultRepo'])\n    expect(fake.info.mock.calls.map(c => c[0])).toEqual([\n      'defaultRepo - default repo.',\n      'defaultOwner - default owner.',\n      'defaultOwner/defaultRepo',\n      '1 repository registered.'\n    ])\n  })\n\n  it('uses the context repo and owner when inputs are null', () => {\n    const inputs = parseInputs(\n      fakeCore({token: 'mock-token', repo: null, owner: null}),\n      context,\n      {}\n    )\n\n    expect(inputs.owner).toBe('defaultOwner')\n    expect(inputs.repositories).toEqual(['defaultRepo'])\n  })\n\n  it('does not log defaults when repo and owner are provided', () => {\n    const fake = fakeCore({\n      token: 'mock-token',\n      repo: 'repo1',\n      owner: 'testOwner'\n    })\n\n    parseInputs(fake, context, {})\n\n    expect(fake.info.mock.calls.map(c => c[0])).toEqual([\n      'testOwner/repo1',\n      '1 repository registered.'\n    ])\n  })\n\n  it('parses bracketed, newline and comma separated repos and trims them', () => {\n    const inputs = parseInputs(\n      fakeCore({\n        token: 't',\n        owner: 'testOwner',\n        repo: '[ repo1 , repo2]\\nrepo3,,'\n      }),\n      context,\n      {}\n    )\n\n    expect(inputs.repositories).toEqual(['repo1', 'repo2', 'repo3'])\n  })\n\n  it('logs every repository and pluralises the count', () => {\n    const fake = fakeCore({token: 't', owner: 'testOwner', repo: 'repo1,repo2'})\n\n    parseInputs(fake, context, {})\n\n    expect(fake.info.mock.calls.map(c => c[0])).toEqual([\n      'testOwner/repo1',\n      'testOwner/repo2',\n      '2 repositories registered.'\n    ])\n  })\n\n  it.each([\n    ['true', true],\n    ['false', false],\n    ['', false],\n    ['yes', false]\n  ])(\"maps filtered input '%s' to %s\", (value, expected) => {\n    const inputs = parseInputs(\n      fakeCore({token: 't', repo: 'r', owner: 'o', filtered: value}),\n      context,\n      {}\n    )\n\n    expect(inputs.filtered).toBe(expected)\n  })\n\n  it.each([\n    ['true', true],\n    ['false', false],\n    ['', false]\n  ])(\"maps logging input '%s' to %s\", (value, expected) => {\n    const inputs = parseInputs(\n      fakeCore({token: 't', repo: 'r', owner: 'o', logging: value}),\n      context,\n      {}\n    )\n\n    expect(inputs.logging).toBe(expected)\n  })\n\n  it(\"passes the 'bug-label' input through\", () => {\n    const fake = fakeCore({\n      token: 't',\n      repo: 'r',\n      owner: 'o',\n      'bug-label': 'incident'\n    })\n\n    const inputs = parseInputs(fake, context, {})\n\n    expect(fake.getInput).toHaveBeenCalledWith('bug-label')\n    expect(inputs.bugLabel).toBe('incident')\n  })\n\n  it(\"defaults 'bug-label' to 'bug' when the input is empty\", () => {\n    const inputs = parseInputs(\n      fakeCore({token: 't', repo: 'r', owner: 'o'}),\n      context,\n      {}\n    )\n\n    expect(inputs.bugLabel).toBe('bug')\n  })\n})\n\ndescribe('run', () => {\n  const client = {} as GitHubClient\n\n  function inputsWith(overrides: Partial<"+"Inputs> = {}): Inputs {\n    return {\n      owner: 'o',\n      repositories: ['repo1'],\n      token: 't',\n      logging: false,\n      filtered: false,\n      bugLabel: 'bug',\n      ...overrides\n    }\n  }\n\n  const mockReleases = [{}, {}] as Release[]\n  const mockPRs = [{}, {}] as PullRequest[]\n  const mockIssues = [{}, {}] as Issue[]\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n    ;(\n      ReleaseAdapter.prototype.GetAllReleasesLastMonth as Mock\n    ).mockResolvedValue(mockReleases)\n    ;(\n      PullRequestsAdapter.prototype.GetAllPRsLastMonth as Mock\n    ).mockResolvedValue(mockPRs)\n    ;(IssuesAdapter.prototype.GetAllIssuesLastMonth as Mock).mockResolvedValue(\n      mockIssues\n    )\n    ;(DeployFrequency.prototype.rate as Mock).mockReturnValue('5')\n    ;(DeployFrequency.prototype.getLog as Mock).mockReturnValue([\n      {kind: 'release', at: '2023-04-22T20:28:29Z', name: 'v0.0.2'},\n      {kind: 'release', at: '2023-04-12T22:33:24Z', name: 'v0.0.1'}\n    ])\n    ;(LeadTime.prototype.getLeadTime as Mock).mockResolvedValue(10)\n    ;(LeadTime.prototype.getLog as Mock).mockReturnValue([\n      {\n        kind: 'pull',\n        at: '2023-04-28T17:50:53Z',\n        title: 'feat: something',\n        commitAt: '2023-04-20T00:00:00Z',\n        commitMessage: 'first',\n        releaseAt: '2023-04-30T17:50:53Z',\n        release: 'v1.0.0',\n        leadTimeDays: 10.74\n      }\n    ])\n    ;(ChangeFailureRate.prototype.Cfr as Mock).mockReturnValue(0.1)\n    ;(ChangeFailureRate.prototype.getLog as Mock).mockReturnValue([\n      {\n        kind: 'failed-release',\n        at: '2023-04-12T22:33:24Z',\n        name: 'v0.0.1',\n        bugs: [{number: 3, title: 'bug: x', createdAt: '2023-04-13T00:00:00Z'}]\n      }\n    ])\n    ;(MeanTimeToRestore.prototype.mttr as Mock).mockReturnValue(3)\n  })\n\n  it('wires the injected client, owner and repositories into every adapter', async () => {\n    const inputs = inputsWith({owner: 'o', repositories: ['repo1', 'repo2']})\n\n    await run({inputs, client, core: fakeCore({})})\n\n    expect(ReleaseAdapter).toHaveBeenCalledWith(client, 'o', ['repo1', 'repo2'])\n    expect(PullRequestsAdapter).toHaveBeenCalledWith(client, 'o', [\n      'repo1',\n      'repo2'\n    ])\n    expect(CommitsAdapter).toHaveBeenCalledWith(client)\n    expect(IssuesAdapter).toHaveBeenCalledWith(client, 'o', ['repo1', 'repo2'])\n  })\n\n  it('feeds the fetched releases, pulls, commits and issues into the metrics', async () => {\n    await run({inputs: inputsWith(), client, core: fakeCore({})})\n\n    const commits = vi.mocked(CommitsAdapter).mock.instances[0]\n    expect(DeployFrequency).toHaveBeenCalledWith(mockReleases)\n    expect(LeadTime).toHaveBeenCalledWith(mockPRs, mockReleases, commits)\n    expect(ChangeFailureRate).toHaveBeenCalledWith(\n      mockIssues,\n      mockReleases,\n      null,\n      'bug'\n    )\n    expect(MeanTimeToRestore).toHaveBeenCalledWith(\n      mockIssues,\n      mockReleases,\n      null,\n      'bug'\n    )\n  })\n\n  it('sets and returns all outputs including logs when logging is enabled', async () => {\n    const fake = fakeCore({})\n\n    const outputs = await run({\n      inputs: inputsWith({logging: true}),\n      client,\n      core: fake\n    })\n\n    const expected = {\n      'deploy-rate': '5',\n      'deploy-rate-log':\n        '[{\"kind\":\"release\",\"at\":\"2023-04-22T20:28:29Z\",\"name\":\"v0.0.2\"},' +\n        '{\"kind\":\"release\",\"at\":\"2023-04-12T22:33:24Z\",\"name\":\"v0.0.1\"}]',\n      'lead-time': 10,\n      'lead-time-log':\n        '[{\"kind\":\"pull\",\"at\":\"2023-04-28T17:50:53Z\",\"title\":\"feat: something\",' +\n        '\"commitAt\":\"2023-04-20T00:00:00Z\",\"commitMessage\":\"first\",' +\n        '\"releaseAt\":\"2023-04-30T17:50:53Z\",\"release\":\"v1.0.0\",\"leadTimeDays\":10.74}]',\n      'change-failure-rate': 0.1,\n      'change-failure-rate-log':\n        '[{\"kind\":\"failed-release\",\"at\":\"2023-04-12T22:33:24Z\",\"name\":\"v0.0.1\",' +\n        '\"bugs\":[{\"number\":3,\"title\":\"bug: x\",\"createdAt\":\"2023-04-13T00:00:00Z\"}]}]',\n      mttr: 3\n    }\n    expect(outputs).toEqual(expected)\n    expect(fake.setOutput.mock.calls).toEqual(Object.entries(expected))\n    expect(JSON.parse(outputs['deploy-rate-log'] as string)).toHaveLength(2)\n    expect(JSON.parse(outputs['lead-time-log'] as string)).toHaveLength(1)\n    expect(\n      JSON.parse(outputs['change-failure-rate-log'] as string)\n    ).toHaveLength(1)\n  })\n\n  it('does not set log outputs when logging is disabled', async () => {\n    const fake = fakeCore({})\n\n    const outputs = await run({\n      inputs: inputsWith({logging: false}),\n      client,\n      core: fake\n    })\n\n    const expected = {\n      'deploy-rate': '5',\n      'lead-time': 10,\n      'change-failure-rate': 0.1,\n      mttr: 3\n    }\n    expect(outputs).toEqual(expected)\n    expect(fake.setOutput.mock.calls).toEqual(Object.entries(expected))\n  })\n\n  it('reports an empty issue list instead of computing change-failure-rate and mttr', async () => {\n    ;(IssuesAdapter.prototype.GetAllIssuesLastMonth as Mock).mockResolvedValue(\n      []\n    )\n    const fake = fakeCore({})\n\n    await run({inputs: inputsWith(), client, core: fake})\n\n    expect(ChangeFailureRate).toHaveBeenCalledWith(\n      [],\n      mockReleases,\n      null,\n      'bug'\n    )\n    expect(MeanTimeToRestore).toHaveBeenCalledWith(\n      [],\n      mockReleases,\n      null,\n      'bug'\n    )\n  })\n\n  /* eslint-disable @typescript-eslint/unbound-method */\n  it.each([\n    ['releases', () => ReleaseAdapter.prototype.GetAllReleasesLastMonth],\n    ['pulls', () => PullRequestsAdapter.prototype.GetAllPRsLastMonth],\n    ['issues', () => IssuesAdapter.prototype.GetAllIssuesLastMonth],\n    ['commits (via lead time)', () => LeadTime.prototype.getLeadTime]\n  ])(\n    'aborts before any output is set when fetching %s fails',\n    async (_name, method) => {\n      ;(method() as Mock).mockRejectedValueOnce(new Error('Failed to fetch'))\n      const fake = fakeCore({})\n\n      await expect(\n        run({inputs: inputsWith(), client, core: fake})\n      ).rejects.toThrow('Failed to fetch')\n      expect(fake.setOutput).not.toHaveBeenCalled()\n    }\n  )\n\n  it('fetches releases, pulls and issues before computing any metric', async () => {\n    await run({inputs: inputsWith(), client, core: fakeCore({})})\n\n    const order = (m: Mock): number => m.mock.invocationCallOrder[0]\n    const lastFetch = Math.max(\n      order(ReleaseAdapter.prototype.GetAllReleasesLastMonth as Mock),\n      order(PullRequestsAdapter.prototype.GetAllPRsLastMonth as Mock),\n      order(IssuesAdapter.prototype.GetAllIssuesLastMonth as Mock)\n    )\n    expect(order(vi.mocked(DeployFrequency))).toBeGreaterThan(lastFetch)\n    expect(order(vi.mocked(LeadTime))).toBeGreaterThan(lastFetch)\n    expect(order(vi.mocked(ChangeFailureRate))).toBeGreaterThan(lastFetch)\n    expect(order(vi.mocked(MeanTimeToRestore))).toBeGreaterThan(lastFetch)\n  })\n  /* eslint-enable @typescript-eslint/unbound-method */\n\n  it.each([true, false])('passes filtered=%s to LeadTime', async filtered => {\n    await run({inputs: inputsWith({filtered}), client, core: fakeCore({})})\n\n    // eslint-disable-next-line @typescript-eslint/unbound-method\n    expect(LeadTime.prototype.getLeadTime as Mock).toHaveBeenCalledWith(\n      filtered\n    )\n  })\n\n  it('passes the bug label to ChangeFailureRate and MeanTimeToRestore', async () => {\n    await run({\n      inputs: inputsWith({bugLabel: 'incident'}),\n      client,\n      core: fakeCore({})\n    })\n\n    expect(ChangeFailureRate).toHaveBeenCalledWith(\n      mockIssues,\n      mockReleases,\n      null,\n      'incident'\n    )\n    expect(MeanTimeToRestore).toHaveBeenCalledWith(\n      mockIssues,\n      mockReleases,\n      null,\n      'incident'\n    )\n  })\n})\n"},"__tests__/MeanTimeToRestore.test.ts":{"tests":[{"id":"93","name":"MeanTimeToRestore should get bugs last month"},{"id":"94","name":"MeanTimeToRestore should find release time before date"},{"id":"95","name":"MeanTimeToRestore should throw error when no earlier dates"},{"id":"96","name":"MeanTimeToRestore should find release time after date"},{"id":"97","name":"MeanTimeToRestore should throw error when no later dates"},{"id":"98","name":"MeanTimeToRestore should check if there are later releases"},{"id":"99","name":"MeanTimeToRestore should get time for a bug 1"},{"id":"100","name":"MeanTimeToRestore should get time for a bug 2"},{"id":"101","name":"MeanTimeToRestore should get mttr for bug 1 when no release after bug 2"},{"id":"102","name":"MeanTimeToRestore should throw error when empty release list"},{"id":"103","name":"MeanTimeToRestore should get mttr for bug 1 when release in wrong repo after bug 2"},{"id":"104","name":"MeanTimeToRestore should get mttr for 2 bugs when release after bug 2"},{"id":"105","name":"MeanTimeToRestore should get mttr for 2 bugs on two repos when release after bug 2"},{"id":"106","name":"MeanTimeToRestore should get mttr for 2 bugs on two repos when no release after bug 1"},{"id":"107","name":"MeanTimeToRestore should not attribute releases of a repo whose name is a prefix of another"},{"id":"108","name":"MeanTimeToRestore should get average time to repair"},{"id":"109","name":"MeanTimeToRestore should throw excepiton when no releases"},{"id":"110","name":"MeanTimeToRestore should return 0 when no bugs"},{"id":"111","name":"MeanTimeToRestore should throw exception when release list is null"},{"id":"112","name":"MeanTimeToRestore should not mutate the release list passed in"},{"id":"113","name":"MeanTimeToRestore should release boundaries not count a release published at the exact date as previous"},{"id":"114","name":"MeanTimeToRestore should release boundaries not count releases of other repos as previous"},{"id":"115","name":"MeanTimeToRestore should release boundaries skip a closer release of another repo in getReleaseBefore and getReleaseAfter"},{"id":"116","name":"MeanTimeToRestore should release boundaries not count a release published at the exact date as later"},{"id":"117","name":"MeanTimeToRestore should release boundaries skip the release published at the exact date in getReleaseBefore"},{"id":"118","name":"MeanTimeToRestore should release boundaries skip the release published at the exact date in getReleaseAfter"},{"id":"119","name":"MeanTimeToRestore should bug selection ignore bugs that are still open"},{"id":"120","name":"MeanTimeToRestore should bug selection ignore bugs created 30 days ago or earlier"},{"id":"121","name":"MeanTimeToRestore should with a custom bug label count issues tagged with the custom label"},{"id":"122","name":"MeanTimeToRestore should with a custom bug label ignore issues tagged bug when a custom label is given"},{"id":"123","name":"MeanTimeToRestore should with a custom bug label default to the bug label when none is given"}],"source":"import type {Issue} from '../src/types/Issue'\nimport type {Release} from '../src/types/Release'\nimport type {\n  GitHubIssuePayload,\n  GitHubReleasePayload\n} from '../src/github/payloads'\nimport {toIssue, toRelease} from '../src/github/mappers'\nimport fs from 'node:fs'\nimport {type BugTime, MeanTimeToRestore} from '../src/MeanTimeToRestore'\nimport {issue, release, ts} from './helpers/domain'\n\nconst DMA = 'stenjo/devops-metrics-action'\nconst REPOSITORY = 'some-path/repository'\nconst OTHER = 'some-path/other-repo'\n\ndescribe('MeanTimeToRestore should', () => {\n  const issues: Issue[] = (\n    JSON.parse(\n      fs.readFileSync('./__tests__/test-data/issue-list.json').toString()\n    ) as GitHubIssuePayload[]\n  ).map(p => toIssue('stenjo', 'devops-metrics-action', p))\n  const releases: Release[] = (\n    JSON.parse(\n      fs.readFileSync('./__tests__/test-data/releases.json').toString()\n    ) as GitHubReleasePayload[]\n  ).map(p => toRelease('stenjo', 'devops-metrics-action', p))\n  const mttr = new MeanTimeToRestore(\n    issues,\n    releases,\n    new Date('2023-04-30T16:50:53Z')\n  )\n\n  it('get bugs last month', () => {\n    const bugCount = mttr.getBugCount()\n\n    expect(bugCount.length).toBe(2)\n    expect(bugCount[0].start).toBe(ts('2023-04-25T21:21:49Z'))\n    expect(bugCount[1].end).toBe(ts('2023-04-23T16:47:40Z'))\n  })\n\n  it('find release time before date', () => {\n    const before1 = mttr.getReleaseBefore(ts('2023-04-25T21:21:49Z'), DMA)\n    const before2 = mttr.getReleaseBefore(ts('2023-04-29T12:54:45Z'), DMA)\n\n    expect(before1.publishedAt).toBe(ts('2023-04-22T20:28:29Z'))\n    expect(before2.publishedAt).toBe(ts('2023-04-29T06:18:36Z'))\n  })\n\n  it('throw error when no earlier dates', () => {\n    const t = (): void => {\n      mttr.getReleaseBefore(ts('2023-04-05T21:21:49Z'), DMA)\n    }\n\n    expect(t).toThrow('No previous releases')\n  })\n\n  it('find release time after date', () => {\n    const after1 = mttr.getReleaseAfter(ts('2023-04-25T21:21:49Z'), DMA)\n    const after2 = mttr.getReleaseAfter(ts('2023-04-29T12:54:45Z'), DMA)\n\n    expect(after1.publishedAt).toBe(ts('2023-04-29T06:18:36Z'))\n    expect(after2.publishedAt).toBe(ts('2023-04-30T16:06:06Z'))\n  })\n\n  it('throw error when no later dates', () => {\n    const t = (): void => {\n      mttr.getReleaseAfter(ts('2023-05-05T21:21:49Z'), DMA)\n    }\n\n    expect(t).toThrow('No later releases')\n  })\n\n  it('check if there are later releases', () => {\n    const hasLaterRelease = mttr.hasLaterRelease(\n      ts('2023-04-29T12:54:45Z'),\n      DMA\n    )\n    const hasNoLaterRelease = mttr.hasLaterRelease(\n      ts('2023-04-30T17:29:44Z'),\n      DMA\n    )\n\n    expect(hasLaterRelease).toBe(true)\n    expect(hasNoLaterRelease).toBe(false)\n  })\n\n  it('get time for a bug 1', () => {\n    const bug: BugTime = {\n      start: ts('2023-04-22T21:44:06Z'),\n      end: ts('2023-04-23T16:47:40Z'),\n      repo: DMA\n    }\n    const releaseDiff = ts('2023-04-29T06:18:36Z') - ts('2023-04-22T20:28:29Z')\n\n    const fixTime: number = mttr.getRestoreTime(bug)\n\n    expect(fixTime).toBe(releaseDiff)\n  })\n  it('get time for a bug 2', () => {\n    const bug: BugTime = {\n      start: ts('2023-04-25T21:21:49Z'),\n      end: ts('2023-04-29T12:54:45Z'),\n      repo: DMA\n    }\n    const releaseDiff = ts('2023-04-30T16:06:06Z') - ts('2023-04-22T20:28:29Z')\n\n    const fixTime: number = mttr.getRestoreTime(bug)\n\n    expect(fixTime).toBe(releaseDiff)\n  })\n\n  const twoBugs = (): Issue[] => [\n    issue({\n      repo: REPOSITORY,\n      createdAt: ts('2023-04-22T21:44:06Z'),\n      closedAt: ts('2023-04-23T16:47:40Z')\n    }),\n    issue({\n      repo: REPOSITORY,\n      createdAt: ts('2023-04-25T21:21:49Z'),\n      closedAt: ts('2023-04-29T12:54:45Z')\n    })\n  ]\n\n  it('get mttr for bug 1 when no release after bug 2', () => {\n    const localReleases = [\n      release('2023-04-25T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(\n      twoBugs(),\n      localReleases,\n      new Date('2023-04-29T12:54:45Z')\n    )\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(4)\n  })\n\n  it('throw error when empty release list', () => {\n    const m = (): void => {\n      new MeanTimeToRestore([] as Issue[], [] as Release[])\n    }\n    expect(m).toThrow('Empty release list')\n  })\n\n  it('get mttr for bug 1 when release in wrong repo after bug 2', () => {\n    const localReleases = [\n      release('2023-04-25T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-30T00:00:00Z', OTHER),\n      release('2023-04-20T00:00:00Z', REPOSITORY)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(\n      twoBugs(),\n      localReleases,\n      new Date('2023-04-30T00:00:00Z')\n    )\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(4)\n  })\n\n  it('get mttr for 2 bugs when release after bug 2', () => {\n    const localReleases = [\n      release('2023-04-30T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(\n      twoBugs(),\n      localReleases,\n      new Date('2023-04-30T00:00:00Z')\n    )\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(5)\n  })\n\n  it('get mttr for 2 bugs on two repos when release after bug 2', () => {\n    const bugList: Issue[] = [\n      issue({\n        // 21 -> 24 = 3\n        repo: OTHER,\n        createdAt: ts('2023-04-22T21:44:06Z'),\n        closedAt: ts('2023-04-23T16:47:40Z')\n      }),\n      issue({\n        // 24 -> 30 = 6\n        repo: REPOSITORY,\n        createdAt: ts('2023-04-25T21:21:49Z'),\n        closedAt: ts('2023-04-29T12:54:45Z')\n      })\n    ]\n    const localReleases = [\n      release('2023-04-30T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY),\n      release('2023-04-21T00:00:00Z', OTHER),\n      release('2023-04-24T00:00:00Z', OTHER)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(\n      bugList,\n      localReleases,\n      new Date('2023-04-30T00:00:00Z')\n    )\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(4.5)\n  })\n\n  it('get mttr for 2 bugs on two repos when no release after bug 1', () => {\n    const bugList: Issue[] = [\n      issue({\n        repo: OTHER,\n        createdAt: ts('2023-04-22T21:44:06Z'),\n        closedAt: ts('2023-04-23T16:47:40Z')\n      }),\n      issue({\n        // 24 -> 30 = 6\n        repo: REPOSITORY,\n        createdAt: ts('2023-04-25T21:21:49Z'),\n        closedAt: ts('2023-04-29T12:54:45Z')\n      })\n    ]\n    const localReleases = [\n      release('2023-04-30T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY),\n      release('2023-04-21T00:00:00Z', OTHER)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(\n      bugList,\n      localReleases,\n      new Date('2023-04-30T00:00:00Z')\n    )\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(6)\n  })\n\n  it('not attribute releases of a repo whose name is a prefix of another', () => {\n    const bug = issue({\n      repo: 'o/api',\n      createdAt: ts('2023-04-25T00:00:00Z'),\n      closedAt: ts('2023-04-26T00:00:00Z')\n    })\n    const gatewayOnly = [\n      release('2023-04-20T00:00:00Z', 'o/api-gateway'),\n      release('2023-04-28T00:00:00Z', 'o/api-gateway')\n    ]\n    const both = [\n      ...gatewayOnly,\n      release('2023-04-22T00:00:00Z', 'o/api'),\n      release('2023-04-30T00:00:00Z', 'o/api')\n    ]\n    const today = new Date('2023-05-01T00:00:00Z')\n\n    expect(new MeanTimeToRestore([bug], gatewayOnly, today).mttr()).toBe(0)\n    expect(new MeanTimeToRestore([bug], both, today).mttr()).toBe(8) // 22/4 -> 30/4\n  })\n\n  it('get average time to repair', () => {\n    const avMttr: number = mttr.mttr()\n\n    expect(avMttr).toBeGreaterThan(6.4)\n    expect(avMttr).toBeLessThan(7.9)\n  })\n\n  it('throw excepiton when no releases', () => {\n    const emptyReleaseList: Release[] = []\n\n    const t = (): void => {\n      new MeanTimeToRestore(issues, emptyReleaseList)\n    }\n\n    expect(t).toThrow('Empty release list')\n  })\n\n  it('return 0 when no bugs', () => {\n    const emptyBugList: Issue[] = []\n\n    const mttrEmpty = new MeanTimeToRestore(emptyBugList, releases)\n    const meanTime = mt
