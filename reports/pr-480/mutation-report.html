trEmpty.mttr()\n\n    expect(meanTime).toBe(0)\n  })\n\n  it('throw exception when release list is null', () => {\n    const t = (): void => {\n      new MeanTimeToRestore(issues, null as unknown as Release[])\n    }\n\n    expect(t).toThrow('Empty release list')\n  })\n\n  it('not mutate the release list passed in', () => {\n    const input = [\n      release('2023-04-30T00:00:00Z', REPOSITORY, 'late'),\n      release('2023-04-20T00:00:00Z', REPOSITORY, 'early')\n    ]\n\n    const m = new MeanTimeToRestore([], input)\n\n    expect(input.map(r => r.name)).toEqual(['late', 'early'])\n    expect(m.releases.map(r => r.name)).toEqual(['early', 'late'])\n  })\n\n  describe('release boundaries', () => {\n    const first = ts('2023-04-12T22:33:24Z')\n    const second = ts('2023-04-22T20:28:29Z')\n    const third = ts('2023-04-29T06:18:36Z')\n    const last = ts('2023-04-30T17:29:44Z')\n\n    it('not count a release published at the exact date as previous', () => {\n      expect(mttr.hasPreviousRelease(first, DMA)).toBe(false)\n      expect(mttr.hasPreviousRelease(first + 1, DMA)).toBe(true)\n    })\n\n    it('not count releases of other repos as previous', () => {\n      expect(mttr.hasPreviousRelease(last + 1, 'stenjo/unknown-repo')).toBe(\n        false\n      )\n    })\n\n    it('skip a closer release of another repo in getReleaseBefore and getReleaseAfter', () => {\n      const m = new MeanTimeToRestore(\n        [],\n        [\n          release('2023-04-10T00:00:00Z', 'o/api', 'api-before'),\n          release('2023-04-14T00:00:00Z', 'o/api-gateway', 'gw-before'),\n          release('2023-04-16T00:00:00Z', 'o/api-gateway', 'gw-after'),\n          release('2023-04-20T00:00:00Z', 'o/api', 'api-after')\n        ]\n      )\n      const date = ts('2023-04-15T00:00:00Z')\n\n      expect(m.getReleaseBefore(date, 'o/api').name).toBe('api-before')\n      expect(m.getReleaseAfter(date, 'o/api').name).toBe('api-after')\n    })\n\n    it('not count a release published at the exact date as later', () => {\n      expect(mttr.hasLaterRelease(last, DMA)).toBe(false)\n      expect(mttr.hasLaterRelease(last - 1, DMA)).toBe(true)\n    })\n\n    it('skip the release published at the exact date in getReleaseBefore', () => {\n      expect(mttr.getReleaseBefore(second, DMA).publishedAt).toBe(first)\n      expect(mttr.getReleaseBefore(second + 1, DMA).publishedAt).toBe(second)\n    })\n\n    it('skip the release published at the exact date in getReleaseAfter', () => {\n      expect(mttr.getReleaseAfter(second, DMA).publishedAt).toBe(third)\n      expect(mttr.getReleaseAfter(second - 1, DMA).publishedAt).toBe(second)\n    })\n  })\n\n  describe('bug selection', () => {\n    const DORA = 'stenjo/dora'\n    const localReleases = [\n      release('2023-03-25T00:00:00Z', DORA),\n      release('2023-04-30T00:00:00Z', DORA)\n    ]\n    const today = new Date('2023-05-01T00:00:00Z')\n\n    it('ignore bugs that are still open', () => {\n      const bugs = [\n        issue({\n          repo: DORA,\n          createdAt: ts('2023-04-10T00:00:00Z'),\n          closedAt: null\n        })\n      ]\n      const m = new MeanTimeToRestore(bugs, localReleases, today)\n\n      expect(m.getBugCount()).toEqual([])\n      expect(m.mttr()).toBe(0)\n    })\n\n    it('ignore bugs created 30 days ago or earlier', () => {\n      const bug = issue({repo: DORA, closedAt: ts('2023-04-20T00:00:00Z')})\n      const onBoundary = new MeanTimeToRestore(\n        [{...bug, createdAt: ts('2023-04-01T00:00:00Z')}],\n        localReleases,\n        today\n      )\n      const older = new MeanTimeToRestore(\n        [{...bug, createdAt: ts('2023-03-28T00:00:00Z')}],\n        localReleases,\n        today\n      )\n      const inside = new MeanTimeToRestore(\n        [{...bug, createdAt: ts('2023-04-01T00:00:01Z')}],\n        localReleases,\n        today\n      )\n\n      expect(onBoundary.getBugCount()).toEqual([])\n      expect(older.getBugCount()).toEqual([])\n      expect(inside.getBugCount().length).toBe(1)\n    })\n  })\n\n  describe('with a custom bug label', () => {\n    const localReleases = [\n      release('2023-04-30T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY)\n    ]\n    const today = new Date('2023-04-30T00:00:00Z')\n\n    const issuesLabelled = (label: string): Issue[] =>\n      twoBugs().map(b => ({...b, labels: [label]}))\n\n    it('count issues tagged with the custom label', () => {\n      const mttrCustom = new MeanTimeToRestore(\n        issuesLabelled('incident'),\n        localReleases,\n        today,\n        'incident'\n      )\n\n      expect(mttrCustom.getBugCount().length).toBe(2)\n      expect(mttrCustom.mttr()).toBe(5)\n    })\n\n    it('ignore issues tagged bug when a custom label is given', () => {\n      const mttrCustom = new MeanTimeToRestore(\n        issuesLabelled('bug'),\n        localReleases,\n        today,\n        'incident'\n      )\n\n      expect(mttrCustom.getBugCount().length).toBe(0)\n      expect(mttrCustom.mttr()).toBe(0)\n    })\n\n    it('default to the bug label when none is given', () => {\n      const mttrDefault = new MeanTimeToRestore(\n        issuesLabelled('bug'),\n        localReleases,\n        today\n      )\n      const mttrIncident = new MeanTimeToRestore(\n        issuesLabelled('incident'),\n        localReleases,\n        today\n      )\n\n      expect(mttrDefault.getBugCount().length).toBe(2)\n      expect(mttrIncident.getBugCount().length).toBe(0)\n    })\n  })\n})\n"},"__tests__/GitHubClient.spec.ts":{"tests":[{"id":"124","name":"GitHubClient constructor creates one Octokit authenticated with the token"},{"id":"125","name":"GitHubClient constructor creates an unauthenticated Octokit when no options are given"},{"id":"126","name":"GitHubClient constructor passes baseUrl through when provided"},{"id":"127","name":"GitHubClient request refuses absolute URLs so the token never leaves the configured API host"},{"id":"128","name":"GitHubClient request adds the api-version header and returns data"},{"id":"129","name":"GitHubClient request defaults params to an empty object"},{"id":"130","name":"GitHubClient request wraps errors in a GitHubApiError with a stable message, status, route and cause"},{"id":"131","name":"GitHubClient request reports an unknown status when the error carries none"},{"id":"132","name":"GitHubClient request reports an unknown status when the status is not a number"},{"id":"133","name":"GitHubClient request wraps non-object rejections too"},{"id":"134","name":"GitHubClient paginate requests page 1 with per_page 100 and the given params"},{"id":"135","name":"GitHubClient paginate defaults params to an empty object"},{"id":"136","name":"GitHubClient paginate concatenates pages until a page is not full"},{"id":"137","name":"GitHubClient paginate stops after exactly one page when it is empty"},{"id":"138","name":"GitHubClient paginate stops after exactly one page when it has 99 items"},{"id":"139","name":"GitHubClient paginate requests pages 1 to 99 at most when every page is full"},{"id":"140","name":"GitHubClient paginate stops at the first item matching until and drops it and the rest"},{"id":"141","name":"GitHubClient paginate returns nothing when the very first item matches until"},{"id":"142","name":"GitHubClient paginate keeps paging when until never matches"},{"id":"143","name":"GitHubClient paginate propagates errors from any page"}],"source":"import {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport {Octokit} from '@octokit/core'\n\nvi.mock('@octokit/core')\n\ndescribe('GitHubClient', () => {\n  let mockRequest: Mock\n\n  beforeEach(() => {\n    mockRequest = vi.fn()\n    ;(Octokit as unknown as Mock).mockImplementation(function () {\n      return {request: mockRequest}\n    })\n  })\n\n  afterEach(() => {\n    vi.clearAllMocks()\n  })\n\n  describe('constructor', () => {\n    it('creates one Octokit authenticated with the token', () => {\n      const client = new GitHubClient({token: 'my-token'})\n\n      expect(Octokit).toHaveBeenCalledTimes(1)\n      expect(Octokit).toHaveBeenCalledWith({auth: 'my-token'})\n      expect(client.octokit).toBeDefined()\n    })\n\n    it('creates an unauthenticated Octokit when no options are given', () => {\n      new GitHubClient()\n\n      expect(Octokit).toHaveBeenCalledWith({auth: undefined})\n      expect(vi.mocked(Octokit).mock.calls[0][0]).not.toHaveProperty('baseUrl')\n    })\n\n    it('passes baseUrl through when provided', () => {\n      new GitHubClient({token: 't', baseUrl: 'https://ghe.example.com/api/v3'})\n\n      expect(Octokit).toHaveBeenCalledWith({\n        auth: 't',\n        baseUrl: 'https://ghe.example.com/api/v3'\n      })\n    })\n  })\n\n  describe('request', () => {\n    it('refuses absolute URLs so the token never leaves the configured API host', async () => {\n      const client = new GitHubClient({token: 't'})\n\n      await expect(\n        client.request('https://evil.example/repos/o/r/pulls/1/commits')\n      ).rejects.toThrow(\n        new TypeError(\n          'Refusing to request a non-route URL: https://evil.example/repos/o/r/pulls/1/commits'\n        )\n      )\n      await expect(client.request('')).rejects.toThrow(TypeError)\n      await expect(\n        client.request('https://evil.example/?q=GET /repos')\n      ).rejects.toThrow(TypeError)\n      expect(mockRequest).not.toHaveBeenCalled()\n    })\n\n    it('adds the api-version header and returns data', async () => {\n      mockRequest.mockResolvedValue({data: [{id: 1}]})\n      const client = new GitHubClient()\n\n      const result = await client.request<"+"{id: number}[]>('GET /x', {\n        owner: 'o'\n      })\n\n      expect(mockRequest).toHaveBeenCalledWith('GET /x', {\n        owner: 'o',\n        headers: {'X-GitHub-Api-Version': '2022-11-28'}\n      })\n      expect(result).toEqual([{id: 1}])\n    })\n\n    it('defaults params to an empty object', async () => {\n      mockRequest.mockResolvedValue({data: 'ok'})\n      const client = new GitHubClient()\n\n      await client.request('GET /x')\n\n      expect(mockRequest).toHaveBeenCalledWith('GET /x', {\n        headers: {'X-GitHub-Api-Version': '2022-11-28'}\n      })\n    })\n\n    it('wraps errors in a GitHubApiError with a stable message, status, route and cause', async () => {\n      const cause = Object.assign(new Error('Forbidden: see https://x/y'), {\n        status: 403\n      })\n      mockRequest.mockRejectedValue(cause)\n      const client = new GitHubClient()\n\n      const error = await client.request('GET /x').catch((e: unknown) => e)\n\n      expect(error).toBeInstanceOf(GitHubApiError)\n      expect(error).toMatchObject({\n        name: 'GitHubApiError',\n        message: 'GitHub API request failed (403) for GET /x',\n        status: 403,\n        route: 'GET /x',\n        cause\n      })\n    })\n\n    it('reports an unknown status when the error carries none', async () => {\n      mockRequest.mockRejectedValue(new Error('socket hang up'))\n      const client = new GitHubClient()\n\n      await expect(client.request('GET /x')).rejects.toMatchObject({\n        message: 'GitHub API request failed (unknown) for GET /x',\n        status: undefined\n      })\n    })\n\n    it('reports an unknown status when the status is not a number', async () => {\n      mockRequest.mockRejectedValue({status: '403'})\n      const client = new GitHubClient()\n\n      await expect(client.request('GET /x')).rejects.toMatchObject({\n        message: 'GitHub API request failed (unknown) for GET /x'\n      })\n    })\n\n    it('wraps non-object rejections too', async () => {\n      mockRequest.mockRejectedValue(undefined)\n      const client = new GitHubClient()\n\n      await expect(client.request('GET /x')).rejects.toMatchObject({\n        message: 'GitHub API request failed (unknown) for GET /x',\n        cause: undefined\n      })\n    })\n  })\n\n  describe('paginate', () => {\n    const page = (length: number, offset = 0): {id: number}[] =>\n      Array.from({length}, (_, i) => ({id: offset + i}))\n\n    it('requests page 1 with per_page 100 and the given params', async () => {\n      mockRequest.mockResolvedValue({data: page(1)})\n      const client = new GitHubClient()\n\n      await client.paginate('GET /repos/{owner}/{repo}/x', {\n        owner: 'o',\n        repo: 'r'\n      })\n\n      expect(mockRequest).toHaveBeenCalledTimes(1)\n      expect(mockRequest).toHaveBeenCalledWith('GET /repos/{owner}/{repo}/x', {\n        owner: 'o',\n        repo: 'r',\n        per_page: 100,\n        page: 1,\n        headers: {'X-GitHub-Api-Version': '2022-11-28'}\n      })\n    })\n\n    it('defaults params to an empty object', async () => {\n      mockRequest.mockResolvedValue({data: []})\n      const client = new GitHubClient()\n\n      const result = await client.paginate('GET /x')\n\n      expect(result).toEqual([])\n      expect(mockRequest).toHaveBeenCalledWith('GET /x', {\n        per_page: 100,\n        page: 1,\n        headers: {'X-GitHub-Api-Version': '2022-11-28'}\n      })\n    })\n\n    it('concatenates pages until a page is not full', async () => {\n      mockRequest\n        .mockResolvedValueOnce({data: page(100)})\n        .mockResolvedValueOnce({data: page(100, 100)})\n        .mockResolvedValueOnce({data: page(50, 200)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate<"+"{id: number}>('GET /x')\n\n      expect(mockRequest).toHaveBeenCalledTimes(3)\n      expect(mockRequest.mock.calls.map(c => c[1].page)).toEqual([1, 2, 3])\n      expect(result.length).toBe(250)\n      expect(result[0]).toEqual({id: 0})\n      expect(result[249]).toEqual({id: 249})\n    })\n\n    it('stops after exactly one page when it is empty', async () => {\n      mockRequest.mockResolvedValue({data: []})\n      const client = new GitHubClient()\n\n      const result = await client.paginate('GET /x')\n\n      expect(result).toEqual([])\n      expect(mockRequest).toHaveBeenCalledTimes(1)\n    })\n\n    it('stops after exactly one page when it has 99 items', async () => {\n      mockRequest.mockResolvedValue({data: page(99)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate('GET /x')\n\n      expect(result.length).toBe(99)\n      expect(mockRequest).toHaveBeenCalledTimes(1)\n    })\n\n    it('requests pages 1 to 99 at most when every page is full', async () => {\n      mockRequest.mockResolvedValue({data: page(100)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate('GET /x')\n\n      expect(mockRequest).toHaveBeenCalledTimes(99)\n      expect(mockRequest.mock.calls[0][1].page).toBe(1)\n      expect(mockRequest.mock.calls[98][1].page).toBe(99)\n      expect(result.length).toBe(9900)\n    })\n\n    it('stops at the first item matching until and drops it and the rest', async () => {\n      mockRequest\n        .mockResolvedValueOnce({data: page(100)})\n        .mockResolvedValueOnce({data: page(100, 100)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate<"+"{id: number}>(\n        'GET /x',\n        {},\n        {until: item => item.id === 150}\n      )\n\n      expect(mockRequest).toHaveBeenCalledTimes(2)\n      expect(result.length).toBe(150)\n      expect(result[149]).toEqual({id: 149})\n    })\n\n    it('returns nothing when the very first item matches until', async () => {\n      mockRequest.mockResolvedValue({data: page(100)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate<"+"{id: number}>(\n        'GET /x',\n        {},\n        {until: item => item.id === 0}\n      )\n\n      expect(result).toEqual([])\n      expect(mockRequest).toHaveBeenCalledTimes(1)\n    })\n\n    it('keeps paging when until never matches', async () => {\n      mockRequest\n        .mockResolvedValueOnce({data: page(100)})\n        .mockResolvedValueOnce({data: page(10, 100)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate<"+"{id: number}>(\n        'GET /x',\n        {},\n        {until: () => false}\n      )\n\n      expect(result.length).toBe(110)\n      expect(mockRequest).toHaveBeenCalledTimes(2)\n    })\n\n    it('propagates errors from any page', async () => {\n      mockRequest\n        .mockResolvedValueOnce({data: page(100)})\n        .mockRejectedValueOnce(\n          Object.assign(new Error('rate limited'), {\n            status: 429\n          })\n        )\n      const client = new GitHubClient()\n\n      await expect(client.paginate('GET /x')).rejects.toThrow(\n        'GitHub API request failed (429) for GET /x'\n      )\n    })\n  })\n})\n"},"__tests__/log.spec.ts":{"tests":[{"id":"144","name":"serializeLog renders an empty log as an empty JSON array"},{"id":"145","name":"serializeLog renders every entry when under the caps, with no truncated marker"},{"id":"146","name":"serializeLog defaults to 500 entries and just under 1 MiB"},{"id":"147","name":"serializeLog caps the entry count and appends a truncated record with the omitted count"},{"id":"148","name":"serializeLog keeps exactly maxEntries when the input has exactly that many"},{"id":"149","name":"serializeLog caps the serialized byte size before the entry count is reached"},{"id":"150","name":"serializeLog keeps an entry that fits exactly against the byte cap"},{"id":"151","name":"serializeLog measures multi-byte characters in bytes, not code units"},{"id":"152","name":"serializeLog never exceeds the default byte cap for 1,000 maximal pull records"},{"id":"153","name":"log outputs end to end emits a lead-time log an attacker cannot break out of"},{"id":"154","name":"log outputs end to end emits a deploy-rate log an attacker cannot break out of"},{"id":"155","name":"log outputs end to end bounds the lead-time log for 1,000 pull requests"}],"source":"import {defaultLogLimits, serializeLog} from '../src/log'\nimport type {LogEntry, PullLogEntry} from '../src/types/LogEntry'\nimport {LeadTime} from '../src/LeadTime'\nimport {DeployFrequency} from '../src/DeployFrequency'\nimport {toCommit, toPullRequest, toRelease} from '../src/github/mappers'\nimport type {ICommitsAdapter} from '../src/interfaces/ICommitsAdapter'\nimport type {Commit} from '../src/types/Commit'\nimport {pull, release} from './helpers/domain'\nimport {\n  commitPayload,\n  pullRequestPayload,\n  releasePayload\n} from './helpers/payloads'\n\nconst INJECTION = '`id` ${{ github.token }} $(rm -rf /)\\necho pwned'\nconst UNSAFE = /[`\\n\\r]|\\$\\{|\\$\\(/\n\nfunction releaseEntry(i: number): LogEntry {\n  return {kind: 'release', at: '2023-04-22T20:28:29Z', name: `v${i}`}\n}\n\nfunction stringFields(value: unknown): string[] {\n  if (typeof value === 'string') return [value]\n  if (Array.isArray(value)) return value.flatMap(stringFields)\n  if (value && typeof value === 'object')\n    return Object.values(value).flatMap(stringFields)\n  return []\n}\n\ndescribe('serializeLog', () => {\n  it('renders an empty log as an empty JSON array', () => {\n    expect(serializeLog([])).toBe('[]')\n  })\n\n  it('renders every entry when under the caps, with no truncated marker', () => {\n    const entries = [releaseEntry(1), releaseEntry(2)]\n\n    const out = serializeLog(entries)\n\n    expect(out).toBe(JSON.stringify(entries))\n    expect(JSON.parse(out)).toEqual(entries)\n  })\n\n  it('defaults to 500 entries and just under 1 MiB', () => {\n    expect(defaultLogLimits()).toEqual({maxEntries: 500, maxBytes: 1047552})\n  })\n\n  it('caps the entry count and appends a truncated record with the omitted count', () => {\n    const entries = Array.from({length: 1000}, (_, i) => releaseEntry(i))\n\n    const parsed = JSON.parse(serializeLog(entries)) as LogEntry[]\n\n    expect(parsed).toHaveLength(501)\n    expect(parsed.slice(0, 500)).toEqual(entries.slice(0, 500))\n    expect(parsed[500]).toEqual({kind: 'truncated', omitted: 500})\n  })\n\n  it('keeps exactly maxEntries when the input has exactly that many', () => {\n    const entries = Array.from({length: 3}, (_, i) => releaseEntry(i))\n\n    const parsed = JSON.parse(\n      serializeLog(entries, {maxEntries: 3, maxBytes: 10_000})\n    ) as LogEntry[]\n\n    expect(parsed).toEqual(entries)\n  })\n\n  it('caps the serialized byte size before the entry count is reached', () => {\n    const entries = Array.from({length: 10}, (_, i) => releaseEntry(i))\n    const one = JSON.stringify(releaseEntry(0)).length\n    // A fourth entry fits only if the three separating commas are not counted.\n    const maxBytes = 4 * one + 67\n\n    const out = serializeLog(entries, {maxEntries: 100, maxBytes})\n    const parsed = JSON.parse(out) as LogEntry[]\n\n    expect(Buffer.byteLength(out)).toBeLessThanOrEqual(maxBytes)\n    expect(parsed).toHaveLength(4)\n    expect(parsed.slice(0, 3)).toEqual(entries.slice(0, 3))\n    expect(parsed[3]).toEqual({kind: 'truncated', omitted: 7})\n  })\n\n  it('keeps an entry that fits exactly against the byte cap', () => {\n    const entries = Array.from({length: 3}, (_, i) => releaseEntry(i))\n    const one = JSON.stringify(releaseEntry(0)).length\n    // Brackets + three entries + two commas + the 64-byte truncated reserve.\n    const maxBytes = 2 + 3 * one + 2 + 64\n\n    const parsed = JSON.parse(\n      serializeLog(entries, {maxEntries: 100, maxBytes})\n    ) as LogEntry[]\n\n    expect(parsed).toEqual(entries)\n  })\n\n  it('measures multi-byte characters in bytes, not code units', () => {\n    const wide: LogEntry = {kind: 'release', at: 'x', name: '€€€€€€€€€€'}\n    const bytes = Buffer.byteLength(JSON.stringify(wide))\n    const chars = JSON.stringify(wide).length\n    expect(bytes).toBeGreaterThan(chars)\n\n    const parsed = JSON.parse(\n      serializeLog([wide, wide], {maxEntries: 10, maxBytes: 2 + chars + 64})\n    ) as LogEntry[]\n\n    expect(parsed).toEqual([{kind: 'truncated', omitted: 2}])\n  })\n\n  it('never exceeds the default byte cap for 1,000 maximal pull records', () => {\n    const big: PullLogEntry = {\n      kind: 'pull',\n      at: '2023-04-28T17:50:53Z',\n      title: 'T'.repeat(200),\n      commitAt: '2023-04-20T00:00:00Z',\n      commitMessage: 'M'.repeat(200),\n      releaseAt: '2023-04-30T17:50:53Z',\n      release: 'R'.repeat(200),\n      leadTimeDays: 10.74\n    }\n    const entries = Array.from({length: 1000}, () => big)\n\n    const out = serializeLog(entries)\n\n    expect(Buffer.byteLength(out)).toBeLessThan(1024 * 1024)\n    expect(JSON.parse(out)).toHaveLength(501)\n  })\n})\n\ndescribe('log outputs end to end', () => {\n  const commits: ICommitsAdapter = {\n    getCommits: async (): Promise<"+"Commit[]> => [\n      toCommit(commitPayload('2023-04-20T00:00:00Z', INJECTION))\n    ]\n  }\n  const today = new Date('2023-05-01T00:00:00Z')\n\n  it('emits a lead-time log an attacker cannot break out of', async () => {\n    const pulls = [\n      toPullRequest('o', 'r', pullRequestPayload({title: INJECTION}))\n    ]\n    const releases = [toRelease('o', 'r', releasePayload({name: INJECTION}))]\n    const lt = new LeadTime(pulls, releases, commits, today)\n    await lt.getLeadTime()\n\n    const out = serializeLog(lt.getLog())\n    const parsed = JSON.parse(out) as PullLogEntry[]\n\n    expect(parsed).toHaveLength(1)\n    expect(parsed[0].kind).toBe('pull')\n    expect(parsed[0].title).toBe('id {{ github.token }} (rm -rf /) echo pwned')\n    for (const field of stringFields(parsed)) {\n      expect(field).not.toMatch(UNSAFE)\n    }\n    expect(out).not.toMatch(/[`\\n\\r]|\\$\\{|\\$\\(/)\n  })\n\n  it('emits a deploy-rate log an attacker cannot break out of', () => {\n    const releases = [\n      toRelease(\n        'o',\n        'r',\n        releasePayload({name: INJECTION, published_at: '2023-04-30T17:50:53Z'})\n      )\n    ]\n    const df = new DeployFrequency(releases, '2023-05-01T00:00:00Z')\n    df.rate()\n\n    const out = serializeLog(df.getLog())\n    const parsed = JSON.parse(out) as LogEntry[]\n\n    expect(parsed).toEqual([\n      {\n        kind: 'release',\n        at: '2023-04-30T17:50:53Z',\n        name: 'id {{ github.token }} (rm -rf /) echo pwned'\n      }\n    ])\n    expect(out).not.toMatch(/[`\\n\\r]|\\$\\{|\\$\\(/)\n  })\n\n  it('bounds the lead-time log for 1,000 pull requests', async () => {\n    const pulls = Array.from({length: 1000}, (_, i) =>\n      pull({title: `feat: change ${i.toString()}`})\n    )\n    const lt = new LeadTime(\n      pulls,\n      [release('2023-04-30T17:50:53Z')],\n      commits,\n      today\n    )\n    await lt.getLeadTime()\n\n    const out = serializeLog(lt.getLog())\n    const parsed = JSON.parse(out) as LogEntry[]\n\n    expect(lt.getLog()).toHaveLength(1000)\n    expect(parsed).toHaveLength(501)\n    expect(parsed[0]).toMatchObject({kind: 'pull', title: 'feat: change 0'})\n    expect(parsed[500]).toEqual({kind: 'truncated', omitted: 500})\n    expect(Buffer.byteLength(out)).toBeLessThan(1024 * 1024)\n  })\n})\n"},"__tests__/ReleaseAdapter.test.ts":{"tests":[{"id":"156","name":"Release Adapter should ice breaker"},{"id":"157","name":"Release Adapter should return paged values mapped to the domain type"},{"id":"158","name":"Release Adapter should key releases by the repository they were requested for"},{"id":"159","name":"Release Adapter should request releases since 61 days back with auth and api-version headers"},{"id":"160","name":"Release Adapter should request pages 1 to 99 at most when every page is full"},{"id":"161","name":"Release Adapter should throw a GitHubApiError on access denied"}],"source":"import {http, HttpResponse} from 'msw'\nimport {setupServer} from 'msw/node'\nimport {ReleaseAdapter} from '../src/ReleaseAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport type {Release} from '../src/types/Release'\nimport type {\n  GitHubPersonPayload,\n  GitHubReleasePayload\n} from '../src/github/payloads'\nimport {releasePayload} from './helpers/payloads'\n\nconst server = setupServer(\n  http.get(\n    'https://api.github.com/repos/:owner/:rep/releases',\n    // eslint-disable-next-line @typescript-eslint/no-unused-vars\n    ({request, params, cookies}) => {\n      const url = new URL(request.url)\n      const page = url.searchParams.getAll('page')\n      const releases: GitHubReleasePayload[] = []\n      const author: GitHubPersonPayload = {\n        login: '',\n        id: 0,\n        node_id: '',\n        gravatar_id: '',\n        url: '',\n        html_url: '',\n        followers_url: '',\n        following_url: '',\n        gists_url: '',\n        starred_url: '',\n        subscriptions_url: '',\n        organizations_url: '',\n        repos_url: '',\n        events_url: '',\n        received_events_url: '',\n        type: '',\n        site_admin: false\n      }\n      for (let i = 0; i <"+" (+page <"+" 2 ? 100 : 50); i++) {\n        releases.push({\n          id: i,\n          url: '',\n          uploadUrl: '',\n          author,\n          node_id: '',\n          tag_name: '',\n          target_commitish: '',\n          name: `v${i}`,\n          draft: false,\n          prerelease: false,\n          created_at: '',\n          published_at: '2024-02-01T00:00:00Z',\n          assets: [],\n          tarball_url: '',\n          zipball_url: '',\n          body: ''\n        })\n      }\n      return HttpResponse.json(releases)\n    }\n  )\n)\n\ndescribe('Release Adapter should', () => {\n  beforeAll(() => server.listen())\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n  })\n\n  afterEach(() => server.resetHandlers())\n\n  afterAll(() => server.close())\n\n  it('ice breaker', () => {\n    expect(true).toBe(true)\n  })\n\n  it('return paged values mapped to the domain type', async () => {\n    const r = new ReleaseAdapter(new GitHubClient(), 'Test-Owner', ['Project1'])\n\n    const releases: Release[] = await r.GetAllReleasesLastMonth()\n\n    expect(releases.length).toBe(150)\n    expect(releases[1]).toEqual({\n      repo: 'test-owner/project1',\n      name: 'v1',\n      publishedAt: +new Date('2024-02-01T00:00:00Z')\n    })\n  })\n\n  it('key releases by the repository they were requested for', async () => {\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:repo/releases',\n        ({params}) =>\n          HttpResponse.json([releasePayload({name: `${params.repo}`})])\n      )\n    )\n    const r = new ReleaseAdapter(new GitHubClient(), 'o', [\n      'api',\n      'api-gateway'\n    ])\n\n    const releases = await r.GetAllReleasesLastMonth()\n\n    expect(releases.map(x => [x.repo, x.name])).toEqual([\n      ['o/api', 'api'],\n      ['o/api-gateway', 'api-gateway']\n    ])\n  })\n\n  it('request releases since 61 days back with auth and api-version headers', async () => {\n    const seen: Request[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/releases',\n        ({request}) => {\n          seen.push(request)\n          return HttpResponse.json([releasePayload({id: 1})])\n        }\n      )\n    )\n    const r = new ReleaseAdapter(\n      new GitHubClient({token: 'my-token'}),\n      'test-owner',\n      ['project1']\n    )\n    r.today = new Date('2024-03-01T12:00:00Z')\n\n    await r.GetAllReleasesLastMonth()\n\n    expect(seen.length).toBe(1)\n    const url = new URL(seen[0].url)\n    expect(url.pathname).toBe('/repos/test-owner/project1/releases')\n    expect(url.searchParams.get('state')).toBe('all')\n    expect(url.searchParams.get('since')).toBe('2023-12-31T12:00:00.000Z')\n    expect(url.searchParams.get('per_page')).toBe('100')\n    expect(url.searchParams.get('page')).toBe('1')\n    expect(seen[0].headers.get('authorization')).toBe('token my-token')\n    expect(seen[0].headers.get('x-github-api-version')).toBe('2022-11-28')\n  })\n\n  it('request pages 1 to 99 at most when every page is full', async () => {\n    const pages: string[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/releases',\n        ({request}) => {\n          pages.push(new URL(request.url).searchParams.get('page') as string)\n          return HttpResponse.json(\n            Array.from({length: 100}, (_, i) => releasePayload({id: i}))\n          )\n        }\n      )\n    )\n    const r = new ReleaseAdapter(new GitHubClient(), 'test-owner', ['project1'])\n\n    const releases = await r.GetAllReleasesLastMonth()\n\n    expect(pages.length).toBe(99)\n    expect(pages[0]).toBe('1')\n    expect(pages[1]).toBe('2')\n    expect(pages[98]).toBe('99')\n    expect(releases.length).toBe(9900)\n  })\n\n  it('throw a GitHubApiError on access denied', async () => {\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/releases',\n        () => new HttpResponse('access denied', {status: 401})\n      )\n    )\n    const r = new ReleaseAdapter(new GitHubClient(), 'test-owner', ['project1'])\n\n    const error = await r.GetAllReleasesLastMonth().catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message:\n        'GitHub API request failed (401) for GET /repos/{owner}/{repo}/releases?state=all&since={since}&per_page={per_page}&page={page}',\n      status: 401\n    })\n  })\n})\n"},"__tests__/index.test.ts":{"tests":[{"id":"162","name":"index.ts bootstrap parses inputs from the Actions runtime and runs with a client built from the token"},{"id":"163","name":"index.ts bootstrap reports a failing run through core.setFailed"},{"id":"164","name":"index.ts bootstrap sets the stable GitHubApiError message and logs the raw cause separately"},{"id":"165","name":"index.ts bootstrap does not log a cause that is not an Error"},{"id":"166","name":"index.ts bootstrap stringifies non-Error rejections"},{"id":"167","name":"index.ts bootstrap reports input parsing failures through core.setFailed without running"},{"id":"168","name":"index.ts token resolution (real parseInputs) fails before building a client when neither the token input nor GH_TOKEN is set"},{"id":"169","name":"index.ts token resolution (real parseInputs) registers a GH_TOKEN-sourced token as a secret before building the client"}],"source":"import * as core from '@actions/core'\nimport * as github from '@actions/github'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport {parseInputs, run} from '../src/main'\nimport type {Inputs} from '../src/main'\n\nvi.mock('@actions/core')\nvi.mock('@actions/github')\n// Only the client is mocked; GitHubApiError must stay real for instanceof in index.ts.\nvi.mock('../src/GitHubClient', async importOriginal => ({\n  ...(await importOriginal<"+"typeof import('../src/GitHubClient')>()),\n  GitHubClient: vi.fn()\n}))\nvi.mock('../src/main')\n\nconst inputs: Inputs = {\n  owner: 'o',\n  repositories: ['repo1'],\n  token: 'the-token',\n  logging: false,\n  filtered: false,\n  bugLabel: 'bug'\n}\n\n// index.ts runs at import time, so each case needs a fresh module instance.\nasync function importIndex(): Promise<"+"void> {\n  vi.resetModules()\n  await import('../src/index')\n  // Let the floating bootstrap() promise settle.\n  await new Promise(resolve => setImmediate(resolve))\n}\n\ndescribe('index.ts bootstrap', () => {\n  beforeEach(() => {\n    vi.clearAllMocks()\n    vi.mocked(parseInputs).mockReturnValue(inputs)\n  })\n\n  it('parses inputs from the Actions runtime and runs with a client built from the token', async () => {\n    await importIndex()\n\n    expect(parseInputs).toHaveBeenCalledWith(core, github.context, process.env)\n    expect(GitHubClient).toHaveBeenCalledWith({token: 'the-token'})\n    expect(run).toHaveBeenCalledWith({\n      inputs,\n      client: vi.mocked(GitHubClient).mock.instances[0],\n      core\n    })\n    expect(core.setFailed).not.toHaveBeenCalled()\n  })\n\n  it('reports a failing run through core.setFailed', async () => {\n    vi.mocked(run).mockRejectedValueOnce(new Error('Failed to fetch releases'))\n\n    await importIndex()\n\n    expect(core.setFailed).toHaveBeenCalledWith('Failed to fetch releases')\n    expect(core.error).not.toHaveBeenCalled()\n  })\n\n  it('sets the stable GitHubApiError message and logs the raw cause separately', async () => {\n    const cause = Object.assign(new Error('Forbidden: https://x/y {body}'), {\n      status: 403\n    })\n    vi.mocked(run).mockRejectedValueOnce(new GitHubApiError('GET /x', cause))\n\n    await importIndex()\n\n    expect(core.error).toHaveBeenCalledWith('Forbidden: https://x/y {body}')\n    expect(core.setFailed).toHaveBeenCalledWith(\n      'GitHub API request failed (403) for GET /x'\n    )\n    expect(core.setFailed).toHaveBeenCalledTimes(1)\n  })\n\n  it('does not log a cause that is not an Error', async () => {\n    vi.mocked(run).mockRejectedValueOnce(new GitHubApiError('GET /x', 'boom'))\n\n    await importIndex()\n\n    expect(core.error).not.toHaveBeenCalled()\n    expect(core.setFailed).toHaveBeenCalledWith(\n      'GitHub API request failed (unknown) for GET /x'\n    )\n  })\n\n  it('stringifies non-Error rejections', async () => {\n    vi.mocked(run).mockRejectedValueOnce('boom')\n\n    await importIndex()\n\n    expect(core.setFailed).toHaveBeenCalledWith('boom')\n  })\n\n  it('reports input parsing failures through core.setFailed without running', async () => {\n    vi.mocked(parseInputs).mockImplementationOnce(() => {\n      throw new Error('bad input')\n    })\n\n    await importIndex()\n\n    expect(core.setFailed).toHaveBeenCalledWith('bad input')\n    expect(run).not.toHaveBeenCalled()\n  })\n})\n\ndescribe('index.ts token resolution (real parseInputs)', () => {\n  const savedGhToken = process.env.GH_TOKEN\n\n  beforeEach(async () => {\n    vi.clearAllMocks()\n    const actual =\n      await vi.importActual<"+"typeof import('../src/main')>('../src/main')\n    vi.mocked(parseInputs).mockImplementation(actual.parseInputs)\n    vi.mocked(core.getInput).mockImplementation((name: string) =>\n      name === 'repo' ? 'repo1' : name === 'owner' ? 'o' : ''\n    )\n  })\n\n  afterEach(() => {\n    if (savedGhToken === undefined) {\n      delete process.env.GH_TOKEN\n    } else {\n      process.env.GH_TOKEN = savedGhToken\n    }\n  })\n\n  it('fails before building a client when neither the token input nor GH_TOKEN is set', async () => {\n    delete process.env.GH_TOKEN\n\n    await importIndex()\n\n    expect(core.setFailed).toHaveBeenCalledExactlyOnceWith(\n      'A GitHub token is required: set the `token` input or the GH_TOKEN environment variable'\n    )\n    expect(GitHubClient).not.toHaveBeenCalled()\n    expect(run).not.toHaveBeenCalled()\n  })\n\n  it('registers a GH_TOKEN-sourced token as a secret before building the client', async () => {\n    process.env.GH_TOKEN = 'env-secret'\n\n    await importIndex()\n\n    expect(core.setSecret).toHaveBeenCalledExactlyOnceWith('env-secret')\n    expect(GitHubClient).toHaveBeenCalledWith({token: 'env-secret'})\n    expect(vi.mocked(core.setSecret).mock.invocationCallOrder[0]).toBeLessThan(\n      vi.mocked(GitHubClient).mock.invocationCallOrder[0]\n    )\n    expect(core.setFailed).not.toHaveBeenCalled()\n  })\n})\n"},"__tests__/mappers.spec.ts":{"tests":[{"id":"170","name":"repoKey joins owner and repo with a slash, lower-cased"},{"id":"171","name":"repoKey keeps repos whose names are prefixes of each other distinct"},{"id":"172","name":"toRelease maps name and published_at and keys by owner/repo"},{"id":"173","name":"toRelease sanitizes the release name"},{"id":"174","name":"toPullRequest maps number, title, merge time and base ref"},{"id":"175","name":"toPullRequest does not carry response URLs into the domain object"},{"id":"176","name":"toPullRequest maps an unmerged pull to mergedAt null"},{"id":"177","name":"toPullRequest sanitizes and truncates the title"},{"id":"178","name":"toIssue maps number, title, created/closed times and flattens label names"},{"id":"179","name":"toIssue sanitizes the title"},{"id":"180","name":"toIssue maps an open issue to closedAt null"},{"id":"181","name":"toCommit maps committer date and message"},{"id":"182","name":"toCommit flattens a multi-line commit message to its sanitized single line"},{"id":"183","name":"isoTimestamp renders epoch milliseconds as GitHub-style second-precision ISO"}],"source":"import {\n  repoKey,\n  toCommit,\n  toIssue,\n  toPullRequest,\n  toRelease\n} from '../src/github/mappers'\nimport {isoTimestamp} from '../src/types/Timestamp'\nimport {\n  commitPayload,\n  issuePayload,\n  pullRequestPayload,\n  releasePayload\n} from './helpers/payloads'\n\ndescribe('repoKey', () => {\n  it('joins owner and repo with a slash, lower-cased', () => {\n    expect(repoKey('Stenjo', 'DevOps-Metrics-Action')).toBe(\n      'stenjo/devops-metrics-action'\n    )\n  })\n\n  it('keeps repos whose names are prefixes of each other distinct', () => {\n    expect(repoKey('o', 'api')).not.toBe(repoKey('o', 'api-gateway'))\n    expect(repoKey('o', 'api')).toBe('o/api')\n  })\n})\n\ndescribe('toRelease', () => {\n  it('maps name and published_at and keys by owner/repo', () => {\n    const release = toRelease(\n      'Owner',\n      'Repo',\n      releasePayload({name: 'v2.0.0', published_at: '2023-04-30T17:50:53Z'})\n    )\n\n    expect(release).toEqual({\n      repo: 'owner/repo',\n      name: 'v2.0.0',\n      publishedAt: +new Date('2023-04-30T17:50:53Z')\n    })\n  })\n\n  it('sanitizes the release name', () => {\n    expect(\n      toRelease('o', 'r', releasePayload({name: ' v1\\n`x` ${a} '})).name\n    ).toBe('v1 x {a}')\n    expect(\n      toRelease('o', 'r', releasePayload({name: null as unknown as string}))\n        .name\n    ).toBe('')\n  })\n})\n\ndescribe('toPullRequest', () => {\n  it('maps number, title, merge time and base ref', () => {\n    const pull = toPullRequest(\n      'o',\n      'r',\n      pullRequestPayload({\n        number: 7,\n        title: 'fix: a',\n        merged_at: '2023-04-28T17:50:53Z',\n        base: {ref: 'develop', repo: {name: 'r'}}\n      })\n    )\n\n    expect(pull).toEqual({\n      repo: 'o/r',\n      number: 7,\n      title: 'fix: a',\n      mergedAt: +new Date('2023-04-28T17:50:53Z'),\n      baseRef: 'develop'\n    })\n  })\n\n  it('does not carry response URLs into the domain object', () => {\n    const payload = {\n      ...pullRequestPayload(),\n      commits_url: 'https://evil.example/repos/o/r/pulls/1/commits'\n    }\n\n    expect(JSON.stringify(toPullRequest('o', 'r', payload))).not.toContain(\n      'evil.example'\n    )\n  })\n\n  it('maps an unmerged pull to mergedAt null', () => {\n    expect(\n      toPullRequest('o', 'r', pullRequestPayload({merged_at: null})).mergedAt\n    ).toBeNull()\n    expect(\n      toPullRequest('o', 'r', pullRequestPayload({merged_at: ''})).mergedAt\n    ).toBeNull()\n  })\n\n  it('sanitizes and truncates the title', () => {\n    const title = `fix:\\t${'a'.repeat(300)}`\n\n    const mapped = toPullRequest('o', 'r', pullRequestPayload({title})).title\n\n    expect(mapped).toHaveLength(200)\n    expect(mapped.startsWith('fix: aaa')).toBe(true)\n    expect(mapped.endsWith('…')).toBe(true)\n  })\n})\n\ndescribe('toIssue', () => {\n  it('maps number, title, created/closed times and flattens label names', () => {\n    const issue = toIssue(\n      'o',\n      'r',\n      issuePayload({\n        number: 42,\n        title: 'bug: it breaks',\n        created_at: '2023-04-22T21:44:06Z',\n        closed_at: '2023-04-23T16:47:40Z',\n        labels: [{name: 'bug'}, {name: 'p1'}] as never\n      })\n    )\n\n    expect(issue).toEqual({\n      repo: 'o/r',\n      number: 42,\n      title: 'bug: it breaks',\n      createdAt: +new Date('2023-04-22T21:44:06Z'),\n      closedAt: +new Date('2023-04-23T16:47:40Z'),\n      labels: ['bug', 'p1']\n    })\n  })\n\n  it('sanitizes the title', () => {\n    expect(\n      toIssue('o', 'r', issuePayload({title: 'bug: `rm`\\n$(x) ${y}'})).title\n    ).toBe('bug: rm (x) {y}')\n  })\n\n  it('maps an open issue to closedAt null', () => {\n    expect(\n      toIssue('o', 'r', issuePayload({closed_at: null})).closedAt\n    ).toBeNull()\n  })\n})\n\ndescribe('toCommit', () => {\n  it('maps committer date and message', () => {\n    expect(toCommit(commitPayload('2023-04-22T20:41:12Z', 'fix: it'))).toEqual({\n      committedAt: +new Date('2023-04-22T20:41:12Z'),\n      message: 'fix: it'\n    })\n  })\n\n  it('flattens a multi-line commit message to its sanitized single line', () => {\n    expect(\n      toCommit(commitPayload('2023-04-22T20:41:12Z', 'fix: it\\n\\nBody `$(x)`'))\n        .message\n    ).toBe('fix: it Body (x)')\n  })\n})\n\ndescribe('isoTimestamp', () => {\n  it('renders epoch milliseconds as GitHub-style second-precision ISO', () => {\n    expect(isoTimestamp(+new Date('2023-04-22T20:28:29Z'))).toBe(\n      '2023-04-22T20:28:29Z'\n    )\n    expect(isoTimestamp(+new Date('2023-04-22T20:28:29.500Z'))).toBe(\n      '2023-04-22T20:28:29Z'\n    )\n  })\n})\n"},"__tests__/DeployFrequency.test.ts":{"tests":[{"id":"184","name":"Deploy frequency should calculate releases pr week for release less than 1 week"},{"id":"185","name":"Deploy frequency should calculate releases pr week for release more than 1 week ago"},{"id":"186","name":"Deploy frequency should calculate releases pr week for release this week based on large list"},{"id":"187","name":"Deploy frequency should monthly calculate releases pr week for release more than 1 week ago"},{"id":"188","name":"Deploy frequency should calculate release rate last month"},{"id":"189","name":"Deploy frequency should calculate release rate last month based on 7 releases list"},{"id":"190","name":"Deploy frequency should calculate release rate next month"},{"id":"191","name":"Deploy frequency should throw exception when no releases"},{"id":"192","name":"Deploy frequency should throw exception when release list is null"},{"id":"193","name":"Deploy frequency should get an empty log of releases"},{"id":"194","name":"Deploy frequency should get release log list weekly when rate calculated"},{"id":"195","name":"Deploy frequency should get release log list monthly when rate calculated"},{"id":"196","name":"Deploy frequency should get release log list when rate calculated"},{"id":"197","name":"Deploy frequency should log release name and date weekly"},{"id":"198","name":"Deploy frequency should log release name and date monthly"}],"source":"//\nimport {DeployFrequency} from '../src/DeployFrequency'\nimport fs from 'fs'\nimport type {Release} from '../src/types/Release'\nimport type {GitHubReleasePayload} from '../src/github/payloads'\nimport {toRelease} from '../src/github/mappers'\n\nfunction loadReleases(file: string, repo: string): Release[] {\n  return (\n    JSON.parse(fs.readFileSync(file, 'utf-8')) as GitHubReleasePayload[]\n  ).map(p => toRelease('stenjo', repo, p))\n}\n\ndescribe('Deploy frequency should', () => {\n  // Release v0.0.1:2023-04-14, v0.0.2:2023-04-22\n  const releaseList2: Release[] = loadReleases(\n    './__tests__/test-data/one-release.json',\n    'dora'\n  )\n  // Release\n  // v0.0.1:2023-04-12, v0.0.2:2023-04-22, v0.1.0:2023-04-29,\n  // v0.2.0:2023-04-30, v0.2.1:2023-04-30, v0.3.0-beta:2023-04-30,\n  // v0.3.1-beta:2023-04-30\n  const releaseList7: Release[] = loadReleases(\n    './__tests__/test-data/releases.json',\n    'devops-metrics-action'\n  )\n  it('calculate releases pr week for release less than 1 week', () => {\n    const df = new DeployFrequency(releaseList2, '2023-04-14T22:33:11Z')\n    const wr = df.weekly()\n\n    expect(wr).toBe(1)\n  })\n  it('calculate releases pr week for release more than 1 week ago', () => {\n    const df = new DeployFrequency(releaseList2, '2023-04-24T22:33:11Z')\n    const wr = df.weekly()\n\n    expect(wr).toBe(1)\n  })\n  it('calculate releases pr week for release this week based on large list', () => {\n    const df = new DeployFrequency(releaseList7, '2023-05-01T22:33:11Z')\n    const wr = df.weekly()\n\n    expect(wr).toBe(5)\n  })\n  it('monthly calculate releases pr week for release more than 1 week ago', () => {\n    const df = new DeployFrequency(releaseList2, '2023-04-24T22:33:11Z')\n    const mr = df.monthly()\n\n    expect(mr).toBe(2)\n  })\n  it('calculate release rate last month', () => {\n    const df = new DeployFrequency(releaseList2, '2023-04-14T22:33:11Z')\n    const rr = df.rate()\n\n    expect(rr).toBe('0.47')\n  })\n  it('calculate release rate last month based on 7 releases list', () => {\n    const df = new DeployFrequency(releaseList7, '2023-05-14T22:33:11Z')\n    const rr = df.rate()\n\n    expect(rr).toBe('1.40')\n  })\n  it('calculate release rate next month', () => {\n    const df = new DeployFrequency(releaseList2, '2023-05-23T22:33:11Z')\n    const rr = df.rate()\n\n    expect(rr).toBe('0.00')\n  })\n  it('throw exception when no releases', () => {\n    const emptyReleaseList: Release[] = []\n\n    const t = (): void => {\n      new DeployFrequency(emptyReleaseList)\n    }\n\n    expect(t).toThrow('Empty release list')\n  })\n  it('throw exception when release list is null', () => {\n    const emptyReleaseList: Release[] | null = null\n\n    const t = (): void => {\n      new DeployFrequency(emptyReleaseList)\n    }\n\n    expect(t).toThrow('Empty release list')\n  })\n  it('get an empty log of releases', () => {\n    const df = new DeployFrequency(releaseList7, '2023-05-14T22:33:11Z')\n\n    expect(df.getLog().length).toBe(0)\n  })\n\n  it('get release log list weekly when rate calculated', () => {\n    const df = new DeployFrequency(releaseList7, '2023-05-01T22:33:11Z')\n\n    df.weekly()\n\n    expect(df.getLog().filter(l => l.kind === 'release').length).toBe(5)\n  })\n\n  it('get release log list monthly when rate calculated', () => {\n    const df = new DeployFrequency(releaseList7, '2023-05-14T22:33:11Z')\n\n    df.monthly()\n\n    expect(df.getLog().filter(l => l.kind === 'release').length).toBe(6)\n  })\n\n  it('get release log list when rate calculated', () => {\n    const df = new DeployFrequency(releaseList7, '2023-05-14T22:33:11Z')\n\n    df.rate()\n\n    expect(df.getLog().filter(l => l.kind === 'release').length).toBe(6)\n  })\n\n  it('log release name and date weekly', () => {\n    const df = new DeployFrequency(releaseList2, '2023-04-23T22:33:11Z')\n\n    df.weekly()\n\n    expect(df.getLog()).toEqual([\n      {kind: 'release', at: '2023-04-22T20:28:29Z', name: 'v0.0.2'}\n    ])\n  })\n\n  it('log release name and date monthly', () => {\n    const df = new DeployFrequency(releaseList2, '2023-04-23T22:33:11Z')\n\n    df.monthly()\n\n    expect(df.getLog()).toEqual([\n      {kind: 'release', at: '2023-04-22T20:28:29Z', name: 'v0.0.2'},\n      {kind: 'release', at: '2023-04-12T22:33:24Z', name: 'v0.0.1'}\n    ])\n  })\n})\n"},"__tests__/PullRequestsAdapter.test.ts":{"tests":[{"id":"199","name":"PullRequest Adapter should ice breaker"},{"id":"200","name":"PullRequest Adapter should return paged values"},{"id":"201","name":"PullRequest Adapter should request pulls since 61 days back with auth and api-version headers"},{"id":"202","name":"PullRequest Adapter should request pages 1 to 99 at most when every page is full"},{"id":"203","name":"PullRequest Adapter should throw a GitHubApiError on access denied"}],"source":"import {http, HttpResponse} from 'msw'\nimport {setupServer} from 'msw/node'\nimport {PullRequestsAdapter} from '../src/PullRequestsAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport type {PullRequest} from '../src/types/PullRequest'\nimport type {GitHubPullRequestPayload} from '../src/github/payloads'\nimport {pullRequestPayload} from './helpers/payloads'\n\nconst server = setupServer(\n  http.get(\n    'https://api.github.com/repos/:owner/:rep/pulls',\n    // eslint-disable-next-line @typescript-eslint/no-unused-vars\n    ({request, params, cookies}) => {\n      const url = new URL(request.url)\n      const page = url.searchParams.getAll('page')\n      const pullRequests: GitHubPullRequestPayload[] = []\n      for (let i = 0; i <"+" (+page <"+" 2 ? 100 : 50); i++) {\n        pullRequests.push(pullRequestPayload({id: i}))\n      }\n      return HttpResponse.json(pullRequests)\n    }\n  )\n)\ndescribe('PullRequest Adapter should', () => {\n  beforeAll(() => server.listen())\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n  })\n\n  afterEach(() => server.resetHandlers())\n\n  afterAll(() => server.close())\n\n  it('ice breaker', () => {\n    expect(true).toBe(true)\n  })\n\n  it('return paged values', async () => {\n    const r = new PullRequestsAdapter(new GitHubClient(), 'test-owner', [\n      'project1'\n    ])\n\n    const pullRequests: PullRequest[] = await r.GetAllPRsLastMonth()\n\n    expect(pullRequests.length).toBe(150)\n  })\n\n  it('request pulls since 61 days back with auth and api-version headers', async () => {\n    const seen: Request[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/pulls',\n        ({request}) => {\n          seen.push(request)\n          return HttpResponse.json([pullRequestPayload({id: 1})])\n        }\n      )\n    )\n    const r = new PullRequestsAdapter(\n      new GitHubClient({token: 'my-token'}),\n      'test-owner',\n      ['project1']\n    )\n    r.today = new Date('2024-03-01T12:00:00Z')\n\n    await r.GetAllPRsLastMonth()\n\n    expect(seen.length).toBe(1)\n    const url = new URL(seen[0].url)\n    expect(url.pathname).toBe('/repos/test-owner/project1/pulls')\n    expect(url.searchParams.get('state')).toBe('closed')\n    expect(url.searchParams.get('since')).toBe('2023-12-31T12:00:00.000Z')\n    expect(url.searchParams.get('per_page')).toBe('100')\n    expect(url.searchParams.get('page')).toBe('1')\n    expect(seen[0].headers.get('authorization')).toBe('token my-token')\n    expect(seen[0].headers.get('x-github-api-version')).toBe('2022-11-28')\n  })\n\n  it('request pages 1 to 99 at most when every page is full', async () => {\n    const pages: string[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/pulls',\n        ({request}) => {\n          pages.push(new URL(request.url).searchParams.get('page') as string)\n          return HttpResponse.json(\n            Array.from({length: 100}, (_, i) => pullRequestPayload({id: i}))\n          )\n        }\n      )\n    )\n    const r = new PullRequestsAdapter(new GitHubClient(), 'test-owner', [\n      'project1'\n    ])\n\n    const pullRequests = await r.GetAllPRsLastMonth()\n\n    expect(pages.length).toBe(99)\n    expect(pages[0]).toBe('1')\n    expect(pages[1]).toBe('2')\n    expect(pages[98]).toBe('99')\n    expect(pullRequests.length).toBe(9900)\n  })\n\n  it('throw a GitHubApiError on access denied', async () => {\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/pulls',\n        () => new HttpResponse('access denied', {status: 401})\n      )\n    )\n    const r = new PullRequestsAdapter(new GitHubClient(), 'test-owner', [\n      'project1'\n    ])\n\n    const error = await r.GetAllPRsLastMonth().catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message:\n        'GitHub API request failed (401) for GET /repos/{owner}/{repo}/pulls?state=closed&since={since}&per_page={per_page}&page={page}',\n      status: 401\n    })\n  })\n})\n"},"__tests__/IssuesAdapter.test.ts":{"tests":[{"id":"204","name":"Issue Adapter should ice breaker"},{"id":"205","name":"Issue Adapter should return paged values"},{"id":"206","name":"Issue Adapter should request issues since 61 days back with auth and api-version headers"},{"id":"207","name":"Issue Adapter should request pages 1 to 99 at most when every page is full"},{"id":"208","name":"Issue Adapter should throw a GitHubApiError on access denied"}],"source":"import {http, HttpResponse} from 'msw'\nimport {setupServer} from 'msw/node'\nimport {IssuesAdapter} from '../src/IssuesAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport type {Issue} from '../src/types/Issue'\nimport type {GitHubIssuePayload} from '../src/github/payloads'\nimport {issuePayload} from './helpers/payloads'\n\nconst server = setupServer(\n  http.get(\n    'https://api.github.com/repos/:owner/:rep/issues',\n    // eslint-disable-next-line @typescript-eslint/no-unused-vars\n    ({request, params, cookies}) => {\n      const url = new URL(request.url)\n      const page = url.searchParams.getAll('page')\n      const issues: GitHubIssuePayload[] = []\n      for (let i = 0; i <"+" (+page <"+" 2 ? 100 : 50); i++) {\n        issues.push(issuePayload({id: i}))\n      }\n      return HttpResponse.json(issues)\n    }\n  )\n)\ndescribe('Issue Adapter should', () => {\n  beforeAll(() => server.listen())\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n  })\n\n  afterEach(() => server.resetHandlers())\n\n  afterAll(() => server.close())\n\n  it('ice breaker', () => {\n    expect(true).toBe(true)\n  })\n\n  it('return paged values', async () => {\n    const r = new IssuesAdapter(new GitHubClient(), 'test-owner', ['project1'])\n\n    const issues: Issue[] = await r.GetAllIssuesLastMonth()\n\n    expect(issues.length).toBe(150)\n  })\n\n  it('request issues since 61 days back with auth and api-version headers', async () => {\n    const seen: Request[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/issues',\n        ({request}) => {\n          seen.push(request)\n          return HttpResponse.json([issuePayload({id: 1})])\n        }\n      )\n    )\n    const r = new IssuesAdapter(\n      new GitHubClient({token: 'my-token'}),\n      'test-owner',\n      ['project1']\n    )\n    r.today = new Date('2024-03-01T12:00:00Z')\n\n    await r.GetAllIssuesLastMonth()\n\n    expect(seen.length).toBe(1)\n    const url = new URL(seen[0].url)\n    expect(url.pathname).toBe('/repos/test-owner/project1/issues')\n    expect(url.searchParams.get('state')).toBe('all')\n    expect(url.searchParams.get('since')).toBe('2023-12-31T12:00:00.000Z')\n    expect(url.searchParams.get('per_page')).toBe('100')\n    expect(url.searchParams.get('page')).toBe('1')\n    expect(seen[0].headers.get('authorization')).toBe('token my-token')\n    expect(seen[0].headers.get('x-github-api-version')).toBe('2022-11-28')\n  })\n\n  it('request pages 1 to 99 at most when every page is full', async () => {\n    const pages: string[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/issues',\n        ({request}) => {\n          pages.push(new URL(request.url).searchParams.get('page') as string)\n          return HttpResponse.json(\n            Array.from({length: 100}, (_, i) => issuePayload({id: i}))\n          )\n        }\n      )\n    )\n    const r = new IssuesAdapter(new GitHubClient(), 'test-owner', ['project1'])\n\n    const issues = await r.GetAllIssuesLastMonth()\n\n    expect(pages.length).toBe(99)\n    expect(pages[0]).toBe('1')\n    expect(pages[1]).toBe('2')\n    expect(pages[98]).toBe('99')\n    expect(issues.length).toBe(9900)\n  })\n\n  it('throw a GitHubApiError on access denied', async () => {\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/issues',\n        () => new HttpResponse('access denied', {status: 401})\n      )\n    )\n    const r = new IssuesAdapter(new GitHubClient(), 'test-owner', ['project1'])\n\n    const error = await r.GetAllIssuesLastMonth().catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message:\n        'GitHub API request failed (401) for GET /repos/{owner}/{repo}/issues?state=all&since={since}&per_page={per_page}&page={page}',\n      status: 401\n    })\n  })\n})\n"},"__tests__/CommitsAdapter.spec.ts":{"tests":[{"id":"209","name":"CommitsAdapter should fetch commits through the route template with the correct headers and map them"},{"id":"210","name":"CommitsAdapter should never forward a commits_url from response data"},{"id":"211","name":"CommitsAdapter should handle missing or incorrect headers"},{"id":"212","name":"CommitsAdapter should rethrow API failures as GitHubApiError without swallowing them"},{"id":"213","name":"CommitsAdapter should expose the injected client"},{"id":"214","name":"CommitsAdapter should handle empty API response"}],"source":"import {CommitsAdapter} from '../src/CommitsAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport {toPullRequest} from '../src/github/mappers'\nimport {Octokit} from '@octokit/core'\nimport {commitPayload, pullRequestPayload} from './helpers/payloads'\n\nvi.mock('@octokit/core')\n\nconst route = 'GET /repos/{owner}/{repo}/pulls/{pull_number}/commits'\n\ndescribe('CommitsAdapter', () => {\n  let adapter: CommitsAdapter\n  let mockRequest: Mock\n\n  beforeEach(() => {\n    mockRequest = vi.fn()\n    ;(Octokit as unknown as Mock).mockImplementation(function () {\n      return {request: mockRequest}\n    })\n    adapter = new CommitsAdapter(new GitHubClient({token: 'test-token'}))\n  })\n\n  afterEach(() => {\n    vi.clearAllMocks()\n  })\n\n  it('should fetch commits through the route template with the correct headers and map them', async () => {\n    mockRequest.mockResolvedValue({\n      data: [commitPayload('2023-04-22T17:50:53Z', 'fix: it')]\n    })\n\n    const commits = await adapter.getCommits('owner/repo', 42)\n\n    expect(mockRequest).toHaveBeenCalledTimes(1)\n    expect(mockRequest).toHaveBeenCalledWith(route, {\n      owner: 'owner',\n      repo: 'repo',\n      pull_number: 42,\n      headers: {'X-GitHub-Api-Version': '2022-11-28'}\n    })\n    expect(commits).toEqual([\n      {committedAt: +new Date('2023-04-22T17:50:53Z'), message: 'fix: it'}\n    ])\n  })\n\n  it('should never forward a commits_url from response data', async () => {\n    mockRequest.mockResolvedValue({data: []})\n    const pull = toPullRequest('o', 'r', {\n      ...pullRequestPayload({number: 9}),\n      commits_url: 'https://evil.example/repos/o/r/pulls/9/commits'\n    })\n\n    await adapter.getCommits(pull.repo, pull.number)\n\n    expect(mockRequest).toHaveBeenCalledTimes(1)\n    expect(mockRequest.mock.calls[0][0]).toBe(route)\n    expect(JSON.stringify(mockRequest.mock.calls)).not.toContain('evil.example')\n  })\n\n  it('should handle missing or incorrect headers', async () => {\n    mockRequest.mockImplementation((_url, options) => {\n      if (\n        !options.headers ||\n        options.headers['X-GitHub-Api-Version'] !== '2022-11-28'\n      ) {\n        throw new Error('Incorrect headers')\n      }\n      return {\n        data: [commitPayload()]\n      }\n    })\n\n    // Test with missing headers\n    await expect(adapter.getCommits('owner/repo', 1)).resolves.toBeDefined()\n\n    // Test with incorrect headers - the client wraps the error and rethrows it\n    mockRequest.mockClear()\n    mockRequest.mockImplementation(() => {\n      throw new Error('Incorrect headers')\n    })\n    await expect(adapter.getCommits('owner/repo', 1)).rejects.toThrow(\n      `GitHub API request failed (unknown) for ${route}`\n    )\n  })\n\n  it('should rethrow API failures as GitHubApiError without swallowing them', async () => {\n    const cause = Object.assign(new Error('API call failed'), {status: 502})\n    mockRequest.mockRejectedValue(cause)\n\n    const error = await adapter\n      .getCommits('owner/repo', 1)\n      .catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message: `GitHub API request failed (502) for ${route}`,\n      status: 502,\n      route,\n      cause\n    })\n  })\n\n  it('should expose the injected client', () => {\n    const client = new GitHubClient()\n    const adapterWithClient = new CommitsAdapter(client)\n    expect(adapterWithClient.client).toBe(client)\n  })\n\n  it('should handle empty API response', async () => {\n    mockRequest.mockResolvedValue({data: []})\n\n    const commits = await adapter.getCommits('owner/repo', 1)\n\n    expect(commits).toEqual([])\n  })\n})\n"},"__tests__/CommitsAdapter.test.ts":{"tests":[{"id":"215","name":"Commit Adapter should ice breaker"},{"id":"216","name":"Commit Adapter should return unpaged values"},{"id":"217","name":"Commit Adapter should throw a GitHubApiError on access denied"}],"source":"import {http, HttpResponse} from 'msw'\nimport {setupServer} from 'msw/node'\nimport {CommitsAdapter} from '../src/CommitsAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport fs from 'fs'\nimport type {Commit} from '../src/types/Commit'\nimport type {GitHubCommitPayload} from '../src/github/payloads'\n\nconst commitsUrl =\n  'https://api.github.com/repos/stenjo/devops-metrics-action/pulls/69/commits'\nconst route = 'GET /repos/{owner}/{repo}/pulls/{pull_number}/commits'\nconst requested: string[] = []\nconst server = setupServer(\n  http.get(commitsUrl, ({request}) => {\n    requested.push(request.url)\n    const commits = JSON.parse(\n      fs.readFileSync('./__tests__/test-data/commits.json').toString()\n    ) as GitHubCommitPayload[]\n    return HttpResponse.json(commits)\n  })\n)\ndescribe('Commit Adapter should', () => {\n  beforeAll(() => server.listen())\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n    requested.length = 0\n  })\n\n  afterAll(() => server.close())\n\n  it('ice breaker', () => {\n    expect(true).toBe(true)\n  })\n\n  it('return unpaged values', async () => {\n    const r = new CommitsAdapter(new GitHubClient())\n\n    const commits: Commit[] = await r.getCommits(\n      'stenjo/devops-metrics-action',\n      69\n    )\n\n    expect(requested).toEqual([commitsUrl])\n    expect(commits.length).toBe(30)\n    expect(commits[0]).toEqual({\n      committedAt: +new Date('2023-04-22T20:41:12Z'),\n      message: 'fix: clean up'\n    })\n  })\n\n  it('throw a GitHubApiError on access denied', async () => {\n    server.use(\n      http.get(\n        commitsUrl,\n        () => new HttpResponse('Bad credentials', {status: 401})\n      )\n    )\n    const r = new CommitsAdapter(new GitHubClient())\n\n    const error = await r\n      .getCommits('stenjo/devops-metrics-action', 69)\n      .catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message: `GitHub API request failed (401) for ${route}`,\n      status: 401\n    })\n  })\n})\n"},"__tests__/sanitize.spec.ts":{"tests":[{"id":"218","name":"sanitizeText leaves ordinary titles untouched"},{"id":"219","name":"sanitizeText removes backticks and ${ / $( openers from an injection payload"},{"id":"220","name":"sanitizeText keeps a lone dollar sign that opens nothing"},{"id":"221","name":"sanitizeText replaces control characters and newlines with a single space"},{"id":"222","name":"sanitizeText collapses runs of whitespace and trims the ends"},{"id":"223","name":"sanitizeText maps null and undefined to an empty string"},{"id":"224","name":"sanitizeText truncates to the cap with a trailing ellipsis"},{"id":"225","name":"sanitizeText does not truncate text exactly at the cap"},{"id":"226","name":"sanitizeText truncates after sanitizing, so the cap applies to the cleaned text"},{"id":"227","name":"sanitizeText honours a custom cap"}],"source":"import {MAX_TEXT_LENGTH, sanitizeText} from '../src/sanitize'\n\nconst ELLIPSIS = '\\u2026'\nconst INJECTION = '`id` ${{ github.token }} $(rm -rf /)'\n\ndescribe('sanitizeText', () => {\n  it('leaves ordinary titles untouched', () => {\n    expect(sanitizeText('feat(scope): add thing #12')).toBe(\n      'feat(scope): add thing #12'\n    )\n  })\n\n  it('removes backticks and ${ / $( openers from an injection payload', () => {\n    const out = sanitizeText(INJECTION)\n\n    expect(out).toBe('id {{ github.token }} (rm -rf /)')\n    expect(out).not.toMatch(/[`\\n]|\\$\\{|\\$\\(/)\n  })\n\n  it('keeps a lone dollar sign that opens nothing', () => {\n    expect(sanitizeText('costs $5 and ${')).toBe('costs $5 and {')\n  })\n\n  it('replaces control characters and newlines with a single space', () => {\n    expect(sanitizeText('a\\r\\nb\\tc\\u0000d\\u001be\\u2028f')).toBe('a b c d e f')\n  })\n\n  it('collapses runs of whitespace and trims the ends', () => {\n    expect(sanitizeText('  fix:   many    spaces \\n ')).toBe('fix: many spaces')\n  })\n\n  it('maps null and undefined to an empty string', () => {\n    expect(sanitizeText(null)).toBe('')\n    expect(sanitizeText(undefined)).toBe('')\n  })\n\n  it('truncates to the cap with a trailing ellipsis', () => {\n    const long = 'x'.repeat(MAX_TEXT_LENGTH + 50)\n\n    const out = sanitizeText(long)\n\n    expect(out).toHaveLength(MAX_TEXT_LENGTH)\n    expect(out.endsWith(ELLIPSIS)).toBe(true)\n    expect(out.slice(0, -1)).toBe('x'.repeat(MAX_TEXT_LENGTH - 1))\n  })\n\n  it('does not truncate text exactly at the cap', () => {\n    const exact = 'y'.repeat(MAX_TEXT_LENGTH)\n\n    expect(sanitizeText(exact)).toBe(exact)\n  })\n\n  it('truncates after sanitizing, so the cap applies to the cleaned text', () => {\n    const padded = `${'z'.repeat(10)}${'\\n'.repeat(500)}${'z'.repeat(10)}`\n\n    expect(sanitizeText(padded)).toBe(`${'z'.repeat(10)} ${'z'.repeat(10)}`)\n  })\n\n  it('honours a custom cap', () => {\n    expect(sanitizeText('abcdefgh', 5)).toBe(`abcd${ELLIPSIS}`)\n  })\n})\n"},"__tests__/run.failure.spec.ts":{"tests":[{"id":"228","name":"run() with a failing GitHub API aborts with a stable message and sets no outputs when the second repo returns 403"}],"source":"import {Octokit} from '@octokit/core'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport {run} from '../src/main'\nimport type {Inputs} from '../src/main'\nimport {releasePayload} from './helpers/payloads'\n\nvi.mock('@octokit/core')\n\n// End-to-end through the real adapters: a failure on the second repo must\n// surface as a GitHubApiError before any output is written.\ndescribe('run() with a failing GitHub API', () => {\n  const inputs: Inputs = {\n    owner: 'o',\n    repositories: ['repo1', 'repo2'],\n    token: 't',\n    logging: false,\n    filtered: false,\n    bugLabel: 'bug'\n  }\n\n  it('aborts with a stable message and sets no outputs when the second repo returns 403', async () => {\n    const forbidden = Object.assign(\n      new Error('Forbidden: https://api.github.com/repos/o/repo2/releases'),\n      {status: 403}\n    )\n    const request = vi.fn(async (_route: string, params: {repo?: string}) =>\n      params.repo === 'repo2'\n        ? Promise.reject(forbidden)\n        : Promise.resolve({data: [releasePayload({id: 1})]})\n    )\n    ;(Octokit as unknown as Mock).mockImplementation(function () {\n      return {request}\n    })\n    const core = {info: vi.fn(), setOutput: vi.fn()}\n\n    const error = await run({\n      inputs,\n      client: new GitHubClient({token: 't'}),\n      core\n    }).catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect((error as GitHubApiError).message).toBe(\n      'GitHub API request failed (403) for GET /repos/{owner}/{repo}/releases?state=all&since={since}&per_page={per_page}&page={page}'\n    )\n    expect((error as GitHubApiError).message).not.toContain('Forbidden')\n    expect((error as GitHubApiError).cause).toBe(forbidden)\n    expect(core.setOutput).not.toHaveBeenCalled()\n    expect(request.mock.calls.map(c => c[1].repo)).toEqual(['repo1', 'repo2'])\n  })\n})\n"},"__tests__/issues.test.ts":{"tests":[{"id":"229","name":"mocked Issues API should return issues mapped to the domain type"}],"source":"import fs from 'node:fs'\nimport {IssuesAdapter} from '../src/IssuesAdapter'\nimport {GitHubClient} from '../src/GitHubClient'\nimport type {GitHubIssuePayload} from '../src/github/payloads'\nimport * as dotenv from 'dotenv'\n\ndotenv.config()\n\ndescribe.skipIf(!process.env.GH_TOKEN)('Real Issues API should', () => {\n  const issueAdapter = new IssuesAdapter(\n    new GitHubClient({token: process.env.GH_TOKEN}),\n    'stenjo',\n    ['dora']\n  )\n\n  test('fetch issues', async () => {\n    const il = await issueAdapter.GetAllIssuesLastMonth()\n    expect(il?.length).toBeGreaterThan(10)\n  })\n})\n\ndescribe('mocked Issues API should', () => {\n  test('return issues mapped to the domain type', async () => {\n    const issueAdapter = new IssuesAdapter(new GitHubClient(), 'stenjo', [\n      'devops-metrics-action'\n    ])\n    mockedGetIssuesReturns('./__tests__/test-data/issue-list.json')\n\n    const il = await issueAdapter.GetAllIssuesLastMonth()\n    expect(il?.length).toBe(30)\n    expect(il?.[0]).toEqual({\n      repo: 'stenjo/devops-metrics-action',\n      number: 33,\n      title: 'chore(main): release 0.3.1-beta',\n      createdAt: +new Date('2023-04-30T17:28:48Z'),\n      closedAt: +new Date('2023-04-30T17:29:33Z'),\n      labels: ['autorelease: tagged']\n    })\n  })\n})\n\nfunction mockedGetIssuesReturns(file: string): void {\n  vi.spyOn(GitHubClient.prototype, 'paginate').mockImplementation(\n    async (): Promise<"+"GitHubIssuePayload[]> =>\n      JSON.parse(fs.readFileSync(file).toString()) as GitHubIssuePayload[]\n  )\n}\n"},"__tests__/releases.test.ts":{"tests":[{"id":"230","name":"Mocked Release API should return releases mapped to the domain type"}],"source":"import {ReleaseAdapter} from '../src/ReleaseAdapter'\nimport {GitHubClient} from '../src/GitHubClient'\nimport type {Release} from '../src/types/Release'\nimport type {GitHubReleasePayload} from '../src/github/payloads'\nimport fs from 'node:fs'\n\ndescribe('Mocked Release API should', () => {\n  it('return releases mapped to the domain type', async () => {\n    const r = new ReleaseAdapter(new GitHubClient(), 'TestOwner', ['Project1'])\n    mockedGetReleasesReturns('./__tests__/test-data/releases.json')\n\n    const releases: Release[] = await r.GetAllReleasesLastMonth()\n\n    expect(releases.length).toBe(7)\n    expect(releases[0]).toEqual({\n      repo: 'testowner/project1',\n      name: 'v0.3.1-beta',\n      publishedAt: +new Date('2023-04-30T17:29:44Z')\n    })\n    expect(releases.reverse()[0].name).toBe('v0.0.1')\n  })\n})\n\nfunction mockedGetReleasesReturns(file: string): void {\n  vi.spyOn(GitHubClient.prototype, 'paginate').mockImplementation(\n    async (): Promise<"+"GitHubReleasePayload[]> =>\n      JSON.parse(fs.readFileSync(file).toString()) as GitHubReleasePayload[]\n  )\n}\n"},"__tests__/Commits.test.ts":{"tests":[{"id":"231","name":"fetches commits"},{"id":"232","name":"CommitsAdapter should"}],"source":"import {CommitsAdapter} from '../src/CommitsAdapter'\nimport {GitHubClient} from '../src/GitHubClient'\nimport type {GitHubCommitPayload} from '../src/github/payloads'\nimport fs from 'node:fs'\nimport * as dotenv from 'dotenv'\n\ndotenv.config()\n\ntest('fetches commits', async () => {\n  const client = new GitHubClient({token: process.env.GH_TOKEN})\n  const adapter = new CommitsAdapter(client)\n  vi.spyOn(client, 'request').mockImplementation(\n    async (): Promise<"+"GitHubCommitPayload[]> =>\n      JSON.parse(\n        fs.readFileSync('./__tests__/test-data/commits.json').toString()\n      ) as GitHubCommitPayload[]\n  )\n\n  const cl = await adapter.getCommits('stenjo/devops-metrics-action', 10)\n\n  expect(cl.length).toBeGreaterThan(-1)\n  expect(cl.length).toBe(30)\n})\n\ntest('CommitsAdapter should', async () => {\n  const ca = new CommitsAdapter(new GitHubClient({token: process.env.GH_TOKEN}))\n\n  const result = await ca.getCommits('stenjo/devops-metrics-action', 69)\n\n  expect(result).not.toBe(undefined)\n  expect(result.length).toBeGreaterThan(7)\n})\n"},"__tests__/PullRequests.test.ts":{"tests":[{"id":"233","name":"PullRequestsAdapter should"}],"source":"import type {GitHubPullRequestPayload} from '../src/github/payloads'\nimport {Pul
