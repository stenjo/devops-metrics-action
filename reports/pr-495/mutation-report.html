T00:00:00Z', REPOSITORY, 'late'),\n      release('2023-04-20T00:00:00Z', REPOSITORY, 'early')\n    ]\n\n    const m = new MeanTimeToRestore([], input, {window: windowAt()})\n\n    expect(input.map(r => r.name)).toEqual(['late', 'early'])\n    expect(m.releases.map(r => r.name)).toEqual(['early', 'late'])\n  })\n\n  describe('release boundaries', () => {\n    const first = ts('2023-04-12T22:33:24Z')\n    const second = ts('2023-04-22T20:28:29Z')\n    const third = ts('2023-04-29T06:18:36Z')\n    const last = ts('2023-04-30T17:29:44Z')\n\n    it('not count a release published at the exact date as previous', () => {\n      expect(mttr.hasPreviousRelease(first, DMA)).toBe(false)\n      expect(mttr.hasPreviousRelease(first + 1, DMA)).toBe(true)\n    })\n\n    it('not count releases of other repos as previous', () => {\n      expect(mttr.hasPreviousRelease(last + 1, 'stenjo/unknown-repo')).toBe(\n        false\n      )\n    })\n\n    it('skip a closer release of another repo in getReleaseBefore and getReleaseAfter', () => {\n      const m = new MeanTimeToRestore(\n        [],\n        [\n          release('2023-04-10T00:00:00Z', 'o/api', 'api-before'),\n          release('2023-04-14T00:00:00Z', 'o/api-gateway', 'gw-before'),\n          release('2023-04-16T00:00:00Z', 'o/api-gateway', 'gw-after'),\n          release('2023-04-20T00:00:00Z', 'o/api', 'api-after')\n        ],\n        {window: windowAt()}\n      )\n      const date = ts('2023-04-15T00:00:00Z')\n\n      expect(m.getReleaseBefore(date, 'o/api').name).toBe('api-before')\n      expect(m.getReleaseAfter(date, 'o/api').name).toBe('api-after')\n    })\n\n    it('not count a release published at the exact date as later', () => {\n      expect(mttr.hasLaterRelease(last, DMA)).toBe(false)\n      expect(mttr.hasLaterRelease(last - 1, DMA)).toBe(true)\n    })\n\n    it('skip the release published at the exact date in getReleaseBefore', () => {\n      expect(mttr.getReleaseBefore(second, DMA).publishedAt).toBe(first)\n      expect(mttr.getReleaseBefore(second + 1, DMA).publishedAt).toBe(second)\n    })\n\n    it('skip the release published at the exact date in getReleaseAfter', () => {\n      expect(mttr.getReleaseAfter(second, DMA).publishedAt).toBe(third)\n      expect(mttr.getReleaseAfter(second - 1, DMA).publishedAt).toBe(second)\n    })\n  })\n\n  describe('bug selection', () => {\n    const DORA = 'stenjo/dora'\n    const localReleases = [\n      release('2023-03-25T00:00:00Z', DORA),\n      release('2023-04-30T00:00:00Z', DORA)\n    ]\n    const today = new Date('2023-05-01T00:00:00Z')\n\n    it('ignore bugs that are still open', () => {\n      const bugs = [\n        issue({\n          repo: DORA,\n          createdAt: ts('2023-04-10T00:00:00Z'),\n          closedAt: null\n        })\n      ]\n      const m = new MeanTimeToRestore(bugs, localReleases, {\n        window: windowAt(today)\n      })\n\n      expect(m.getBugCount()).toEqual([])\n      expect(m.mttr()).toBe(0)\n    })\n\n    it('include a bug created exactly 30 days ago and ignore older ones', () => {\n      const bug = issue({repo: DORA, closedAt: ts('2023-04-20T00:00:00Z')})\n      const onBoundary = new MeanTimeToRestore(\n        [{...bug, createdAt: ts('2023-04-01T00:00:00Z')}],\n        localReleases,\n        {window: windowAt(today)}\n      )\n      const justBefore = new MeanTimeToRestore(\n        [{...bug, createdAt: ts('2023-03-31T23:59:59.999Z')}],\n        localReleases,\n        {window: windowAt(today)}\n      )\n      const older = new MeanTimeToRestore(\n        [{...bug, createdAt: ts('2023-03-28T00:00:00Z')}],\n        localReleases,\n        {window: windowAt(today)}\n      )\n\n      expect(onBoundary.getBugCount().length).toBe(1)\n      expect(justBefore.getBugCount()).toEqual([])\n      expect(older.getBugCount()).toEqual([])\n    })\n  })\n\n  describe('with a custom bug label', () => {\n    const localReleases = [\n      release('2023-04-30T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY)\n    ]\n    const today = new Date('2023-04-30T00:00:00Z')\n\n    const issuesLabelled = (label: string): Issue[] =>\n      twoBugs().map(b => ({...b, labels: [label]}))\n\n    it('count issues tagged with the custom label', () => {\n      const mttrCustom = new MeanTimeToRestore(\n        issuesLabelled('incident'),\n        localReleases,\n        {window: windowAt(today), bugLabel: 'incident'}\n      )\n\n      expect(mttrCustom.getBugCount().length).toBe(2)\n      expect(mttrCustom.mttr()).toBe(5)\n    })\n\n    it('ignore issues tagged bug when a custom label is given', () => {\n      const mttrCustom = new MeanTimeToRestore(\n        issuesLabelled('bug'),\n        localReleases,\n        {window: windowAt(today), bugLabel: 'incident'}\n      )\n\n      expect(mttrCustom.getBugCount().length).toBe(0)\n      expect(mttrCustom.mttr()).toBe(0)\n    })\n\n    it('default to the bug label when none is given', () => {\n      const mttrDefault = new MeanTimeToRestore(\n        issuesLabelled('bug'),\n        localReleases,\n        {window: windowAt(today)}\n      )\n      const mttrIncident = new MeanTimeToRestore(\n        issuesLabelled('incident'),\n        localReleases,\n        {window: windowAt(today)}\n      )\n\n      expect(mttrDefault.getBugCount().length).toBe(2)\n      expect(mttrIncident.getBugCount().length).toBe(0)\n    })\n  })\n})\n"},"__tests__/ChangeFailureRate.test.ts":{"tests":[{"id":"160","name":"ChangeFailureRate should get number of bugs created"},{"id":"161","name":"ChangeFailureRate should get percentage rate"},{"id":"162","name":"ChangeFailureRate should calculate 0 failures on 0 releases"},{"id":"163","name":"ChangeFailureRate should calculate 0 failures on 0 issues"},{"id":"164","name":"ChangeFailureRate should calculate 100% failures on 1 issues on 1 release"},{"id":"165","name":"ChangeFailureRate should boundaries include a release published exactly 30 days ago and exclude one 1 ms earlier"},{"id":"166","name":"ChangeFailureRate should boundaries not count a bug created at the exact release time"},{"id":"167","name":"ChangeFailureRate should boundaries sort releases by date before pairing them"},{"id":"168","name":"ChangeFailureRate should boundaries not attribute bugs from another repo to this repo releases"},{"id":"169","name":"ChangeFailureRate should boundaries not attribute bugs of a repo whose name is a prefix of another"},{"id":"170","name":"ChangeFailureRate should boundaries ignore bugs created after the window end without failing"},{"id":"171","name":"ChangeFailureRate should log be empty before Cfr() runs and when nothing failed"},{"id":"172","name":"ChangeFailureRate should log record one failed-release per counted interval with its bugs"},{"id":"173","name":"ChangeFailureRate should log attribute a bug after the latest release to that release"},{"id":"174","name":"ChangeFailureRate should log keep one record per repo interval and the count equal to failed deploys"},{"id":"175","name":"ChangeFailureRate should log match the fixture rate: failed intervals over releases in window"},{"id":"176","name":"ChangeFailureRate should calculate 0% failures on 1 issues on 1 release when more than a month ago"},{"id":"177","name":"ChangeFailureRate should calculate 0% failures on 1 issues on release on other repo"},{"id":"178","name":"ChangeFailureRate should calculate 50% failures on 1 issues on 2 releases"},{"id":"179","name":"ChangeFailureRate should calculate 0% failures on 1 issues that is not a bug on 2 releases"},{"id":"180","name":"ChangeFailureRate should calculate 50% failures on 2 issues after latest release"},{"id":"181","name":"ChangeFailureRate should calculate 100% failures on 2 issues after no releases this month"},{"id":"182","name":"ChangeFailureRate should calculate 100% failures on 2 issues after latest release and one before"},{"id":"183","name":"ChangeFailureRate should calculate 33% failures on 3 issues after first release and none after second of 3 releases"},{"id":"184","name":"ChangeFailureRate should calculate 50% failures on 3 issues on two repos on two of 4 releases"},{"id":"185","name":"ChangeFailureRate should calculate 50% failures on 3 issues after first release no older than a month"},{"id":"186","name":"ChangeFailureRate should with a custom bug label count issues tagged with the custom label"},{"id":"187","name":"ChangeFailureRate should with a custom bug label ignore issues tagged bug when a custom label is given"},{"id":"188","name":"ChangeFailureRate should with a custom bug label default to the bug label when none is given"}],"source":"import type {Issue} from '../src/types/Issue'\nimport type {Release} from '../src/types/Release'\nimport type {RepoKey} from '../src/types/RepoKey'\nimport type {\n  GitHubIssuePayload,\n  GitHubReleasePayload\n} from '../src/github/payloads'\nimport {toIssue, toRelease} from '../src/github/mappers'\nimport fs from 'node:fs'\nimport {ChangeFailureRate} from '../src/ChangeFailureRate'\nimport {issue, release, ts, windowAt} from './helpers/domain'\n\nconst DORA = 'stenjo/dora'\nconst REPOSITORY = 'somepath/repository'\nconst OTHER = 'somepath/other-repo'\n\nconst fixtureIssues = (): Issue[] =>\n  (\n    JSON.parse(\n      fs.readFileSync('./__tests__/test-data/issue-list.json', 'utf8')\n    ) as GitHubIssuePayload[]\n  ).map(p => toIssue('stenjo', 'devops-metrics-action', p))\nconst fixtureReleases = (): Release[] =>\n  (\n    JSON.parse(\n      fs.readFileSync('./__tests__/test-data/releases.json', 'utf8')\n    ) as GitHubReleasePayload[]\n  ).map(p => toRelease('stenjo', 'devops-metrics-action', p))\n\nconst bug = (createdAt: string, repo: RepoKey = REPOSITORY): Issue =>\n  issue({repo, createdAt: ts(createdAt), closedAt: null})\n\ndescribe('ChangeFailureRate should', () => {\n  it('get number of bugs created', () => {\n    const cfr = new ChangeFailureRate(fixtureIssues(), fixtureReleases(), {\n      window: windowAt('2023-05-01T00:00:00Z')\n    })\n\n    const bugs = cfr.getBugs()\n\n    expect(bugs.length).toBe(2)\n  })\n\n  it('get percentage rate', () => {\n    const cfr = new ChangeFailureRate(fixtureIssues(), fixtureReleases(), {\n      window: windowAt('2023-05-01T00:00:00Z')\n    })\n\n    const cfrPercentage = cfr.Cfr()\n\n    expect(cfrPercentage).toBe(14)\n  })\n\n  it('calculate 0 failures on 0 releases', () => {\n    const cfr = new ChangeFailureRate(fixtureIssues(), [], {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 0 failures on 0 issues', () => {\n    const cfr = new ChangeFailureRate([], fixtureReleases(), {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 100% failures on 1 issues on 1 release', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z', DORA)]\n    const releases = [release('2023-04-30T16:50:53Z', DORA)]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(100)\n    expect(cfr.repos).toEqual([DORA])\n  })\n\n  describe('boundaries', () => {\n    const today = new Date('2023-05-01T00:00:00Z')\n    const doraBug = (createdAt: string, repo: RepoKey = DORA): Issue =>\n      bug(createdAt, repo)\n    const doraRelease = (publishedAt: string, repo: RepoKey = DORA): Release =>\n      release(publishedAt, repo)\n\n    it('include a release published exactly 30 days ago and exclude one 1 ms earlier', () => {\n      const onBoundary = new ChangeFailureRate(\n        [doraBug('2023-04-15T00:00:00Z')],\n        [doraRelease('2023-04-01T00:00:00Z')],\n        {window: windowAt(today)}\n      )\n      const before = new ChangeFailureRate(\n        [doraBug('2023-04-15T00:00:00Z')],\n        [doraRelease('2023-03-31T23:59:59.999Z')],\n        {window: windowAt(today)}\n      )\n\n      expect(onBoundary.Cfr()).toBe(100)\n      expect(before.Cfr()).toBe(0)\n    })\n\n    it('not count a bug created at the exact release time', () => {\n      const releases = [\n        doraRelease('2023-04-10T00:00:00Z'),\n        doraRelease('2023-04-20T00:00:00Z')\n      ]\n      const atFirst = new ChangeFailureRate(\n        [doraBug('2023-04-10T00:00:00Z')],\n        [...releases],\n        {window: windowAt(today)}\n      )\n      const atSecond = new ChangeFailureRate(\n        [doraBug('2023-04-20T00:00:00Z')],\n        [...releases],\n        {window: windowAt(today)}\n      )\n\n      expect(atFirst.Cfr()).toBe(0)\n      expect(atSecond.Cfr()).toBe(0)\n    })\n\n    it('sort releases by date before pairing them', () => {\n      const releases = [\n        doraRelease('2023-04-10T00:00:00Z'),\n        doraRelease('2023-04-20T00:00:00Z'),\n        doraRelease('2023-04-30T00:00:00Z')\n      ]\n      const cfr = new ChangeFailureRate(\n        [doraBug('2023-04-15T00:00:00Z'), doraBug('2023-04-25T00:00:00Z')],\n        releases,\n        {window: windowAt(today)}\n      )\n\n      expect(cfr.Cfr()).toBe(67)\n    })\n\n    it('not attribute bugs from another repo to this repo releases', () => {\n      const other = 'stenjo/other'\n      const releases = [\n        doraRelease('2023-04-10T00:00:00Z'),\n        doraRelease('2023-04-20T00:00:00Z'),\n        doraRelease('2023-04-12T00:00:00Z', other)\n      ]\n      const cfr = new ChangeFailureRate(\n        [\n          doraBug('2023-04-25T00:00:00Z'),\n          doraBug('2023-04-15T00:00:00Z', other)\n        ],\n        releases,\n        {window: windowAt(today)}\n      )\n\n      expect(cfr.Cfr()).toBe(67)\n    })\n\n    it('not attribute bugs of a repo whose name is a prefix of another', () => {\n      // api: one release followed by two bugs -> 1 failed deploy of 3.\n      // Prefix matching on \"api\" would also pair the bugs with the two\n      // api-gateway releases and count 2 failed deploys (67%).\n      const releases = [\n        doraRelease('2023-04-10T00:00:00Z', 'o/api'),\n        doraRelease('2023-04-12T00:00:00Z', 'o/api-gateway'),\n        doraRelease('2023-04-20T00:00:00Z', 'o/api-gateway')\n      ]\n      const cfr = new ChangeFailureRate(\n        [\n          doraBug('2023-04-11T00:00:00Z', 'o/api'),\n          doraBug('2023-04-15T00:00:00Z', 'o/api')\n        ],\n        releases,\n        {window: windowAt(today)}\n      )\n\n      expect(cfr.Cfr()).toBe(33)\n      expect(cfr.repos).toEqual(['o/api'])\n    })\n\n    it('ignore bugs created after the window end without failing', () => {\n      const cfr = new ChangeFailureRate(\n        [doraBug('2023-05-02T00:00:00Z')],\n        [doraRelease('2023-04-30T00:00:00Z')],\n        {window: windowAt(today)}\n      )\n\n      expect(cfr.Cfr()).toBe(0)\n    })\n  })\n\n  describe('log', () => {\n    const today = new Date('2023-05-01T00:00:00Z')\n\n    it('be empty before Cfr() runs and when nothing failed', () => {\n      const cfr = new ChangeFailureRate(\n        [bug('2023-04-05T00:00:00Z', DORA)],\n        [release('2023-04-10T00:00:00Z', DORA, 'v1')],\n        {window: windowAt(today)}\n      )\n\n      expect(cfr.getLog()).toEqual([])\n      expect(cfr.Cfr()).toBe(0)\n      expect(cfr.getLog()).toEqual([])\n    })\n\n    it('record one failed-release per counted interval with its bugs', () => {\n      const releases = [\n        release('2023-04-30T00:00:00Z', DORA, 'v3'),\n        release('2023-04-10T00:00:00Z', DORA, 'v1'),\n        release('2023-04-20T00:00:00Z', DORA, 'v2')\n      ]\n      const bugs = [\n        issue({\n          repo: DORA,\n          number: 7,\n          title: 'bug: crash',\n          createdAt: ts('2023-04-25T00:00:00Z'),\n          closedAt: null\n        }),\n        issue({\n          repo: DORA,\n          number: 5,\n          title: 'bug: slow',\n          createdAt: ts('2023-04-12T00:00:00Z'),\n          closedAt: null\n        }),\n        issue({\n          repo: DORA,\n          number: 6,\n          title: 'bug: wrong',\n          createdAt: ts('2023-04-15T00:00:00Z'),\n          closedAt: null\n        })\n      ]\n      const cfr = new ChangeFailureRate(bugs, releases, {\n        window: windowAt(today)\n      })\n\n      expect(cfr.Cfr()).toBe(67)\n      expect(cfr.getLog()).toEqual([\n        {\n          kind: 'failed-release',\n          repo: DORA,\n          at: '2023-04-10T00:00:00Z',\n          name: 'v1',\n          bugs: [\n            {number: 5, title: 'bug: slow', createdAt: '2023-04-12T00:00:00Z'},\n            {number: 6, title: 'bug: wrong', createdAt: '2023-04-15T00:00:00Z'}\n          ]\n        },\n        {\n          kind: 'failed-release',\n          repo: DORA,\n          at: '2023-04-20T00:00:00Z',\n          name: 'v2',\n          bugs: [\n            {number: 7, title: 'bug: crash', createdAt: '2023-04-25T00:00:00Z'}\n          ]\n        }\n      ])\n    })\n\n    it('attribute a bug after the latest release to that release', () => {\n      const cfr = new ChangeFailureRate(\n        [bug('2023-04-30T17:50:53Z', DORA)],\n        [release('2023-04-30T16:50:53Z', DORA, 'v9')],\n        {window: windowAt(today)}\n      )\n\n      expect(cfr.Cfr()).toBe(100)\n      expect(cfr.getLog()).toHaveLength(1)\n      expect(cfr.getLog()[0]).toMatchObject({\n        at: '2023-04-30T16:50:53Z',\n        name: 'v9'\n      })\n    })\n\n    it('keep one record per repo interval and the count equal to failed deploys', () => {\n      const other = 'stenjo/other'\n      const releases = [\n        release('2023-04-10T00:00:00Z', DORA, 'd1'),\n        release('2023-04-20T00:00:00Z', DORA, 'd2'),\n        release('2023-04-12T00:00:00Z', other, 'o1')\n      ]\n      const cfr = new ChangeFailureRate(\n        [bug('2023-04-25T00:00:00Z', DORA), bug('2023-04-15T00:00:00Z', other)],\n        releases,\n        {window: windowAt(today)}\n      )\n\n      expect(cfr.Cfr()).toBe(67)\n      expect(cfr.getLog().map(e => `${e.name}@${e.at}`)).toEqual([\n        'd2@2023-04-20T00:00:00Z',\n        'o1@2023-04-12T00:00:00Z'\n      ])\n    })\n\n    it('match the fixture rate: failed intervals over releases in window', () => {\n      const cfr = new ChangeFailureRate(fixtureIssues(), fixtureReleases(), {\n        window: windowAt('2023-05-01T00:00:00Z')\n      })\n\n      expect(cfr.Cfr()).toBe(14)\n      expect(cfr.getLog()).toHaveLength(1)\n      expect(\n        Math.round((cfr.getLog().length / cfr.releases.length) * 100)\n      ).toBe(14)\n      expect(cfr.getLog()[0].kind).toBe('failed-release')\n      expect(cfr.getLog()[0].bugs).toHaveLength(2)\n    })\n  })\n\n  it('calculate 0% failures on 1 issues on 1 release when more than a month ago', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z', DORA)]\n    const releases = [release('2023-04-30T16:50:53Z', DORA)]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-06-15T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 0% failures on 1 issues on release on other repo', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z', DORA)]\n    const releases = [release('2023-04-30T16:50:53Z', 'stenjo/other-repo')]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 50% failures on 1 issues on 2 releases', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z')]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(50)\n  })\n\n  it('calculate 0% failures on 1 issues that is not a bug on 2 releases', () => {\n    const bugs = [{...bug('2023-04-30T17:50:53Z'), labels: ['feature']}]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(0)\n  })\n\n  it('calculate 50% failures on 2 issues after latest release', () => {\n    const bugs = [bug('2023-04-30T17:50:53Z'), bug('2023-04-30T17:50:53Z')]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(50)\n  })\n\n  it('calculate 100% failures on 2 issues after no releases this month', () => {\n    const bugs = [bug('2023-04-29T17:50:53Z'), bug('2023-05-01T17:50:53Z')]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-29T17:50:53Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(100)\n  })\n\n  it('calculate 100% failures on 2 issues after latest release and one before', () => {\n    const bugs = [\n      bug('2023-04-29T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z')\n    ]\n    const releases = [\n      release('2023-04-30T16:50:53Z', REPOSITORY),\n      release('2023-04-29T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(100)\n  })\n\n  it('calculate 33% failures on 3 issues after first release and none after second of 3 releases', () => {\n    const bugs = [\n      bug('2023-04-29T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z')\n    ]\n    const releases = [\n      release('2023-04-28T16:50:53Z', REPOSITORY),\n      release('2023-04-30T19:50:53Z', REPOSITORY),\n      release('2023-05-02T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(33)\n  })\n\n  it('calculate 50% failures on 3 issues on two repos on two of 4 releases', () => {\n    const bugs = [\n      bug('2023-04-29T17:50:53Z'), // bug on 28, repository\n      bug('2023-04-30T17:50:53Z', OTHER), // bug on 28, other-repo\n      bug('2023-04-30T17:50:53Z') // bug on 28, repository\n    ]\n    const releases = [\n      release('2023-04-28T16:50:53Z', REPOSITORY),\n      release('2023-04-28T16:50:53Z', OTHER),\n      release('2023-04-30T19:50:53Z', REPOSITORY),\n      release('2023-05-02T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-03T00:00:00Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(50)\n  })\n\n  it('calculate 50% failures on 3 issues after first release no older than a month', () => {\n    const bugs = [\n      bug('2023-04-29T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z'),\n      bug('2023-04-30T17:50:53Z')\n    ]\n    const releases = [\n      release('2023-04-28T16:50:53Z', REPOSITORY),\n      release('2023-04-30T19:50:53Z', REPOSITORY),\n      release('2023-04-02T16:50:53Z', REPOSITORY)\n    ]\n\n    const cfr = new ChangeFailureRate(bugs, releases, {\n      window: windowAt('2023-05-28T10:50:53Z')\n    })\n\n    const value = cfr.Cfr()\n\n    expect(value).toBe(50)\n  })\n\n  describe('with a custom bug label', () => {\n    const releases = [release('2023-04-30T16:50:53Z', DORA)]\n    const today = new Date('2023-05-03T00:00:00Z')\n\n    const issuesLabelled = (label: string): Issue[] => [\n      {...bug('2023-04-30T17:50:53Z', DORA), labels: [label]}\n    ]\n\n    it('count issues tagged with the custom label', () => {\n      const cfr = new ChangeFailureRate(issuesLabelled('incident'), releases, {\n        window: windowAt(today),\n        bugLabel: 'incident'\n      })\n\n      expect(cfr.getBugs().length).toBe(1)\n      expect(cfr.Cfr()).toBe(100)\n    })\n\n    it('ignore issues tagged bug when a custom label is given', () => {\n      const cfr = new ChangeFailureRate(issuesLabelled('bug'), releases, {\n        window: windowAt(today),\n        bugLabel: 'incident'\n      })\n\n      expect(cfr.getBugs().length).toBe(0)\n      expect(cfr.Cfr()).toBe(0)\n    })\n\n    it('default to the bug label when none is given', () => {\n      const cfrDefault = new ChangeFailureRate(\n        issuesLabelled('bug'),\n        releases,\n        {window: windowAt(today)}\n      )\n      const cfrIncident = new ChangeFailureRate(\n        issuesLabelled('incident'),\n        releases,\n        {window: windowAt(today)}\n      )\n\n      expect(cfrDefault.getBugs().length).toBe(1)\n      expect(cfrIncident.getBugs().length).toBe(0)\n    })\n  })\n})\n"},"__tests__/GitHubClient.spec.ts":{"tests":[{"id":"189","name":"GitHubClient constructor creates one Octokit with the throttling and retry plugins, authenticated with the token"},{"id":"190","name":"GitHubClient constructor creates an unauthenticated Octokit when no options are given"},{"id":"191","name":"GitHubClient constructor passes baseUrl through when provided"},{"id":"192","name":"GitHubClient constructor uses the default limits of 100 items per page and 99 pages"},{"id":"193","name":"GitHubClient constructor starts with an unknown remaining rate limit"},{"id":"194","name":"GitHubClient rate-limit handlers retries once on the primary rate limit and warns with the wait"},{"id":"195","name":"GitHubClient rate-limit handlers gives up on the primary rate limit after one retry"},{"id":"196","name":"GitHubClient rate-limit handlers never retries on the secondary rate limit and warns"},{"id":"197","name":"GitHubClient rate-limit handlers does not fail when no logger is given"},{"id":"198","name":"GitHubClient request refuses absolute URLs so the token never leaves the configured API host"},{"id":"199","name":"GitHubClient request adds the api-version header and returns data"},{"id":"200","name":"GitHubClient request defaults params to an empty object"},{"id":"201","name":"GitHubClient request wraps errors in a GitHubApiError with a stable message, status, route and cause"},{"id":"202","name":"GitHubClient request reports an unknown status when the error carries none"},{"id":"203","name":"GitHubClient request reports an unknown status when the status is not a number"},{"id":"204","name":"GitHubClient request wraps non-object rejections too"},{"id":"205","name":"GitHubClient request records the remaining rate limit from the latest response"},{"id":"206","name":"GitHubClient request keeps the last known remaining rate limit when a response carries none or a malformed value"},{"id":"207","name":"GitHubClient paginate requests page 1 with per_page 100 and the given params"},{"id":"208","name":"GitHubClient paginate defaults params to an empty object"},{"id":"209","name":"GitHubClient paginate concatenates pages until a page is not full"},{"id":"210","name":"GitHubClient paginate stops after exactly one page when it is empty"},{"id":"211","name":"GitHubClient paginate stops after exactly one page when it has 99 items"},{"id":"212","name":"GitHubClient paginate requests pages 1 to 99 at most when every page is full and warns about the cap"},{"id":"213","name":"GitHubClient paginate honours injected limits and does not warn when paging ends before the cap"},{"id":"214","name":"GitHubClient paginate warns once when the injected page cap is hit"},{"id":"215","name":"GitHubClient paginate does not warn when until stops paging on the last allowed page"},{"id":"216","name":"GitHubClient paginate stops at the first item matching until and drops it and the rest"},{"id":"217","name":"GitHubClient paginate returns nothing when the very first item matches until"},{"id":"218","name":"GitHubClient paginate keeps paging when until never matches"},{"id":"219","name":"GitHubClient paginate propagates errors from any page"}],"source":"import {\n  GitHubClient,\n  GitHubApiError,\n  defaultClientLimits\n} from '../src/GitHubClient'\nimport {Octokit} from '@octokit/core'\nimport {throttling} from '@octokit/plugin-throttling'\nimport type {ThrottlingOptions} from '@octokit/plugin-throttling'\nimport {retry} from '@octokit/plugin-retry'\n\nvi.mock('@octokit/core')\n\ntype LimitHandlers = Required<"+"\n  Pick<"+"ThrottlingOptions, 'onRateLimit' | 'onSecondaryRateLimit'>\n>\n\nfunction constructorOptions(): Record<"+"string, unknown> & {\n  throttle: LimitHandlers\n} {\n  return vi.mocked(Octokit).mock.calls[0][0] as Record<"+"string, unknown> & {\n    throttle: LimitHandlers\n  }\n}\n\nconst requestOptions = {\n  method: 'GET',\n  url: '/repos/{owner}/{repo}/releases'\n} as Parameters<"+"LimitHandlers['onRateLimit']>[1]\n\ndescribe('GitHubClient', () => {\n  let mockRequest: Mock\n\n  beforeEach(() => {\n    mockRequest = vi.fn()\n    // A class, not an arrow function: the mock is invoked with `new`.\n    ;(Octokit as unknown as Mock).mockImplementation(\n      class {\n        request = mockRequest\n      }\n    )\n    // eslint-disable-next-line @typescript-eslint/unbound-method\n    vi.mocked(Octokit.plugin).mockReturnValue(Octokit)\n  })\n\n  afterEach(() => {\n    vi.clearAllMocks()\n  })\n\n  describe('constructor', () => {\n    it('creates one Octokit with the throttling and retry plugins, authenticated with the token', () => {\n      const client = new GitHubClient({token: 'my-token'})\n\n      // eslint-disable-next-line @typescript-eslint/unbound-method\n      expect(Octokit.plugin).toHaveBeenCalledExactlyOnceWith(throttling, retry)\n      expect(Octokit).toHaveBeenCalledTimes(1)\n      expect(Octokit).toHaveBeenCalledWith({\n        auth: 'my-token',\n        throttle: {\n          onRateLimit: expect.any(Function) as unknown,\n          onSecondaryRateLimit: expect.any(Function) as unknown\n        }\n      })\n      expect(client.octokit).toBeDefined()\n    })\n\n    it('creates an unauthenticated Octokit when no options are given', () => {\n      new GitHubClient()\n\n      expect(constructorOptions()).toMatchObject({auth: undefined})\n      expect(constructorOptions()).not.toHaveProperty('baseUrl')\n    })\n\n    it('passes baseUrl through when provided', () => {\n      new GitHubClient({token: 't', baseUrl: 'https://ghe.example.com/api/v3'})\n\n      expect(constructorOptions()).toMatchObject({\n        auth: 't',\n        baseUrl: 'https://ghe.example.com/api/v3'\n      })\n    })\n\n    it('uses the default limits of 100 items per page and 99 pages', () => {\n      expect(new GitHubClient().limits).toEqual({perPage: 100, maxPages: 99})\n      expect(defaultClientLimits()).toEqual({perPage: 100, maxPages: 99})\n    })\n\n    it('starts with an unknown remaining rate limit', () => {\n      expect(new GitHubClient().rateLimitRemaining).toBeUndefined()\n    })\n  })\n\n  describe('rate-limit handlers', () => {\n    let logger: {warning: Mock<"+"(message: string) => void>}\n\n    beforeEach(() => {\n      logger = {warning: vi.fn()}\n      new GitHubClient({token: 't', logger})\n    })\n\n    it('retries once on the primary rate limit and warns with the wait', () => {\n      const {onRateLimit} = constructorOptions().throttle\n\n      expect(onRateLimit(42, requestOptions, {} as Octokit, 0)).toBe(true)\n      expect(logger.warning).toHaveBeenCalledExactlyOnceWith(\n        'GitHub API rate limit exhausted for GET /repos/{owner}/{repo}/releases; retrying in 42s'\n      )\n    })\n\n    it('gives up on the primary rate limit after one retry', () => {\n      const {onRateLimit} = constructorOptions().throttle\n\n      expect(onRateLimit(42, requestOptions, {} as Octokit, 1)).toBe(false)\n      expect(onRateLimit(42, requestOptions, {} as Octokit, 2)).toBe(false)\n      expect(logger.warning).toHaveBeenLastCalledWith(\n        'GitHub API rate limit exhausted for GET /repos/{owner}/{repo}/releases; giving up'\n      )\n    })\n\n    it('never retries on the secondary rate limit and warns', () => {\n      const {onSecondaryRateLimit} = constructorOptions().throttle\n\n      expect(onSecondaryRateLimit(60, requestOptions, {} as Octokit, 0)).toBe(\n        false\n      )\n      expect(logger.warning).toHaveBeenCalledExactlyOnceWith(\n        'GitHub API secondary rate limit hit for GET /repos/{owner}/{repo}/releases; not retrying'\n      )\n    })\n\n    it('does not fail when no logger is given', () => {\n      vi.clearAllMocks()\n      new GitHubClient()\n      const {onRateLimit, onSecondaryRateLimit} = constructorOptions().throttle\n\n      expect(onRateLimit(1, requestOptions, {} as Octokit, 0)).toBe(true)\n      expect(onSecondaryRateLimit(1, requestOptions, {} as Octokit, 0)).toBe(\n        false\n      )\n    })\n  })\n\n  describe('request', () => {\n    it('refuses absolute URLs so the token never leaves the configured API host', async () => {\n      const client = new GitHubClient({token: 't'})\n\n      await expect(\n        client.request('https://evil.example/repos/o/r/pulls/1/commits')\n      ).rejects.toThrow(\n        new TypeError(\n          'Refusing to request a non-route URL: https://evil.example/repos/o/r/pulls/1/commits'\n        )\n      )\n      await expect(client.request('')).rejects.toThrow(TypeError)\n      await expect(\n        client.request('https://evil.example/?q=GET /repos')\n      ).rejects.toThrow(TypeError)\n      expect(mockRequest).not.toHaveBeenCalled()\n    })\n\n    it('adds the api-version header and returns data', async () => {\n      mockRequest.mockResolvedValue({data: [{id: 1}]})\n      const client = new GitHubClient()\n\n      const result = await client.request<"+"{id: number}[]>('GET /x', {\n        owner: 'o'\n      })\n\n      expect(mockRequest).toHaveBeenCalledWith('GET /x', {\n        owner: 'o',\n        headers: {'X-GitHub-Api-Version': '2022-11-28'}\n      })\n      expect(result).toEqual([{id: 1}])\n    })\n\n    it('defaults params to an empty object', async () => {\n      mockRequest.mockResolvedValue({data: 'ok'})\n      const client = new GitHubClient()\n\n      await client.request('GET /x')\n\n      expect(mockRequest).toHaveBeenCalledWith('GET /x', {\n        headers: {'X-GitHub-Api-Version': '2022-11-28'}\n      })\n    })\n\n    it('wraps errors in a GitHubApiError with a stable message, status, route and cause', async () => {\n      const cause = Object.assign(new Error('Forbidden: see https://x/y'), {\n        status: 403\n      })\n      mockRequest.mockRejectedValue(cause)\n      const client = new GitHubClient()\n\n      const error = await client.request('GET /x').catch((e: unknown) => e)\n\n      expect(error).toBeInstanceOf(GitHubApiError)\n      expect(error).toMatchObject({\n        name: 'GitHubApiError',\n        message: 'GitHub API request failed (403) for GET /x',\n        status: 403,\n        route: 'GET /x',\n        cause\n      })\n    })\n\n    it('reports an unknown status when the error carries none', async () => {\n      mockRequest.mockRejectedValue(new Error('socket hang up'))\n      const client = new GitHubClient()\n\n      await expect(client.request('GET /x')).rejects.toMatchObject({\n        message: 'GitHub API request failed (unknown) for GET /x',\n        status: undefined\n      })\n    })\n\n    it('reports an unknown status when the status is not a number', async () => {\n      mockRequest.mockRejectedValue({status: '403'})\n      const client = new GitHubClient()\n\n      await expect(client.request('GET /x')).rejects.toMatchObject({\n        message: 'GitHub API request failed (unknown) for GET /x'\n      })\n    })\n\n    it('wraps non-object rejections too', async () => {\n      mockRequest.mockRejectedValue(undefined)\n      const client = new GitHubClient()\n\n      await expect(client.request('GET /x')).rejects.toMatchObject({\n        message: 'GitHub API request failed (unknown) for GET /x',\n        cause: undefined\n      })\n    })\n\n    it('records the remaining rate limit from the latest response', async () => {\n      mockRequest\n        .mockResolvedValueOnce({\n          data: 1,\n          headers: {'x-ratelimit-remaining': '4321'}\n        })\n        .mockResolvedValueOnce({\n          data: 2,\n          headers: {'x-ratelimit-remaining': '7'}\n        })\n      const client = new GitHubClient()\n\n      await client.request('GET /x')\n      expect(client.rateLimitRemaining).toBe(4321)\n\n      await client.request('GET /x')\n      expect(client.rateLimitRemaining).toBe(7)\n    })\n\n    it('keeps the last known remaining rate limit when a response carries none or a malformed value', async () => {\n      mockRequest\n        .mockResolvedValueOnce({\n          data: 1,\n          headers: {'x-ratelimit-remaining': '9'}\n        })\n        .mockResolvedValueOnce({data: 2})\n        .mockResolvedValueOnce({data: 3, headers: {}})\n        .mockResolvedValueOnce({\n          data: 4,\n          headers: {'x-ratelimit-remaining': ''}\n        })\n        .mockResolvedValueOnce({\n          data: 5,\n          headers: {'x-ratelimit-remaining': '12abc'}\n        })\n        .mockResolvedValueOnce({\n          data: 6,\n          headers: {'x-ratelimit-remaining': 'abc12'}\n        })\n        .mockResolvedValueOnce({data: 7, headers: {'x-ratelimit-remaining': 5}})\n      const client = new GitHubClient()\n\n      for (let i = 0; i <"+" 7; i++) {\n        await client.request('GET /x')\n        expect(client.rateLimitRemaining).toBe(9)\n      }\n    })\n  })\n\n  describe('paginate', () => {\n    const page = (length: number, offset = 0): {id: number}[] =>\n      Array.from({length}, (_, i) => ({id: offset + i}))\n\n    it('requests page 1 with per_page 100 and the given params', async () => {\n      mockRequest.mockResolvedValue({data: page(1)})\n      const client = new GitHubClient()\n\n      await client.paginate('GET /repos/{owner}/{repo}/x', {\n        owner: 'o',\n        repo: 'r'\n      })\n\n      expect(mockRequest).toHaveBeenCalledTimes(1)\n      expect(mockRequest).toHaveBeenCalledWith('GET /repos/{owner}/{repo}/x', {\n        owner: 'o',\n        repo: 'r',\n        per_page: 100,\n        page: 1,\n        headers: {'X-GitHub-Api-Version': '2022-11-28'}\n      })\n    })\n\n    it('defaults params to an empty object', async () => {\n      mockRequest.mockResolvedValue({data: []})\n      const client = new GitHubClient()\n\n      const result = await client.paginate('GET /x')\n\n      expect(result).toEqual([])\n      expect(mockRequest).toHaveBeenCalledWith('GET /x', {\n        per_page: 100,\n        page: 1,\n        headers: {'X-GitHub-Api-Version': '2022-11-28'}\n      })\n    })\n\n    it('concatenates pages until a page is not full', async () => {\n      mockRequest\n        .mockResolvedValueOnce({data: page(100)})\n        .mockResolvedValueOnce({data: page(100, 100)})\n        .mockResolvedValueOnce({data: page(50, 200)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate<"+"{id: number}>('GET /x')\n\n      expect(mockRequest).toHaveBeenCalledTimes(3)\n      expect(mockRequest.mock.calls.map(c => c[1].page)).toEqual([1, 2, 3])\n      expect(result.length).toBe(250)\n      expect(result[0]).toEqual({id: 0})\n      expect(result[249]).toEqual({id: 249})\n    })\n\n    it('stops after exactly one page when it is empty', async () => {\n      mockRequest.mockResolvedValue({data: []})\n      const client = new GitHubClient()\n\n      const result = await client.paginate('GET /x')\n\n      expect(result).toEqual([])\n      expect(mockRequest).toHaveBeenCalledTimes(1)\n    })\n\n    it('stops after exactly one page when it has 99 items', async () => {\n      mockRequest.mockResolvedValue({data: page(99)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate('GET /x')\n\n      expect(result.length).toBe(99)\n      expect(mockRequest).toHaveBeenCalledTimes(1)\n    })\n\n    it('requests pages 1 to 99 at most when every page is full and warns about the cap', async () => {\n      mockRequest.mockResolvedValue({data: page(100)})\n      const logger = {warning: vi.fn()}\n      const client = new GitHubClient({logger})\n\n      const result = await client.paginate('GET /x')\n\n      expect(mockRequest).toHaveBeenCalledTimes(99)\n      expect(mockRequest.mock.calls[0][1].page).toBe(1)\n      expect(mockRequest.mock.calls[98][1].page).toBe(99)\n      expect(result.length).toBe(9900)\n      expect(logger.warning).toHaveBeenCalledExactlyOnceWith(\n        'Stopped paging GET /x after 99 pages (9900 items); results may be incomplete'\n      )\n    })\n\n    it('honours injected limits and does not warn when paging ends before the cap', async () => {\n      mockRequest\n        .mockResolvedValueOnce({data: page(5)})\n        .mockResolvedValueOnce({data: page(5, 5)})\n        .mockResolvedValueOnce({data: page(2, 10)})\n      const logger = {warning: vi.fn()}\n      const client = new GitHubClient({logger}, {perPage: 5, maxPages: 3})\n\n      const result = await client.paginate('GET /x')\n\n      expect(result.length).toBe(12)\n      expect(mockRequest.mock.calls.map(c => c[1].per_page)).toEqual([5, 5, 5])\n      expect(logger.warning).not.toHaveBeenCalled()\n    })\n\n    it('warns once when the injected page cap is hit', async () => {\n      mockRequest.mockResolvedValue({data: page(5)})\n      const logger = {warning: vi.fn()}\n      const client = new GitHubClient({logger}, {perPage: 5, maxPages: 2})\n\n      const result = await client.paginate('GET /x')\n\n      expect(result.length).toBe(10)\n      expect(mockRequest).toHaveBeenCalledTimes(2)\n      expect(logger.warning).toHaveBeenCalledExactlyOnceWith(\n        'Stopped paging GET /x after 2 pages (10 items); results may be incomplete'\n      )\n    })\n\n    it('does not warn when until stops paging on the last allowed page', async () => {\n      mockRequest.mockResolvedValue({data: page(5)})\n      const logger = {warning: vi.fn()}\n      const client = new GitHubClient({logger}, {perPage: 5, maxPages: 1})\n\n      const result = await client.paginate<"+"{id: number}>(\n        'GET /x',\n        {},\n        {until: item => item.id === 3}\n      )\n\n      expect(result.length).toBe(3)\n      expect(logger.warning).not.toHaveBeenCalled()\n    })\n\n    it('stops at the first item matching until and drops it and the rest', async () => {\n      mockRequest\n        .mockResolvedValueOnce({data: page(100)})\n        .mockResolvedValueOnce({data: page(100, 100)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate<"+"{id: number}>(\n        'GET /x',\n        {},\n        {until: item => item.id === 150}\n      )\n\n      expect(mockRequest).toHaveBeenCalledTimes(2)\n      expect(result.length).toBe(150)\n      expect(result[149]).toEqual({id: 149})\n    })\n\n    it('returns nothing when the very first item matches until', async () => {\n      mockRequest.mockResolvedValue({data: page(100)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate<"+"{id: number}>(\n        'GET /x',\n        {},\n        {until: item => item.id === 0}\n      )\n\n      expect(result).toEqual([])\n      expect(mockRequest).toHaveBeenCalledTimes(1)\n    })\n\n    it('keeps paging when until never matches', async () => {\n      mockRequest\n        .mockResolvedValueOnce({data: page(100)})\n        .mockResolvedValueOnce({data: page(10, 100)})\n      const client = new GitHubClient()\n\n      const result = await client.paginate<"+"{id: number}>(\n        'GET /x',\n        {},\n        {until: () => false}\n      )\n\n      expect(result.length).toBe(110)\n      expect(mockRequest).toHaveBeenCalledTimes(2)\n    })\n\n    it('propagates errors from any page', async () => {\n      mockRequest\n        .mockResolvedValueOnce({data: page(100)})\n        .mockRejectedValueOnce(\n          Object.assign(new Error('rate limited'), {\n            status: 429\n          })\n        )\n      const client = new GitHubClient()\n\n      await expect(client.paginate('GET /x')).rejects.toThrow(\n        'GitHub API request failed (429) for GET /x'\n      )\n    })\n  })\n})\n"},"__tests__/ReleaseAdapter.test.ts":{"tests":[{"id":"220","name":"Release Adapter should ice breaker"},{"id":"221","name":"Release Adapter should return paged values mapped to the domain type"},{"id":"222","name":"Release Adapter should key releases by the repository they were requested for"},{"id":"223","name":"Release Adapter should request releases without a since parameter, with auth and api-version headers"},{"id":"224","name":"Release Adapter should stop requesting pages once a page holds a release older than the window"},{"id":"225","name":"Release Adapter should keep a release published exactly 60 days ago and drop one 62 days ago"},{"id":"226","name":"Release Adapter should judge drafts without published_at by created_at"},{"id":"227","name":"Release Adapter should request pages 1 to 99 at most when every page is full"},{"id":"228","name":"Release Adapter should throw a GitHubApiError on access denied"}],"source":"import {http, HttpResponse} from 'msw'\nimport {setupServer} from 'msw/node'\nimport {ReleaseAdapter} from '../src/ReleaseAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport type {Release} from '../src/types/Release'\nimport type {\n  GitHubPersonPayload,\n  GitHubReleasePayload\n} from '../src/github/payloads'\nimport {releasePayload} from './helpers/payloads'\nimport {windowAt} from './helpers/domain'\n\n// fetchFrom is 60 days earlier (30-day window + 30-day look-back): 2024-01-01T12:00:00Z.\nconst TODAY = new Date('2024-03-01T12:00:00Z')\nconst WINDOW = windowAt(TODAY)\nconst IN_WINDOW = '2024-02-01T00:00:00Z'\nconst BEFORE_WINDOW = '2023-12-01T00:00:00Z'\n\nconst server = setupServer(\n  http.get(\n    'https://api.github.com/repos/:owner/:rep/releases',\n    // eslint-disable-next-line @typescript-eslint/no-unused-vars\n    ({request, params, cookies}) => {\n      const url = new URL(request.url)\n      const page = url.searchParams.getAll('page')\n      const releases: GitHubReleasePayload[] = []\n      const author: GitHubPersonPayload = {\n        login: '',\n        id: 0,\n        node_id: '',\n        gravatar_id: '',\n        url: '',\n        html_url: '',\n        followers_url: '',\n        following_url: '',\n        gists_url: '',\n        starred_url: '',\n        subscriptions_url: '',\n        organizations_url: '',\n        repos_url: '',\n        events_url: '',\n        received_events_url: '',\n        type: '',\n        site_admin: false\n      }\n      for (let i = 0; i <"+" (+page <"+" 2 ? 100 : 50); i++) {\n        releases.push({\n          id: i,\n          url: '',\n          uploadUrl: '',\n          author,\n          node_id: '',\n          tag_name: '',\n          target_commitish: '',\n          name: `v${i}`,\n          draft: false,\n          prerelease: false,\n          created_at: '',\n          published_at: IN_WINDOW,\n          assets: [],\n          tarball_url: '',\n          zipball_url: '',\n          body: ''\n        })\n      }\n      return HttpResponse.json(releases)\n    }\n  )\n)\n\ndescribe('Release Adapter should', () => {\n  beforeAll(() => server.listen())\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n  })\n\n  afterEach(() => server.resetHandlers())\n\n  afterAll(() => server.close())\n\n  it('ice breaker', () => {\n    expect(true).toBe(true)\n  })\n\n  it('return paged values mapped to the domain type', async () => {\n    const r = new ReleaseAdapter(\n      new GitHubClient(),\n      'Test-Owner',\n      ['Project1'],\n      WINDOW\n    )\n\n    const releases: Release[] = await r.GetAllReleasesLastMonth()\n\n    expect(releases.length).toBe(150)\n    expect(releases[1]).toEqual({\n      repo: 'test-owner/project1',\n      name: 'v1',\n      publishedAt: +new Date(IN_WINDOW)\n    })\n  })\n\n  it('key releases by the repository they were requested for', async () => {\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:repo/releases',\n        ({params}) =>\n          HttpResponse.json([\n            releasePayload({name: `${params.repo}`, published_at: IN_WINDOW})\n          ])\n      )\n    )\n    const r = new ReleaseAdapter(\n      new GitHubClient(),\n      'o',\n      ['api', 'api-gateway'],\n      WINDOW\n    )\n\n    const releases = await r.GetAllReleasesLastMonth()\n\n    expect(releases.map(x => [x.repo, x.name])).toEqual([\n      ['o/api', 'api'],\n      ['o/api-gateway', 'api-gateway']\n    ])\n  })\n\n  it('request releases without a since parameter, with auth and api-version headers', async () => {\n    const seen: Request[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/releases',\n        ({request}) => {\n          seen.push(request)\n          return HttpResponse.json([\n            releasePayload({id: 1, published_at: IN_WINDOW})\n          ])\n        }\n      )\n    )\n    const r = new ReleaseAdapter(\n      new GitHubClient({token: 'my-token'}),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    await r.GetAllReleasesLastMonth()\n\n    expect(seen.length).toBe(1)\n    const url = new URL(seen[0].url)\n    expect(url.pathname).toBe('/repos/test-owner/project1/releases')\n    expect([...url.searchParams.keys()].sort()).toEqual(['page', 'per_page'])\n    expect(url.searchParams.get('per_page')).toBe('100')\n    expect(url.searchParams.get('page')).toBe('1')\n    expect(seen[0].headers.get('authorization')).toBe('token my-token')\n    expect(seen[0].headers.get('x-github-api-version')).toBe('2022-11-28')\n  })\n\n  it('stop requesting pages once a page holds a release older than the window', async () => {\n    const pages: string[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/releases',\n        ({request}) => {\n          const page = new URL(request.url).searchParams.get('page') as string\n          pages.push(page)\n          const items = Array.from({length: 100}, (_, i) =>\n            releasePayload({\n              name: `p${page}-${i.toString()}`,\n              published_at: IN_WINDOW\n            })\n          )\n          if (page === '2') {\n            items[98] = releasePayload({\n              name: 'old-1',\n              published_at: BEFORE_WINDOW\n            })\n            items[99] = releasePayload({\n              name: 'old-2',\n              published_at: BEFORE_WINDOW\n            })\n          }\n          return HttpResponse.json(items)\n        }\n      )\n    )\n    const r = new ReleaseAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const releases = await r.GetAllReleasesLastMonth()\n\n    expect(pages).toEqual(['1', '2'])\n    expect(releases.length).toBe(198)\n    expect(releases.map(x => x.name)).not.toContain('old-1')\n    expect(releases.at(-1)?.name).toBe('p2-97')\n  })\n\n  it('keep a release published exactly 60 days ago and drop one 62 days ago', async () => {\n    server.use(\n      http.get('https://api.github.com/repos/:owner/:rep/releases', () =>\n        HttpResponse.json([\n          releasePayload({name: 'kept', published_at: '2024-01-01T12:00:00Z'}),\n          releasePayload({\n            name: 'dropped',\n            published_at: '2023-12-30T12:00:00Z'\n          })\n        ])\n      )\n    )\n    const r = new ReleaseAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const releases = await r.GetAllReleasesLastMonth()\n\n    expect(releases.map(x => x.name)).toEqual(['kept'])\n  })\n\n  it('judge drafts without published_at by created_at', async () => {\n    server.use(\n      http.get('https://api.github.com/repos/:owner/:rep/releases', () =>\n        HttpResponse.json([\n          releasePayload({\n            name: 'recent-draft',\n            draft: true,\n            published_at: null,\n            created_at: IN_WINDOW\n          }),\n          releasePayload({name: 'v1', published_at: IN_WINDOW}),\n          releasePayload({\n            name: 'old-draft',\n            draft: true,\n            published_at: null,\n            created_at: BEFORE_WINDOW\n          }),\n          releasePayload({name: 'v0', published_at: IN_WINDOW})\n        ])\n      )\n    )\n    const r = new ReleaseAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const releases = await r.GetAllReleasesLastMonth()\n\n    expect(releases.map(x => x.name)).toEqual(['recent-draft', 'v1'])\n  })\n\n  it('request pages 1 to 99 at most when every page is full', async () => {\n    const pages: string[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/releases',\n        ({request}) => {\n          pages.push(new URL(request.url).searchParams.get('page') as string)\n          return HttpResponse.json(\n            Array.from({length: 100}, (_, i) =>\n              releasePayload({id: i, published_at: IN_WINDOW})\n            )\n          )\n        }\n      )\n    )\n    const r = new ReleaseAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const releases = await r.GetAllReleasesLastMonth()\n\n    expect(pages.length).toBe(99)\n    expect(pages[0]).toBe('1')\n    expect(pages[1]).toBe('2')\n    expect(pages[98]).toBe('99')\n    expect(releases.length).toBe(9900)\n  })\n\n  it('throw a GitHubApiError on access denied', async () => {\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/releases',\n        () => new HttpResponse('access denied', {status: 401})\n      )\n    )\n    const r = new ReleaseAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const error = await r.GetAllReleasesLastMonth().catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message:\n        'GitHub API request failed (401) for GET /repos/{owner}/{repo}/releases',\n      status: 401\n    })\n  })\n})\n"},"__tests__/log.spec.ts":{"tests":[{"id":"229","name":"serializeLog renders an empty log as an empty JSON array"},{"id":"230","name":"serializeLog renders every entry when under the caps, with no truncated marker"},{"id":"231","name":"serializeLog defaults to 500 entries and just under 1 MiB"},{"id":"232","name":"serializeLog caps the entry count and appends a truncated record with the omitted count"},{"id":"233","name":"serializeLog keeps exactly maxEntries when the input has exactly that many"},{"id":"234","name":"serializeLog caps the serialized byte size before the entry count is reached"},{"id":"235","name":"serializeLog keeps an entry that fits exactly against the byte cap"},{"id":"236","name":"serializeLog measures multi-byte characters in bytes, not code units"},{"id":"237","name":"serializeLog never exceeds the default byte cap for 1,000 maximal pull records"},{"id":"238","name":"log outputs end to end emits a lead-time log an attacker cannot break out of"},{"id":"239","name":"log outputs end to end emits a deploy-rate log an attacker cannot break out of"},{"id":"240","name":"log outputs end to end bounds the lead-time log for 1,000 pull requests"}],"source":"import {defaultLogLimits, serializeLog} from '../src/log'\nimport type {LogEntry, PullLogEntry} from '../src/types/LogEntry'\nimport {LeadTime} from '../src/LeadTime'\nimport {DeployFrequency} from '../src/DeployFrequency'\nimport {toCommit, toPullRequest, toRelease} from '../src/github/mappers'\nimport type {ICommitsAdapter} from '../src/interfaces/ICommitsAdapter'\nimport type {Commit} from '../src/types/Commit'\nimport {pull, release, windowAt} from './helpers/domain'\nimport {\n  commitPayload,\n  pullRequestPayload,\n  releasePayload\n} from './helpers/payloads'\n\nconst INJECTION = '`id` ${{ github.token }} $(rm -rf /)\\necho pwned'\nconst UNSAFE = /[`\\n\\r]|\\$\\{|\\$\\(/\n\nfunction releaseEntry(i: number): LogEntry {\n  return {\n    kind: 'release',\n    repo: 'o/r',\n    at: '2023-04-22T20:28:29Z',\n    name: `v${i}`\n  }\n}\n\nfunction stringFields(value: unknown): string[] {\n  if (typeof value === 'string') return [value]\n  if (Array.isArray(value)) return value.flatMap(stringFields)\n  if (value && typeof value === 'object')\n    return Object.values(value).flatMap(stringFields)\n  return []\n}\n\ndescribe('serializeLog', () => {\n  it('renders an empty log as an empty JSON array', () => {\n    expect(serializeLog([])).toBe('[]')\n  })\n\n  it('renders every entry when under the caps, with no truncated marker', () => {\n    const entries = [releaseEntry(1), releaseEntry(2)]\n\n    const out = serializeLog(entries)\n\n    expect(out).toBe(JSON.stringify(entries))\n    expect(JSON.parse(out)).toEqual(entries)\n  })\n\n  it('defaults to 500 entries and just under 1 MiB', () => {\n    expect(defaultLogLimits()).toEqual({maxEntries: 500, maxBytes: 1047552})\n  })\n\n  it('caps the entry count and appends a truncated record with the omitted count', () => {\n    const entries = Array.from({length: 1000}, (_, i) => releaseEntry(i))\n\n    const parsed = JSON.parse(serializeLog(entries)) as LogEntry[]\n\n    expect(parsed).toHaveLength(501)\n    expect(parsed.slice(0, 500)).toEqual(entries.slice(0, 500))\n    expect(parsed[500]).toEqual({kind: 'truncated', omitted: 500})\n  })\n\n  it('keeps exactly maxEntries when the input has exactly that many', () => {\n    const entries = Array.from({length: 3}, (_, i) => releaseEntry(i))\n\n    const parsed = JSON.parse(\n      serializeLog(entries, {maxEntries: 3, maxBytes: 10_000})\n    ) as LogEntry[]\n\n    expect(parsed).toEqual(entries)\n  })\n\n  it('caps the serialized byte size before the entry count is reached', () => {\n    const entries = Array.from({length: 10}, (_, i) => releaseEntry(i))\n    const one = JSON.stringify(releaseEntry(0)).length\n    // A fourth entry fits only if the three separating commas are not counted.\n    const maxBytes = 4 * one + 67\n\n    const out = serializeLog(entries, {maxEntries: 100, maxBytes})\n    const parsed = JSON.parse(out) as LogEntry[]\n\n    expect(Buffer.byteLength(out)).toBeLessThanOrEqual(maxBytes)\n    expect(parsed).toHaveLength(4)\n    expect(parsed.slice(0, 3)).toEqual(entries.slice(0, 3))\n    expect(parsed[3]).toEqual({kind: 'truncated', omitted: 7})\n  })\n\n  it('keeps an entry that fits exactly against the byte cap', () => {\n    const entries = Array.from({length: 3}, (_, i) => releaseEntry(i))\n    const one = JSON.stringify(releaseEntry(0)).length\n    // Brackets + three entries + two commas + the 64-byte truncated reserve.\n    const maxBytes = 2 + 3 * one + 2 + 64\n\n    const parsed = JSON.parse(\n      serializeLog(entries, {maxEntries: 100, maxBytes})\n    ) as LogEntry[]\n\n    expect(parsed).toEqual(entries)\n  })\n\n  it('measures multi-byte characters in bytes, not code units', () => {\n    const wide: LogEntry = {\n      kind: 'release',\n      repo: 'o/r',\n      at: 'x',\n      name: '€€€€€€€€€€'\n    }\n    const bytes = Buffer.byteLength(JSON.stringify(wide))\n    const chars = JSON.stringify(wide).length\n    expect(bytes).toBeGreaterThan(chars)\n\n    const parsed = JSON.parse(\n      serializeLog([wide, wide], {maxEntries: 10, maxBytes: 2 + chars + 64})\n    ) as LogEntry[]\n\n    expect(parsed).toEqual([{kind: 'truncated', omitted: 2}])\n  })\n\n  it('never exceeds the default byte cap for 1,000 maximal pull records', () => {\n    const big: PullLogEntry = {\n      kind: 'pull',\n      repo: `${'O'.repeat(100)}/${'R'.repeat(100)}`,\n      at: '2023-04-28T17:50:53Z',\n      title: 'T'.repeat(200),\n      commitAt: '2023-04-20T00:00:00Z',\n      commitMessage: 'M'.repeat(200),\n      releaseAt: '2023-04-30T17:50:53Z',\n      release: 'R'.repeat(200),\n      leadTimeDays: 10.74\n    }\n    const entries = Array.from({length: 1000}, () => big)\n\n    const out = serializeLog(entries)\n\n    expect(Buffer.byteLength(out)).toBeLessThan(1024 * 1024)\n    expect(JSON.parse(out)).toHaveLength(501)\n  })\n})\n\ndescribe('log outputs end to end', () => {\n  const commits: ICommitsAdapter = {\n    getCommits: async (): Promise<"+"Commit[]> => [\n      toCommit(commitPayload('2023-04-20T00:00:00Z', INJECTION))\n    ]\n  }\n  const today = new Date('2023-05-01T00:00:00Z')\n\n  it('emits a lead-time log an attacker cannot break out of', async () => {\n    const pulls = [\n      toPullRequest('o', 'r', pullRequestPayload({title: INJECTION}))\n    ]\n    const releases = [toRelease('o', 'r', releasePayload({name: INJECTION}))]\n    const lt = new LeadTime(pulls, releases, commits, {window: windowAt(today)})\n    await lt.getLeadTime()\n\n    const out = serializeLog(lt.getLog())\n    const parsed = JSON.parse(out) as PullLogEntry[]\n\n    expect(parsed).toHaveLength(1)\n    expect(parsed[0].kind).toBe('pull')\n    expect(parsed[0].title).toBe('id {{ github.token }} (rm -rf /) echo pwned')\n    for (const field of stringFields(parsed)) {\n      expect(field).not.toMatch(UNSAFE)\n    }\n    expect(out).not.toMatch(/[`\\n\\r]|\\$\\{|\\$\\(/)\n  })\n\n  it('emits a deploy-rate log an attacker cannot break out of', () => {\n    const releases = [\n      toRelease(\n        'o',\n        'r',\n        releasePayload({name: INJECTION, published_at: '2023-04-30T17:50:53Z'})\n      )\n    ]\n    const df = new DeployFrequency(releases, {\n      window: windowAt('2023-05-01T00:00:00Z')\n    })\n    df.rate()\n\n    const out = serializeLog(df.getLog())\n    const parsed = JSON.parse(out) as LogEntry[]\n\n    expect(parsed).toEqual([\n      {\n        kind: 'release',\n        repo: 'o/r',\n        at: '2023-04-30T17:50:53Z',\n        name: 'id {{ github.token }} (rm -rf /) echo pwned'\n      }\n    ])\n    expect(out).not.toMatch(/[`\\n\\r]|\\$\\{|\\$\\(/)\n  })\n\n  it('bounds the lead-time log for 1,000 pull requests', async () => {\n    const pulls = Array.from({length: 1000}, (_, i) =>\n      pull({title: `feat: change ${i.toString()}`})\n    )\n    const lt = new LeadTime(pulls, [release('2023-04-30T17:50:53Z')], commits, {\n      window: windowAt(today),\n      limits: {maxCommitFetches: 1000, concurrency: 4}\n    })\n    await lt.getLeadTime()\n\n    const out = serializeLog(lt.getLog())\n    const parsed = JSON.parse(out) as LogEntry[]\n\n    expect(lt.getLog()).toHaveLength(1000)\n    expect(parsed).toHaveLength(501)\n    expect(parsed[0]).toMatchObject({kind: 'pull', title: 'feat: change 0'})\n    expect(parsed[500]).toEqual({kind: 'truncated', omitted: 500})\n    expect(Buffer.byteLength(out)).toBeLessThan(1024 * 1024)\n  })\n})\n"},"__tests__/index.test.ts":{"tests":[{"id":"241","name":"index.ts bootstrap parses inputs from the Actions runtime and runs with a client built from the token"},{"id":"242","name":"index.ts bootstrap reports a failing run through core.setFailed"},{"id":"243","name":"index.ts bootstrap sets the stable GitHubApiError message and logs the raw cause separately"},{"id":"244","name":"index.ts bootstrap does not log a cause that is not an Error"},{"id":"245","name":"index.ts bootstrap stringifies non-Error rejections"},{"id":"246","name":"index.ts bootstrap reports input parsing failures through core.setFailed without running"},{"id":"247","name":"index.ts token resolution (real parseInputs) fails before building a client when neither the token input nor GH_TOKEN is set"},{"id":"248","name":"index.ts token resolution (real parseInputs) registers a GH_TOKEN-sourced token as a secret before building the client"},{"id":"249","name":"index.ts token resolution (real parseInputs) fails with a validation message before any API call when repo is a path traversal"},{"id":"250","name":"index.ts token resolution (real parseInputs) resolves an owner/repo entry and runs against the repo name"},{"id":"251","name":"index.ts token resolution (real parseInputs) warns and treats an unrecognised logging value as false"}],"source":"import * as core from '@actions/core'\nimport * as github from '@actions/github'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport {parseInputs, run} from '../src/main'\nimport type {Inputs} from '../src/main'\n\nvi.mock('@actions/core')\nvi.mock('@actions/github')\n// Only the client is mocked; GitHubApiError must stay real for instanceof in index.ts.\nvi.mock('../src/GitHubClient', async importOriginal => ({\n  ...(await importOriginal<"+"typeof import('../src/GitHubClient')>()),\n  GitHubClient: vi.fn()\n}))\nvi.mock('../src/main')\n\nconst inputs: Inputs = {\n  owner: 'o',\n  repositories: ['repo1'],\n  token: 'the-token',\n  logging: false,\n  filtered: false,\n  bugLabel: 'bug'\n}\n\n// index.ts runs at import time, so each case needs a fresh module instance.\nasync function importIndex(): Promise<"+"void> {\n  vi.resetModules()\n  await import('../src/index')\n  // Let the floating bootstrap() promise settle.\n  await new Promise(resolve => setImmediate(resolve))\n}\n\ndescribe('index.ts bootstrap', () => {\n  beforeEach(() => {\n    vi.clearAllMocks()\n    vi.mocked(parseInputs).mockReturnValue(inputs)\n  })\n\n  it('parses inputs from the Actions runtime and runs with a client built from the token', async () => {\n    await importIndex()\n\n    expect(parseInputs).toHaveBeenCalledWith(core, github.context, process.env)\n    expect(GitHubClient).toHaveBeenCalledWith({\n      token: 'the-token',\n      logger: core\n    })\n    expect(run).toHaveBeenCalledWith({\n      inputs,\n      client: vi.mocked(GitHubClient).mock.instances[0],\n      core\n    })\n    expect(core.setFailed).not.toHaveBeenCalled()\n  })\n\n  it('reports a failing run through core.setFailed', async () => {\n    vi.mocked(run).mockRejectedValueOnce(new Error('Failed to fetch releases'))\n\n    await importIndex()\n\n    expect(core.setFailed).toHaveBeenCalledWith('Failed to fetch releases')\n    expect(core.error).not.toHaveBeenCalled()\n  })\n\n  it('sets the stable GitHubApiError message and logs the raw cause separately', async () => {\n    const cause = Object.assign(new Error('Forbidden: https://x/y {body}'), {\n      status: 403\n    })\n    vi.mocked(run).mockRejectedValueOnce(new GitHubApiError('GET /x', cause))\n\n    await importIndex()\n\n    expect(core.error).toHaveBeenCalledWith('Forbidden: https://x/y {body}')\n    expect(core.setFailed).toHaveBeenCalledWith(\n      'GitHub API request failed (403) for GET /x'\n    )\n    expect(core.setFailed).toHaveBeenCalledTimes(1)\n  })\n\n  it('does not log a cause that is not an Error', async () => {\n    vi.mocked(run).mockRejectedValueOnce(new GitHubApiError('GET /x', 'boom'))\n\n    await importIndex()\n\n    expect(core.error).not.toHaveBeenCalled()\n    expect(core.setFailed).toHaveBeenCalledWith(\n      'GitHub API request failed (unknown) for GET /x'\n    )\n  })\n\n  it('stringifies non-Error rejections', async () => {\n    vi.mocked(run).mockRejectedValueOnce('boom')\n\n    await importIndex()\n\n    expect(core.setFailed).toHaveBeenCalledWith('boom')\n  })\n\n  it('reports input parsing failures through core.setFailed without running', async () => {\n    vi.mocked(parseInputs).mockImplementationOnce(() => {\n      throw new Error('bad input')\n    })\n\n    await importIndex()\n\n    expect(core.setFailed).toHaveBeenCalledWith('bad input')\n    expect(run).not.toHaveBeenCalled()\n  })\n})\n\ndescribe('index.ts token resolution (real parseInputs)', () => {\n  beforeEach(async () => {\n    vi.clearAllMocks()\n    const actual =\n      await vi.importActual<"+"typeof import('../src/main')>('../src/main')\n    vi.mocked(parseInputs).mockImplementation(actual.parseInputs)\n    vi.mocked(core.getInput).mockImplementation((name: string) =>\n      name === 'repo' ? 'repo1' : name === 'owner' ? 'o' : ''\n    )\n  })\n\n  afterEach(() => {\n    vi.unstubAllEnvs()\n  })\n\n  it('fails before building a client when neither the token input nor GH_TOKEN is set', async () => {\n    vi.stubEnv('GH_TOKEN', undefined)\n\n    await importIndex()\n\n    expect(core.setFailed).toHaveBeenCalledExactlyOnceWith(\n      'A GitHub token is required: set the `token` input or the GH_TOKEN environment variable'\n    )\n    expect(GitHubClient).not.toHaveBeenCalled()\n    expect(run).not.toHaveBeenCalled()\n  })\n\n  it('registers a GH_TOKEN-sourced token as a secret before building the client', async () => {\n    vi.stubEnv('GH_TOKEN', 'env-secret')\n\n    await importIndex()\n\n    expect(core.setSecret).toHaveBeenCalledExactlyOnceWith('env-secret')\n    expect(GitHubClient).toHaveBeenCalledWith({\n      token: 'env-secret',\n      logger: core\n    })\n    expect(vi.mocked(core.setSecret).mock.invocationCallOrder[0]).toBeLessThan(\n      vi.mocked(GitHubClient).mock.invocationCallOrder[0]\n    )\n    expect(core.setFailed).not.toHaveBeenCalled()\n  })\n\n  it('fails with a validation message before any API call when repo is a path traversal', async () => {\n    vi.stubEnv('GH_TOKEN', 'env-secret')\n    vi.mocked(core.getInput).mockImplementation((name: string) =>\n      name === 'repo' ? '../../x' : name === 'owner' ? 'o' : ''\n    )\n\n    await importIndex()\n\n    expect(core.setFailed).toHaveBeenCalledExactlyOnceWith(\n      'Invalid repo \"../../x\": expected \"name\" or \"owner/name\"'\n    )\n    expect(GitHubClient).not.toHaveBeenCalled()\n    expect(run).not.toHaveBeenCalled()\n  })\n\n  it('resolves an owner/repo entry and runs against the repo name', async () => {\n    vi.stubEnv('GH_TOKEN', 'env-secret')\n    vi.mocked(core.getInput).mockImplementation((name: string) =>\n      name === 'repo'\n        ? 'stenjo/devops-metrics-action'\n        : name === 'owner'\n          ? 'stenjo'\n          : ''\n    )\n\n    await importIndex()\n\n    expect(run).toHaveBeenCalledWith(\n      expect.objectContaining({\n        inputs: expect.objectContaining({\n          owner: 'stenjo',\n          repositories: ['devops-metrics-action']\n        }) as Inputs\n      })\n    )\n    expect(core.setFailed).not.toHaveBeenCalled()\n  })\n\n  it('warns and treats an unrecognised logging value as false', async () => {\n    vi.stubEnv('GH_TOKEN', 'env-secret')\n    vi.mocked(core.getInput).mockImplementation((name: string) =>\n      name === 'repo'\n        ? 'repo1'\n        : name === 'owner'\n          ? 'o'\n          : name === 'logging'\n            ? 'yes'\n            : ''\n    )\n\n    await importIndex()\n\n    expect(core.warning).toHaveBeenCalledExactlyOnceWith(\n      `Unrecognised value \"yes\" for input 'logging': expected 'true' or 'false', treating it as false`\n    )\n    expect(run).toHaveBeenCalledWith(\n      expect.objectContaining({\n        inputs: expect.objectContaining({logging: false}) as Inputs\n      })\n    )\n    expect(core.setFailed).not.toHaveBeenCalled()\n  })\n})\n"},"__tests__/PullRequestsAdapter.test.ts":{"tests":[{"id":"252","name":"PullRequest Adapter should ice breaker"},{"id":"253","name":"PullRequest Adapter should return paged values"},{"id":"254","name":"PullRequest Adapter should request closed pulls newest-updated first without a since parameter"},{"id":"255","name":"PullRequest Adapter should stop requesting pages once a page holds a pull updated before the window"},{"id":"256","name":"PullRequest Adapter should keep a pull updated exactly 60 days ago and drop one 62 days ago"},{"id":"257","name":"PullRequest Adapter should request pages 1 to 99 at most when every page is full"},{"id":"258","name":"PullRequest Adapter should throw a GitHubApiError on access denied"}],"source":"import {http, HttpResponse} from 'msw'\nimport {setupServer} from 'msw/node'\nimport {PullRequestsAdapter} from '../src/PullRequestsAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport type {PullRequest} from '../src/types/PullRequest'\nimport type {GitHubPullRequestPayload} from '../src/github/payloads'\nimport {pullRequestPayload} from './helpers/payloads'\nimport {windowAt} from './helpers/domain'\n\n// fetchFrom is 60 days earlier (30-day window + 30-day look-back): 2024-01-01T12:00:00Z.\nconst TODAY = new Date('2024-03-01T12:00:00Z')\nconst WINDOW = windowAt(TODAY)\nconst IN_WINDOW = '2024-02-01T00:00:00Z'\nconst BEFORE_WINDOW = '2023-12-01T00:00:00Z'\n\nconst server = setupServer(\n  http.get(\n    'https://api.github.com/repos/:owner/:rep/pulls',\n    // eslint-disable-next-line @typescript-eslint/no-unused-vars\n    ({request, params, cookies}) => {\n      const url = new URL(request.url)\n      const page = url.searchParams.getAll('page')\n      const pullRequests: GitHubPullRequestPayload[] = []\n      for (let i = 0; i <"+" (+page <"+" 2 ? 100 : 50); i++) {\n        pullRequests.push(pullRequestPayload({id: i, updated_at: IN_WINDOW}))\n      }\n      return HttpResponse.json(pullRequests)\n    }\n  )\n)\ndescribe('PullRequest Adapter should', () => {\n  beforeAll(() => server.listen())\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n  })\n\n  afterEach(() => server.resetHandlers())\n\n  afterAll(() => server.close())\n\n  it('ice breaker', () => {\n    expect(true).toBe(true)\n  })\n\n  it('return paged values', async () => {\n    const r = new PullRequestsAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const pullRequests: PullRequest[] = await r.GetAllPRsLastMonth()\n\n    expect(pullRequests.length).toBe(150)\n  })\n\n  it('request closed pulls newest-updated first without a since parameter', async () => {\n    const seen: Request[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/pulls',\n        ({request}) => {\n          seen.push(request)\n          return HttpResponse.json([\n            pullRequestPayload({id: 1, updated_at: IN_WINDOW})\n          ])\n        }\n      )\n    )\n    const r = new PullRequestsAdapter(\n      new GitHubClient({token: 'my-token'}),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    await r.GetAllPRsLastMonth()\n\n    expect(seen.length).toBe(1)\n    const url = new URL(seen[0].url)\n    expect(url.pathname).toBe('/repos/test-owner/project1/pulls')\n    expect([...url.searchParams.keys()].sort()).toEqual([\n      'direction',\n      'page',\n      'per_page',\n      'sort',\n      'state'\n    ])\n    expect(url.searchParams.get('state')).toBe('closed')\n    expect(url.searchParams.get('sort')).toBe('updated')\n    expect(url.searchParams.get('direction')).toBe('desc')\n    expect(url.searchParams.get('per_page')).toBe('100')\n    expect(url.searchParams.get('page')).toBe('1')\n    expect(seen[0].headers.get('authorization')).toBe('token my-token')\n    expect(seen[0].headers.get('x-github-api-version')).toBe('2022-11-28')\n  })\n\n  it('stop requesting pages once a page holds a pull updated before the window', async () => {\n    const pages: string[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/pulls',\n        ({request}) => {\n          const page = new URL(request.url).searchParams.get('page') as string\n          pages.push(page)\n          const items = Array.from({length: 100}, (_, i) =>\n            pullRequestPayload({\n              number: +page * 1000 + i,\n              updated_at: IN_WINDOW\n            })\n          )\n          if (page === '2') {\n            items[98] = pullRequestPayload({\n              number: 1,\n              updated_at: BEFORE_WINDOW\n            })\n            items[99] = pullRequestPayload({\n              number: 2,\n              updated_at: BEFORE_WINDOW\n            })\n          }\n          return HttpResponse.json(items)\n        }\n      )\n    )\n    const r = new PullRequestsAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const pullRequests = await r.GetAllPRsLastMonth()\n\n    expect(pages).toEqual(['1', '2'])\n    expect(pullRequests.length).toBe(198)\n    expect(pullRequests.map(x => x.number)).not.toContain(1)\n    expect(pullRequests.at(-1)?.number).toBe(2097)\n  })\n\n  it('keep a pull updated exactly 60 days ago and drop one 62 days ago', async () => {\n    server.use(\n      http.get('https://api.github.com/repos/:owner/:rep/pulls', () =>\n        HttpResponse.json([\n          pullRequestPayload({number: 60, updated_at: '2024-01-01T12:00:00Z'}),\n          pullRequestPayload({number: 62, updated_at: '2023-12-30T12:00:00Z'})\n        ])\n      )\n    )\n    const r = new PullRequestsAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const pullRequests = await r.GetAllPRsLastMonth()\n\n    expect(pullRequests.map(x => x.number)).toEqual([60])\n  })\n\n  it('request pages 1 to 99 at most when every page is full', async () => {\n    const pages: string[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/pulls',\n        ({request}) => {\n          pages.push(new URL(request.url).searchParams.get('page') as string)\n          return HttpResponse.json(\n            Array.from({length: 100}, (_, i) =>\n              pullRequestPayload({id: i, updated_at: IN_WINDOW})\n            )\n          )\n        }\n      )\n    )\n    const r = new PullRequestsAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const pullRequests = await r.GetAllPRsLastMonth()\n\n    expect(pages.length).toBe(99)\n    expect(pages[0]).toBe('1')\n    expect(pages[1]).toBe('2')\n    expect(pages[98]).toBe('99')\n    expect(pullRequests.length).toBe(9900)\n  })\n\n  it('throw a GitHubApiError on access denied', async () => {\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/pulls',\n        () => new HttpResponse('access denied', {status: 401})\n      )\n    )\n    const r = new PullRequestsAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const error = await r.GetAllPRsLastMonth().catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message:\n        'GitHub API request failed (401) for GET /repos/{owner}/{repo}/pulls',\n      status: 401\n    })\n  })\n})\n"},"__tests__/IssuesAdapter.test.ts":{"tests":[{"id":"259","name":"Issue Adapter should ice breaker"},{"id":"260","name":"Issue Adapter should return paged values"},{"id":"261","name":"Issue Adapter should request issues since 60 days back with auth and api-version headers"},{"id":"262","name":"Issue Adapter should stop requesting pages once a page holds an issue updated before the window"},{"id":"263","name":"Issue Adapter should keep paging past an issue with no updated_at"},{"id":"264","name":"Issue Adapter should request pages 1 to 99 at most when every page is full"},{"id":"265","name":"Issue Adapter should throw a GitHubApiError on access denied"}],"source":"import {http, HttpResponse} from 'msw'\nimport {setupServer} from 'msw/node'\nimport {IssuesAdapter} from '../src/IssuesAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport type {Issue} from '../src/types/Issue'\nimport type {GitHubIssuePayload} from '../src/github/payloads'\nimport {issuePayload} from './helpers/payloads'\nimport {windowAt} from './helpers/domain'\n\n// fetchFrom is 60 days earlier (30-day w
