indow + 30-day look-back): 2024-01-01T12:00:00Z.\nconst TODAY = new Date('2024-03-01T12:00:00Z')\nconst WINDOW = windowAt(TODAY)\nconst IN_WINDOW = '2024-02-01T00:00:00Z'\nconst BEFORE_WINDOW = '2023-12-01T00:00:00Z'\n\nconst server = setupServer(\n  http.get(\n    'https://api.github.com/repos/:owner/:rep/issues',\n    // eslint-disable-next-line @typescript-eslint/no-unused-vars\n    ({request, params, cookies}) => {\n      const url = new URL(request.url)\n      const page = url.searchParams.getAll('page')\n      const issues: GitHubIssuePayload[] = []\n      for (let i = 0; i <"+" (+page <"+" 2 ? 100 : 50); i++) {\n        issues.push(issuePayload({id: i, updated_at: IN_WINDOW}))\n      }\n      return HttpResponse.json(issues)\n    }\n  )\n)\ndescribe('Issue Adapter should', () => {\n  beforeAll(() => server.listen())\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n  })\n\n  afterEach(() => server.resetHandlers())\n\n  afterAll(() => server.close())\n\n  it('ice breaker', () => {\n    expect(true).toBe(true)\n  })\n\n  it('return paged values', async () => {\n    const r = new IssuesAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const issues: Issue[] = await r.GetAllIssuesLastMonth()\n\n    expect(issues.length).toBe(150)\n  })\n\n  it('request issues since 60 days back with auth and api-version headers', async () => {\n    const seen: Request[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/issues',\n        ({request}) => {\n          seen.push(request)\n          return HttpResponse.json([\n            issuePayload({id: 1, updated_at: IN_WINDOW})\n          ])\n        }\n      )\n    )\n    const r = new IssuesAdapter(\n      new GitHubClient({token: 'my-token'}),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    await r.GetAllIssuesLastMonth()\n\n    expect(seen.length).toBe(1)\n    const url = new URL(seen[0].url)\n    expect(url.pathname).toBe('/repos/test-owner/project1/issues')\n    expect([...url.searchParams.keys()].sort()).toEqual([\n      'page',\n      'per_page',\n      'since',\n      'state'\n    ])\n    expect(url.searchParams.get('state')).toBe('all')\n    expect(url.searchParams.get('since')).toBe('2024-01-01T12:00:00.000Z')\n    expect(url.searchParams.get('per_page')).toBe('100')\n    expect(url.searchParams.get('page')).toBe('1')\n    expect(seen[0].headers.get('authorization')).toBe('token my-token')\n    expect(seen[0].headers.get('x-github-api-version')).toBe('2022-11-28')\n  })\n\n  it('stop requesting pages once a page holds an issue updated before the window', async () => {\n    const pages: string[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/issues',\n        ({request}) => {\n          const page = new URL(request.url).searchParams.get('page') as string\n          pages.push(page)\n          const items = Array.from({length: 100}, (_, i) =>\n            issuePayload({number: +page * 1000 + i, updated_at: IN_WINDOW})\n          )\n          if (page === '2') {\n            items[98] = issuePayload({number: 1, updated_at: BEFORE_WINDOW})\n            items[99] = issuePayload({number: 2, updated_at: BEFORE_WINDOW})\n          }\n          return HttpResponse.json(items)\n        }\n      )\n    )\n    const r = new IssuesAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const issues = await r.GetAllIssuesLastMonth()\n\n    expect(pages).toEqual(['1', '2'])\n    expect(issues.length).toBe(198)\n    expect(issues.map(x => x.number)).not.toContain(1)\n    expect(issues.at(-1)?.number).toBe(2097)\n  })\n\n  it('keep paging past an issue with no updated_at', async () => {\n    server.use(\n      http.get('https://api.github.com/repos/:owner/:rep/issues', () =>\n        HttpResponse.json([\n          issuePayload({\n            number: 1,\n            updated_at: null,\n            created_at: BEFORE_WINDOW\n          }),\n          issuePayload({number: 2, updated_at: IN_WINDOW})\n        ])\n      )\n    )\n    const r = new IssuesAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const issues = await r.GetAllIssuesLastMonth()\n\n    expect(issues.map(x => x.number)).toEqual([1, 2])\n  })\n\n  it('request pages 1 to 99 at most when every page is full', async () => {\n    const pages: string[] = []\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/issues',\n        ({request}) => {\n          pages.push(new URL(request.url).searchParams.get('page') as string)\n          return HttpResponse.json(\n            Array.from({length: 100}, (_, i) =>\n              issuePayload({id: i, updated_at: IN_WINDOW})\n            )\n          )\n        }\n      )\n    )\n    const r = new IssuesAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const issues = await r.GetAllIssuesLastMonth()\n\n    expect(pages.length).toBe(99)\n    expect(pages[0]).toBe('1')\n    expect(pages[1]).toBe('2')\n    expect(pages[98]).toBe('99')\n    expect(issues.length).toBe(9900)\n  })\n\n  it('throw a GitHubApiError on access denied', async () => {\n    server.use(\n      http.get(\n        'https://api.github.com/repos/:owner/:rep/issues',\n        () => new HttpResponse('access denied', {status: 401})\n      )\n    )\n    const r = new IssuesAdapter(\n      new GitHubClient(),\n      'test-owner',\n      ['project1'],\n      WINDOW\n    )\n\n    const error = await r.GetAllIssuesLastMonth().catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message:\n        'GitHub API request failed (401) for GET /repos/{owner}/{repo}/issues',\n      status: 401\n    })\n  })\n})\n"},"__tests__/DeployFrequency.test.ts":{"tests":[{"id":"266","name":"Deploy frequency should calculate releases pr week for release less than 1 week"},{"id":"267","name":"Deploy frequency should calculate releases pr week for release more than 1 week ago"},{"id":"268","name":"Deploy frequency should calculate releases pr week for release this week based on large list"},{"id":"269","name":"Deploy frequency should monthly calculate releases pr week for release more than 1 week ago"},{"id":"270","name":"Deploy frequency should calculate release rate last month"},{"id":"271","name":"Deploy frequency should calculate release rate last month based on 7 releases list"},{"id":"272","name":"Deploy frequency should calculate release rate next month"},{"id":"273","name":"Deploy frequency should reports a zero rate and an empty log when there are no releases"},{"id":"274","name":"Deploy frequency should get an empty log of releases"},{"id":"275","name":"Deploy frequency should get release log list weekly when rate calculated"},{"id":"276","name":"Deploy frequency should get release log list monthly when rate calculated"},{"id":"277","name":"Deploy frequency should get release log list when rate calculated"},{"id":"278","name":"Deploy frequency should log release name and date weekly"},{"id":"279","name":"Deploy frequency should log release name and date monthly"}],"source":"//\nimport {DeployFrequency} from '../src/DeployFrequency'\nimport fs from 'node:fs'\nimport type {Release} from '../src/types/Release'\nimport type {GitHubReleasePayload} from '../src/github/payloads'\nimport {toRelease} from '../src/github/mappers'\nimport {windowAt} from './helpers/domain'\n\nfunction loadReleases(file: string, repo: string): Release[] {\n  return (\n    JSON.parse(fs.readFileSync(file, 'utf-8')) as GitHubReleasePayload[]\n  ).map(p => toRelease('stenjo', repo, p))\n}\n\ndescribe('Deploy frequency should', () => {\n  // Release v0.0.1:2023-04-14, v0.0.2:2023-04-22\n  const releaseList2: Release[] = loadReleases(\n    './__tests__/test-data/one-release.json',\n    'dora'\n  )\n  // Release\n  // v0.0.1:2023-04-12, v0.0.2:2023-04-22, v0.1.0:2023-04-29,\n  // v0.2.0:2023-04-30, v0.2.1:2023-04-30, v0.3.0-beta:2023-04-30,\n  // v0.3.1-beta:2023-04-30\n  const releaseList7: Release[] = loadReleases(\n    './__tests__/test-data/releases.json',\n    'devops-metrics-action'\n  )\n  it('calculate releases pr week for release less than 1 week', () => {\n    const df = new DeployFrequency(releaseList2, {\n      window: windowAt('2023-04-14T22:33:11Z')\n    })\n    const wr = df.weekly()\n\n    expect(wr).toBe(1)\n  })\n  it('calculate releases pr week for release more than 1 week ago', () => {\n    const df = new DeployFrequency(releaseList2, {\n      window: windowAt('2023-04-24T22:33:11Z')\n    })\n    const wr = df.weekly()\n\n    expect(wr).toBe(1)\n  })\n  it('calculate releases pr week for release this week based on large list', () => {\n    const df = new DeployFrequency(releaseList7, {\n      window: windowAt('2023-05-01T22:33:11Z')\n    })\n    const wr = df.weekly()\n\n    expect(wr).toBe(5)\n  })\n  it('monthly calculate releases pr week for release more than 1 week ago', () => {\n    const df = new DeployFrequency(releaseList2, {\n      window: windowAt('2023-04-24T22:33:11Z')\n    })\n    const mr = df.monthly()\n\n    expect(mr).toBe(2)\n  })\n  it('calculate release rate last month', () => {\n    const df = new DeployFrequency(releaseList2, {\n      window: windowAt('2023-04-24T22:33:11Z')\n    })\n    const rr = df.rate()\n\n    expect(rr).toBe('0.47')\n  })\n  it('calculate release rate last month based on 7 releases list', () => {\n    const df = new DeployFrequency(releaseList7, {\n      window: windowAt('2023-05-14T22:33:11Z')\n    })\n    const rr = df.rate()\n\n    expect(rr).toBe('1.40')\n  })\n  it('calculate release rate next month', () => {\n    const df = new DeployFrequency(releaseList2, {\n      window: windowAt('2023-05-23T22:33:11Z')\n    })\n    const rr = df.rate()\n\n    expect(rr).toBe('0.00')\n  })\n  it('reports a zero rate and an empty log when there are no releases', () => {\n    const df = new DeployFrequency([], {\n      window: windowAt('2023-05-14T22:33:11Z')\n    })\n\n    expect(df.rate()).toBe('0.00')\n    expect(df.weekly()).toBe(0)\n    expect(df.monthly()).toBe(0)\n    expect(df.getLog()).toEqual([])\n  })\n  it('get an empty log of releases', () => {\n    const df = new DeployFrequency(releaseList7, {\n      window: windowAt('2023-05-14T22:33:11Z')\n    })\n\n    expect(df.getLog().length).toBe(0)\n  })\n\n  it('get release log list weekly when rate calculated', () => {\n    const df = new DeployFrequency(releaseList7, {\n      window: windowAt('2023-05-01T22:33:11Z')\n    })\n\n    df.weekly()\n\n    expect(df.getLog().filter(l => l.kind === 'release').length).toBe(5)\n  })\n\n  it('get release log list monthly when rate calculated', () => {\n    const df = new DeployFrequency(releaseList7, {\n      window: windowAt('2023-05-14T22:33:11Z')\n    })\n\n    df.monthly()\n\n    expect(df.getLog().filter(l => l.kind === 'release').length).toBe(6)\n  })\n\n  it('get release log list when rate calculated', () => {\n    const df = new DeployFrequency(releaseList7, {\n      window: windowAt('2023-05-14T22:33:11Z')\n    })\n\n    df.rate()\n\n    expect(df.getLog().filter(l => l.kind === 'release').length).toBe(6)\n  })\n\n  it('log release name and date weekly', () => {\n    const df = new DeployFrequency(releaseList2, {\n      window: windowAt('2023-04-23T22:33:11Z')\n    })\n\n    df.weekly()\n\n    expect(df.getLog()).toEqual([\n      {\n        kind: 'release',\n        repo: 'stenjo/dora',\n        at: '2023-04-22T20:28:29Z',\n        name: 'v0.0.2'\n      }\n    ])\n  })\n\n  it('log release name and date monthly', () => {\n    const df = new DeployFrequency(releaseList2, {\n      window: windowAt('2023-04-23T22:33:11Z')\n    })\n\n    df.monthly()\n\n    expect(df.getLog()).toEqual([\n      {\n        kind: 'release',\n        repo: 'stenjo/dora',\n        at: '2023-04-22T20:28:29Z',\n        name: 'v0.0.2'\n      },\n      {\n        kind: 'release',\n        repo: 'stenjo/dora',\n        at: '2023-04-12T22:33:24Z',\n        name: 'v0.0.1'\n      }\n    ])\n  })\n})\n"},"__tests__/mappers.spec.ts":{"tests":[{"id":"280","name":"repoKey joins owner and repo with a slash, lower-cased"},{"id":"281","name":"repoKey keeps repos whose names are prefixes of each other distinct"},{"id":"282","name":"toRelease maps name and published_at and keys by owner/repo"},{"id":"283","name":"toRelease sanitizes the release name"},{"id":"284","name":"toRelease maps an unpublished draft to epoch 0"},{"id":"285","name":"toPullRequest maps number, title, merge time and base ref"},{"id":"286","name":"toPullRequest does not carry response URLs into the domain object"},{"id":"287","name":"toPullRequest maps an unmerged pull to mergedAt null"},{"id":"288","name":"toPullRequest sanitizes and truncates the title"},{"id":"289","name":"toIssue maps number, title, created/closed times and flattens label names"},{"id":"290","name":"toIssue sanitizes the title"},{"id":"291","name":"toIssue maps an open issue to closedAt null"},{"id":"292","name":"toCommit maps committer date and message"},{"id":"293","name":"toCommit flattens a multi-line commit message to its sanitized single line"},{"id":"294","name":"isoTimestamp renders epoch milliseconds as GitHub-style second-precision ISO"}],"source":"import {\n  repoKey,\n  toCommit,\n  toIssue,\n  toPullRequest,\n  toRelease\n} from '../src/github/mappers'\nimport {isoTimestamp} from '../src/types/Timestamp'\nimport {\n  commitPayload,\n  issuePayload,\n  pullRequestPayload,\n  releasePayload\n} from './helpers/payloads'\n\ndescribe('repoKey', () => {\n  it('joins owner and repo with a slash, lower-cased', () => {\n    expect(repoKey('Stenjo', 'DevOps-Metrics-Action')).toBe(\n      'stenjo/devops-metrics-action'\n    )\n  })\n\n  it('keeps repos whose names are prefixes of each other distinct', () => {\n    expect(repoKey('o', 'api')).not.toBe(repoKey('o', 'api-gateway'))\n    expect(repoKey('o', 'api')).toBe('o/api')\n  })\n})\n\ndescribe('toRelease', () => {\n  it('maps name and published_at and keys by owner/repo', () => {\n    const release = toRelease(\n      'Owner',\n      'Repo',\n      releasePayload({name: 'v2.0.0', published_at: '2023-04-30T17:50:53Z'})\n    )\n\n    expect(release).toEqual({\n      repo: 'owner/repo',\n      name: 'v2.0.0',\n      publishedAt: +new Date('2023-04-30T17:50:53Z')\n    })\n  })\n\n  it('sanitizes the release name', () => {\n    expect(\n      toRelease('o', 'r', releasePayload({name: ' v1\\n`x` ${a} '})).name\n    ).toBe('v1 x {a}')\n    expect(\n      toRelease('o', 'r', releasePayload({name: null as unknown as string}))\n        .name\n    ).toBe('')\n  })\n\n  it('maps an unpublished draft to epoch 0', () => {\n    expect(\n      toRelease('o', 'r', releasePayload({published_at: null})).publishedAt\n    ).toBe(0)\n  })\n})\n\ndescribe('toPullRequest', () => {\n  it('maps number, title, merge time and base ref', () => {\n    const pull = toPullRequest(\n      'o',\n      'r',\n      pullRequestPayload({\n        number: 7,\n        title: 'fix: a',\n        merged_at: '2023-04-28T17:50:53Z',\n        base: {ref: 'develop', repo: {name: 'r'}}\n      })\n    )\n\n    expect(pull).toEqual({\n      repo: 'o/r',\n      number: 7,\n      title: 'fix: a',\n      mergedAt: +new Date('2023-04-28T17:50:53Z'),\n      baseRef: 'develop'\n    })\n  })\n\n  it('does not carry response URLs into the domain object', () => {\n    const payload = {\n      ...pullRequestPayload(),\n      commits_url: 'https://evil.example/repos/o/r/pulls/1/commits'\n    }\n\n    expect(JSON.stringify(toPullRequest('o', 'r', payload))).not.toContain(\n      'evil.example'\n    )\n  })\n\n  it('maps an unmerged pull to mergedAt null', () => {\n    expect(\n      toPullRequest('o', 'r', pullRequestPayload({merged_at: null})).mergedAt\n    ).toBeNull()\n    expect(\n      toPullRequest('o', 'r', pullRequestPayload({merged_at: ''})).mergedAt\n    ).toBeNull()\n  })\n\n  it('sanitizes and truncates the title', () => {\n    const title = `fix:\\t${'a'.repeat(300)}`\n\n    const mapped = toPullRequest('o', 'r', pullRequestPayload({title})).title\n\n    expect(mapped).toHaveLength(200)\n    expect(mapped.startsWith('fix: aaa')).toBe(true)\n    expect(mapped.endsWith('…')).toBe(true)\n  })\n})\n\ndescribe('toIssue', () => {\n  it('maps number, title, created/closed times and flattens label names', () => {\n    const issue = toIssue(\n      'o',\n      'r',\n      issuePayload({\n        number: 42,\n        title: 'bug: it breaks',\n        created_at: '2023-04-22T21:44:06Z',\n        closed_at: '2023-04-23T16:47:40Z',\n        labels: [{name: 'bug'}, {name: 'p1'}] as never\n      })\n    )\n\n    expect(issue).toEqual({\n      repo: 'o/r',\n      number: 42,\n      title: 'bug: it breaks',\n      createdAt: +new Date('2023-04-22T21:44:06Z'),\n      closedAt: +new Date('2023-04-23T16:47:40Z'),\n      labels: ['bug', 'p1']\n    })\n  })\n\n  it('sanitizes the title', () => {\n    expect(\n      toIssue('o', 'r', issuePayload({title: 'bug: `rm`\\n$(x) ${y}'})).title\n    ).toBe('bug: rm (x) {y}')\n  })\n\n  it('maps an open issue to closedAt null', () => {\n    expect(\n      toIssue('o', 'r', issuePayload({closed_at: null})).closedAt\n    ).toBeNull()\n  })\n})\n\ndescribe('toCommit', () => {\n  it('maps committer date and message', () => {\n    expect(toCommit(commitPayload('2023-04-22T20:41:12Z', 'fix: it'))).toEqual({\n      committedAt: +new Date('2023-04-22T20:41:12Z'),\n      message: 'fix: it'\n    })\n  })\n\n  it('flattens a multi-line commit message to its sanitized single line', () => {\n    expect(\n      toCommit(commitPayload('2023-04-22T20:41:12Z', 'fix: it\\n\\nBody `$(x)`'))\n        .message\n    ).toBe('fix: it Body (x)')\n  })\n})\n\ndescribe('isoTimestamp', () => {\n  it('renders epoch milliseconds as GitHub-style second-precision ISO', () => {\n    expect(isoTimestamp(+new Date('2023-04-22T20:28:29Z'))).toBe(\n      '2023-04-22T20:28:29Z'\n    )\n    expect(isoTimestamp(+new Date('2023-04-22T20:28:29.500Z'))).toBe(\n      '2023-04-22T20:28:29Z'\n    )\n  })\n})\n"},"__tests__/CommitsAdapter.spec.ts":{"tests":[{"id":"295","name":"CommitsAdapter should fetch commits through the route template with the correct headers and map them"},{"id":"296","name":"CommitsAdapter should never forward a commits_url from response data"},{"id":"297","name":"CommitsAdapter should handle missing or incorrect headers"},{"id":"298","name":"CommitsAdapter should rethrow API failures as GitHubApiError without swallowing them"},{"id":"299","name":"CommitsAdapter should expose the injected client"},{"id":"300","name":"CommitsAdapter should handle empty API response"}],"source":"import {CommitsAdapter} from '../src/CommitsAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport {toPullRequest} from '../src/github/mappers'\nimport {Octokit} from '@octokit/core'\nimport {commitPayload, pullRequestPayload} from './helpers/payloads'\n\nvi.mock('@octokit/core')\n\nconst route = 'GET /repos/{owner}/{repo}/pulls/{pull_number}/commits'\n\ndescribe('CommitsAdapter', () => {\n  let adapter: CommitsAdapter\n  let mockRequest: Mock\n\n  beforeEach(() => {\n    mockRequest = vi.fn()\n    // A class, not an arrow function: the mock is invoked with `new`.\n    ;(Octokit as unknown as Mock).mockImplementation(\n      class {\n        request = mockRequest\n      }\n    )\n    // eslint-disable-next-line @typescript-eslint/unbound-method\n    vi.mocked(Octokit.plugin).mockReturnValue(Octokit)\n    adapter = new CommitsAdapter(new GitHubClient({token: 'test-token'}))\n  })\n\n  afterEach(() => {\n    vi.clearAllMocks()\n  })\n\n  it('should fetch commits through the route template with the correct headers and map them', async () => {\n    mockRequest.mockResolvedValue({\n      data: [commitPayload('2023-04-22T17:50:53Z', 'fix: it')]\n    })\n\n    const commits = await adapter.getCommits('owner/repo', 42)\n\n    expect(mockRequest).toHaveBeenCalledTimes(1)\n    expect(mockRequest).toHaveBeenCalledWith(route, {\n      owner: 'owner',\n      repo: 'repo',\n      pull_number: 42,\n      headers: {'X-GitHub-Api-Version': '2022-11-28'}\n    })\n    expect(commits).toEqual([\n      {committedAt: +new Date('2023-04-22T17:50:53Z'), message: 'fix: it'}\n    ])\n  })\n\n  it('should never forward a commits_url from response data', async () => {\n    mockRequest.mockResolvedValue({data: []})\n    const pull = toPullRequest('o', 'r', {\n      ...pullRequestPayload({number: 9}),\n      commits_url: 'https://evil.example/repos/o/r/pulls/9/commits'\n    })\n\n    await adapter.getCommits(pull.repo, pull.number)\n\n    expect(mockRequest).toHaveBeenCalledTimes(1)\n    expect(mockRequest.mock.calls[0][0]).toBe(route)\n    expect(JSON.stringify(mockRequest.mock.calls)).not.toContain('evil.example')\n  })\n\n  it('should handle missing or incorrect headers', async () => {\n    mockRequest.mockImplementation((_url, options) => {\n      if (\n        !options.headers ||\n        options.headers['X-GitHub-Api-Version'] !== '2022-11-28'\n      ) {\n        throw new Error('Incorrect headers')\n      }\n      return {\n        data: [commitPayload()]\n      }\n    })\n\n    // Test with missing headers\n    await expect(adapter.getCommits('owner/repo', 1)).resolves.toBeDefined()\n\n    // Test with incorrect headers - the client wraps the error and rethrows it\n    mockRequest.mockClear()\n    mockRequest.mockImplementation(() => {\n      throw new Error('Incorrect headers')\n    })\n    await expect(adapter.getCommits('owner/repo', 1)).rejects.toThrow(\n      `GitHub API request failed (unknown) for ${route}`\n    )\n  })\n\n  it('should rethrow API failures as GitHubApiError without swallowing them', async () => {\n    const cause = Object.assign(new Error('API call failed'), {status: 502})\n    mockRequest.mockRejectedValue(cause)\n\n    const error = await adapter\n      .getCommits('owner/repo', 1)\n      .catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message: `GitHub API request failed (502) for ${route}`,\n      status: 502,\n      route,\n      cause\n    })\n  })\n\n  it('should expose the injected client', () => {\n    const client = new GitHubClient()\n    const adapterWithClient = new CommitsAdapter(client)\n    expect(adapterWithClient.client).toBe(client)\n  })\n\n  it('should handle empty API response', async () => {\n    mockRequest.mockResolvedValue({data: []})\n\n    const commits = await adapter.getCommits('owner/repo', 1)\n\n    expect(commits).toEqual([])\n  })\n})\n"},"__tests__/window-boundaries.spec.ts":{"tests":[{"id":"301","name":"'DeployFrequency' window boundaries ('release publishedAt') includes an event exactly at from"},{"id":"302","name":"'DeployFrequency' window boundaries ('release publishedAt') excludes an event 1 ms before from"},{"id":"303","name":"'DeployFrequency' window boundaries ('release publishedAt') includes an event 1 ms before to"},{"id":"304","name":"'DeployFrequency' window boundaries ('release publishedAt') excludes an event exactly at to"},{"id":"305","name":"'LeadTime' window boundaries ('pull mergedAt') includes an event exactly at from"},{"id":"306","name":"'LeadTime' window boundaries ('pull mergedAt') excludes an event 1 ms before from"},{"id":"307","name":"'LeadTime' window boundaries ('pull mergedAt') includes an event 1 ms before to"},{"id":"308","name":"'LeadTime' window boundaries ('pull mergedAt') excludes an event exactly at to"},{"id":"309","name":"'ChangeFailureRate' window boundaries ('release publishedAt') includes an event exactly at from"},{"id":"310","name":"'ChangeFailureRate' window boundaries ('release publishedAt') excludes an event 1 ms before from"},{"id":"311","name":"'ChangeFailureRate' window boundaries ('release publishedAt') includes an event 1 ms before to"},{"id":"312","name":"'ChangeFailureRate' window boundaries ('release publishedAt') excludes an event exactly at to"},{"id":"313","name":"'MeanTimeToRestore' window boundaries ('bug createdAt') includes an event exactly at from"},{"id":"314","name":"'MeanTimeToRestore' window boundaries ('bug createdAt') excludes an event 1 ms before from"},{"id":"315","name":"'MeanTimeToRestore' window boundaries ('bug createdAt') includes an event 1 ms before to"},{"id":"316","name":"'MeanTimeToRestore' window boundaries ('bug createdAt') excludes an event exactly at to"}],"source":"// Every metric applies the same window predicate (from <"+"= t <"+" to) to the event\n// that selects its records. This table pins that contract for all four.\nimport {DeployFrequency} from '../src/DeployFrequency'\nimport {LeadTime} from '../src/LeadTime'\nimport {ChangeFailureRate} from '../src/ChangeFailureRate'\nimport {MeanTimeToRestore} from '../src/MeanTimeToRestore'\nimport type {MetricsWindow} from '../src/MetricsWindow'\nimport type {ICommitsAdapter} from '../src/interfaces/ICommitsAdapter'\nimport {commit, issue, pull, release, windowAt} from './helpers/domain'\n\nconst REPO = 'o/r'\nconst ONE_DAY = 24 * 60 * 60 * 1000\nconst WINDOW = windowAt('2024-03-01T12:00:00Z')\n\nconst iso = (ms: number): string => new Date(ms).toISOString()\n\nconst commits: ICommitsAdapter = {\n  getCommits: async () => Promise.resolve([commit(iso(WINDOW.fetchFrom))])\n}\n\n// Each entry builds the metric with its selecting event at `at` and returns\n// how many records that event produced (1 = included, 0 = excluded).\nconst metrics: {\n  name: string\n  event: string\n  count: (window: MetricsWindow, at: number) => Promise<"+"number>\n}[] = [\n  {\n    name: 'DeployFrequency',\n    event: 'release publishedAt',\n    count: async (window, at) =>\n      Promise.resolve(\n        new DeployFrequency([release(iso(at), REPO)], {window}).monthly()\n      )\n  },\n  {\n    name: 'LeadTime',\n    event: 'pull mergedAt',\n    count: async (window, at) => {\n      const lt = new LeadTime(\n        [pull({repo: REPO, mergedAt: at})],\n        [release(iso(at + ONE_DAY), REPO)],\n        commits,\n        {window}\n      )\n      await lt.getLeadTime()\n      return lt.getLog().length\n    }\n  },\n  {\n    name: 'ChangeFailureRate',\n    event: 'release publishedAt',\n    count: async (window, at) =>\n      Promise.resolve(\n        new ChangeFailureRate(\n          [issue({repo: REPO, createdAt: at + 1, closedAt: null})],\n          [release(iso(at), REPO)],\n          {window}\n        ).releases.length\n      )\n  },\n  {\n    name: 'MeanTimeToRestore',\n    event: 'bug createdAt',\n    count: async (window, at) =>\n      Promise.resolve(\n        new MeanTimeToRestore(\n          [issue({repo: REPO, createdAt: at, closedAt: at + 1})],\n          [release(iso(at - 1), REPO), release(iso(at + 2), REPO)],\n          {window}\n        ).getBugCount().length\n      )\n  }\n]\n\ndescribe.each(metrics)('$name window boundaries ($event)', ({count}) => {\n  it('includes an event exactly at from', async () => {\n    expect(await count(WINDOW, WINDOW.from)).toBe(1)\n  })\n\n  it('excludes an event 1 ms before from', async () => {\n    expect(await count(WINDOW, WINDOW.from - 1)).toBe(0)\n  })\n\n  it('includes an event 1 ms before to', async () => {\n    expect(await count(WINDOW, WINDOW.to - 1)).toBe(1)\n  })\n\n  it('excludes an event exactly at to', async () => {\n    expect(await count(WINDOW, WINDOW.to)).toBe(0)\n  })\n})\n"},"__tests__/CommitsAdapter.test.ts":{"tests":[{"id":"317","name":"Commit Adapter should ice breaker"},{"id":"318","name":"Commit Adapter should return unpaged values"},{"id":"319","name":"Commit Adapter should throw a GitHubApiError on access denied"}],"source":"import {http, HttpResponse} from 'msw'\nimport {setupServer} from 'msw/node'\nimport {CommitsAdapter} from '../src/CommitsAdapter'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport fs from 'node:fs'\nimport type {Commit} from '../src/types/Commit'\nimport type {GitHubCommitPayload} from '../src/github/payloads'\n\nconst commitsUrl =\n  'https://api.github.com/repos/stenjo/devops-metrics-action/pulls/69/commits'\nconst route = 'GET /repos/{owner}/{repo}/pulls/{pull_number}/commits'\nconst requested: string[] = []\nconst server = setupServer(\n  http.get(commitsUrl, ({request}) => {\n    requested.push(request.url)\n    const commits = JSON.parse(\n      fs.readFileSync('./__tests__/test-data/commits.json').toString()\n    ) as GitHubCommitPayload[]\n    return HttpResponse.json(commits)\n  })\n)\ndescribe('Commit Adapter should', () => {\n  beforeAll(() => server.listen())\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n    requested.length = 0\n  })\n\n  afterAll(() => server.close())\n\n  it('ice breaker', () => {\n    expect(true).toBe(true)\n  })\n\n  it('return unpaged values', async () => {\n    const r = new CommitsAdapter(new GitHubClient())\n\n    const commits: Commit[] = await r.getCommits(\n      'stenjo/devops-metrics-action',\n      69\n    )\n\n    expect(requested).toEqual([commitsUrl])\n    expect(commits.length).toBe(30)\n    expect(commits[0]).toEqual({\n      committedAt: +new Date('2023-04-22T20:41:12Z'),\n      message: 'fix: clean up'\n    })\n  })\n\n  it('throw a GitHubApiError on access denied', async () => {\n    server.use(\n      http.get(\n        commitsUrl,\n        () => new HttpResponse('Bad credentials', {status: 401})\n      )\n    )\n    const r = new CommitsAdapter(new GitHubClient())\n\n    const error = await r\n      .getCommits('stenjo/devops-metrics-action', 69)\n      .catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect(error).toMatchObject({\n      message: `GitHub API request failed (401) for ${route}`,\n      status: 401\n    })\n  })\n})\n"},"__tests__/sanitize.spec.ts":{"tests":[{"id":"320","name":"sanitizeText leaves ordinary titles untouched"},{"id":"321","name":"sanitizeText removes backticks and ${ / $( openers from an injection payload"},{"id":"322","name":"sanitizeText keeps a lone dollar sign that opens nothing"},{"id":"323","name":"sanitizeText replaces control characters and newlines with a single space"},{"id":"324","name":"sanitizeText collapses runs of whitespace and trims the ends"},{"id":"325","name":"sanitizeText maps null and undefined to an empty string"},{"id":"326","name":"sanitizeText truncates to the cap with a trailing ellipsis"},{"id":"327","name":"sanitizeText does not truncate text exactly at the cap"},{"id":"328","name":"sanitizeText truncates after sanitizing, so the cap applies to the cleaned text"},{"id":"329","name":"sanitizeText honours a custom cap"}],"source":"import {MAX_TEXT_LENGTH, sanitizeText} from '../src/sanitize'\n\nconst ELLIPSIS = '\\u2026'\nconst INJECTION = '`id` ${{ github.token }} $(rm -rf /)'\n\ndescribe('sanitizeText', () => {\n  it('leaves ordinary titles untouched', () => {\n    expect(sanitizeText('feat(scope): add thing #12')).toBe(\n      'feat(scope): add thing #12'\n    )\n  })\n\n  it('removes backticks and ${ / $( openers from an injection payload', () => {\n    const out = sanitizeText(INJECTION)\n\n    expect(out).toBe('id {{ github.token }} (rm -rf /)')\n    expect(out).not.toMatch(/[`\\n]|\\$\\{|\\$\\(/)\n  })\n\n  it('keeps a lone dollar sign that opens nothing', () => {\n    expect(sanitizeText('costs $5 and ${')).toBe('costs $5 and {')\n  })\n\n  it('replaces control characters and newlines with a single space', () => {\n    expect(sanitizeText('a\\r\\nb\\tc\\u0000d\\u001be\\u2028f')).toBe('a b c d e f')\n  })\n\n  it('collapses runs of whitespace and trims the ends', () => {\n    expect(sanitizeText('  fix:   many    spaces \\n ')).toBe('fix: many spaces')\n  })\n\n  it('maps null and undefined to an empty string', () => {\n    expect(sanitizeText(null)).toBe('')\n    expect(sanitizeText(undefined)).toBe('')\n  })\n\n  it('truncates to the cap with a trailing ellipsis', () => {\n    const long = 'x'.repeat(MAX_TEXT_LENGTH + 50)\n\n    const out = sanitizeText(long)\n\n    expect(out).toHaveLength(MAX_TEXT_LENGTH)\n    expect(out.endsWith(ELLIPSIS)).toBe(true)\n    expect(out.slice(0, -1)).toBe('x'.repeat(MAX_TEXT_LENGTH - 1))\n  })\n\n  it('does not truncate text exactly at the cap', () => {\n    const exact = 'y'.repeat(MAX_TEXT_LENGTH)\n\n    expect(sanitizeText(exact)).toBe(exact)\n  })\n\n  it('truncates after sanitizing, so the cap applies to the cleaned text', () => {\n    const padded = `${'z'.repeat(10)}${'\\n'.repeat(500)}${'z'.repeat(10)}`\n\n    expect(sanitizeText(padded)).toBe(`${'z'.repeat(10)} ${'z'.repeat(10)}`)\n  })\n\n  it('honours a custom cap', () => {\n    expect(sanitizeText('abcdefgh', 5)).toBe(`abcd${ELLIPSIS}`)\n  })\n})\n"},"__tests__/run.failure.spec.ts":{"tests":[{"id":"330","name":"run() with a failing GitHub API aborts with a stable message and sets no outputs when the second repo returns 403"}],"source":"import {Octokit} from '@octokit/core'\nimport {GitHubClient, GitHubApiError} from '../src/GitHubClient'\nimport {run} from '../src/main'\nimport type {Inputs} from '../src/main'\nimport {releasePayload} from './helpers/payloads'\n\nvi.mock('@octokit/core')\n\n// End-to-end through the real adapters: a failure on the second repo must\n// surface as a GitHubApiError before any output is written.\ndescribe('run() with a failing GitHub API', () => {\n  const inputs: Inputs = {\n    owner: 'o',\n    repositories: ['repo1', 'repo2'],\n    token: 't',\n    logging: false,\n    filtered: false,\n    bugLabel: 'bug'\n  }\n\n  it('aborts with a stable message and sets no outputs when the second repo returns 403', async () => {\n    const forbidden = Object.assign(\n      new Error('Forbidden: https://api.github.com/repos/o/repo2/releases'),\n      {status: 403}\n    )\n    const request = vi.fn(async (_route: string, params: {repo?: string}) =>\n      params.repo === 'repo2'\n        ? Promise.reject(forbidden)\n        : Promise.resolve({data: [releasePayload({id: 1})]})\n    )\n    ;(Octokit as unknown as Mock).mockImplementation(function () {\n      return {request}\n    })\n    // eslint-disable-next-line @typescript-eslint/unbound-method\n    vi.mocked(Octokit.plugin).mockReturnValue(Octokit)\n    const core = {info: vi.fn(), warning: vi.fn(), setOutput: vi.fn()}\n\n    const error = await run({\n      inputs,\n      client: new GitHubClient({token: 't'}),\n      core\n    }).catch((e: unknown) => e)\n\n    expect(error).toBeInstanceOf(GitHubApiError)\n    expect((error as GitHubApiError).message).toBe(\n      'GitHub API request failed (403) for GET /repos/{owner}/{repo}/releases'\n    )\n    expect((error as GitHubApiError).message).not.toContain('Forbidden')\n    expect((error as GitHubApiError).cause).toBe(forbidden)\n    expect(core.setOutput).not.toHaveBeenCalled()\n    expect(request.mock.calls.map(c => c[1].repo)).toEqual(['repo1', 'repo2'])\n  })\n})\n"},"__tests__/issues.test.ts":{"tests":[{"id":"331","name":"mocked Issues API should return issues mapped to the domain type"}],"source":"import fs from 'node:fs'\nimport {windowAt} from './helpers/domain'\nimport {IssuesAdapter} from '../src/IssuesAdapter'\nimport {GitHubClient} from '../src/GitHubClient'\nimport type {GitHubIssuePayload} from '../src/github/payloads'\nimport * as dotenv from 'dotenv'\n\ndotenv.config()\n\ndescribe.skipIf(!process.env.GH_TOKEN)('Real Issues API should', () => {\n  const issueAdapter = new IssuesAdapter(\n    new GitHubClient({token: process.env.GH_TOKEN}),\n    'stenjo',\n    ['dora'],\n    windowAt()\n  )\n\n  test('fetch issues', async () => {\n    const il = await issueAdapter.GetAllIssuesLastMonth()\n    expect(il?.length).toBeGreaterThan(10)\n  })\n})\n\ndescribe('mocked Issues API should', () => {\n  test('return issues mapped to the domain type', async () => {\n    const issueAdapter = new IssuesAdapter(\n      new GitHubClient(),\n      'stenjo',\n      ['devops-metrics-action'],\n      windowAt()\n    )\n    mockedGetIssuesReturns('./__tests__/test-data/issue-list.json')\n\n    const il = await issueAdapter.GetAllIssuesLastMonth()\n    expect(il?.length).toBe(30)\n    expect(il?.[0]).toEqual({\n      repo: 'stenjo/devops-metrics-action',\n      number: 33,\n      title: 'chore(main): release 0.3.1-beta',\n      createdAt: +new Date('2023-04-30T17:28:48Z'),\n      closedAt: +new Date('2023-04-30T17:29:33Z'),\n      labels: ['autorelease: tagged']\n    })\n  })\n})\n\nfunction mockedGetIssuesReturns(file: string): void {\n  vi.spyOn(GitHubClient.prototype, 'paginate').mockImplementation(\n    async (): Promise<"+"GitHubIssuePayload[]> =>\n      JSON.parse(fs.readFileSync(file).toString()) as GitHubIssuePayload[]\n  )\n}\n"},"__tests__/MetricsWindow.spec.ts":{"tests":[{"id":"332","name":"metricsWindow spans the 30 days ending at now"},{"id":"333","name":"metricsWindow fetches a further 30 days back by default"},{"id":"334","name":"metricsWindow honours an explicit look-back"},{"id":"335","name":"inWindow is from <"+"= at <"+" to"}],"source":"import {\n  defaultLookBackDays,\n  inWindow,\n  metricWindowDays,\n  metricsWindow\n} from '../src/MetricsWindow'\n\nconst ONE_DAY = 24 * 60 * 60 * 1000\nconst NOW = new Date('2024-03-01T12:00:00Z')\n\ndescribe('metricsWindow', () => {\n  it('spans the 30 days ending at now', () => {\n    const w = metricsWindow(NOW)\n\n    expect(metricWindowDays()).toBe(30)\n    expect(w.now).toBe(+NOW)\n    expect(w.to).toBe(+NOW)\n    expect(w.from).toBe(+new Date('2024-01-31T12:00:00Z'))\n    expect(w.to - w.from).toBe(30 * ONE_DAY)\n  })\n\n  it('fetches a further 30 days back by default', () => {\n    const w = metricsWindow(NOW)\n\n    expect(defaultLookBackDays()).toBe(30)\n    expect(w.fetchFrom).toBe(+new Date('2024-01-01T12:00:00Z'))\n    expect(w.from - w.fetchFrom).toBe(30 * ONE_DAY)\n  })\n\n  it('honours an explicit look-back', () => {\n    const w = metricsWindow(NOW, 10)\n\n    expect(w.fetchFrom).toBe(w.from - 10 * ONE_DAY)\n    expect(w.from).toBe(metricsWindow(NOW).from)\n  })\n})\n\ndescribe('inWindow', () => {\n  const w = metricsWindow(NOW)\n\n  it('is from <"+"= at <"+" to', () => {\n    expect(inWindow(w, w.from - 1)).toBe(false)\n    expect(inWindow(w, w.from)).toBe(true)\n    expect(inWindow(w, w.from + 1)).toBe(true)\n    expect(inWindow(w, w.to - 1)).toBe(true)\n    expect(inWindow(w, w.to)).toBe(false)\n    expect(inWindow(w, w.to + 1)).toBe(false)\n  })\n})\n"},"__tests__/releases.test.ts":{"tests":[{"id":"336","name":"Mocked Release API should return releases mapped to the domain type"}],"source":"import {ReleaseAdapter} from '../src/ReleaseAdapter'\nimport {GitHubClient} from '../src/GitHubClient'\nimport type {Release} from '../src/types/Release'\nimport type {GitHubReleasePayload} from '../src/github/payloads'\nimport fs from 'node:fs'\nimport {windowAt} from './helpers/domain'\n\ndescribe('Mocked Release API should', () => {\n  it('return releases mapped to the domain type', async () => {\n    const r = new ReleaseAdapter(\n      new GitHubClient(),\n      'TestOwner',\n      ['Project1'],\n      windowAt()\n    )\n    mockedGetReleasesReturns('./__tests__/test-data/releases.json')\n\n    const releases: Release[] = await r.GetAllReleasesLastMonth()\n\n    expect(releases.length).toBe(7)\n    expect(releases[0]).toEqual({\n      repo: 'testowner/project1',\n      name: 'v0.3.1-beta',\n      publishedAt: +new Date('2023-04-30T17:29:44Z')\n    })\n    expect(releases.reverse()[0].name).toBe('v0.0.1')\n  })\n})\n\nfunction mockedGetReleasesReturns(file: string): void {\n  vi.spyOn(GitHubClient.prototype, 'paginate').mockImplementation(\n    async (): Promise<"+"GitHubReleasePayload[]> =>\n      JSON.parse(fs.readFileSync(file).toString()) as GitHubReleasePayload[]\n  )\n}\n"},"__tests__/PullRequests.test.ts":{"tests":[{"id":"337","name":"PullRequestsAdapter should"}],"source":"import type {GitHubPullRequestPayload} from '../src/github/payloads'\nimport {PullRequestsAdapter} from '../src/PullRequestsAdapter'\nimport {GitHubClient} from '../src/GitHubClient'\nimport fs from 'node:fs'\nimport {windowAt} from './helpers/domain'\n\ntest('PullRequestsAdapter should', async () => {\n  const client = new GitHubClient()\n  const pullRequests = new PullRequestsAdapter(\n    client,\n    'stenjo',\n    ['dora'],\n    windowAt('2023-05-20T00:00:00Z')\n  )\n  vi.spyOn(client, 'request').mockImplementation(\n    async (_route, params): Promise<"+"GitHubPullRequestPayload[]> => {\n      const page = params?.page as number\n      const pulls = JSON.parse(\n        fs.readFileSync('./__tests__/test-data/pulls.json').toString()\n      ) as GitHubPullRequestPayload[]\n\n      return pulls.slice((page - 1) * 100, (page - 1) * 100 + 100)\n    }\n  )\n  const pr = await pullRequests.GetAllPRsLastMonth()\n\n  expect(pr.length).toBe(2)\n  expect(pr[1]).toEqual({\n    repo: 'stenjo/dora',\n    number: 69,\n    title: 'feat: handle several repos',\n    mergedAt: null,\n    baseRef: 'main'\n  })\n})\n"},"__tests__/Commits.test.ts":{"tests":[{"id":"338","name":"fetches commits"},{"id":"339","name":"CommitsAdapter should"}],"source":"import {CommitsAdapter} from '../src/CommitsAdapter'\nimport {GitHubClient} from '../src/GitHubClient'\nimport type {GitHubCommitPayload} from '../src/github/payloads'\nimport fs from 'node:fs'\nimport * as dotenv from 'dotenv'\n\ndotenv.config()\n\ntest('fetches commits', async () => {\n  const client = new GitHubClient({token: process.env.GH_TOKEN})\n  const adapter = new CommitsAdapter(client)\n  vi.spyOn(client, 'request').mockImplementation(\n    async (): Promise<"+"GitHubCommitPayload[]> =>\n      JSON.parse(\n        fs.readFileSync('./__tests__/test-data/commits.json').toString()\n      ) as GitHubCommitPayload[]\n  )\n\n  const cl = await adapter.getCommits('stenjo/devops-metrics-action', 10)\n\n  expect(cl.length).toBeGreaterThan(-1)\n  expect(cl.length).toBe(30)\n})\n\ntest('CommitsAdapter should', async () => {\n  const ca = new CommitsAdapter(new GitHubClient({token: process.env.GH_TOKEN}))\n\n  const result = await ca.getCommits('stenjo/devops-metrics-action', 69)\n\n  expect(result).not.toBe(undefined)\n  expect(result.length).toBeGreaterThan(7)\n})\n"},"__tests__/window.spec.ts":{"tests":[{"id":"340","name":"isBeforeWindow is true only for timestamps strictly before the window start"},{"id":"341","name":"isBeforeWindow never stops on a missing timestamp"}],"source":"import {isBeforeWindow} from '../src/github/window'\n\ndescribe('isBeforeWindow', () => {\n  const windowStart = +new Date('2023-12-31T12:00:00Z')\n\n  it('is true only for timestamps strictly before the window start', () => {\n    expect(isBeforeWindow(windowStart, '2023-12-31T11:59:59Z')).toBe(true)\n    expect(isBeforeWindow(windowStart, '2023-12-31T12:00:00Z')).toBe(false)\n    expect(isBeforeWindow(windowStart, '2024-01-01T00:00:00Z')).toBe(false)\n  })\n\n  it('never stops on a missing timestamp', () => {\n    expect(isBeforeWindow(windowStart, null)).toBe(false)\n  })\n})\n"}},"projectRoot":"/home/runner/work/devops-metrics-action/devops-metrics-action","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","_comment":"This config was generated using 'stryker init'. Please take a look at: https://stryker-mutator.io/docs/stryker-js/configuration/ for more information.","packageManager":"npm","reporters":["html","clear-text","json"],"testRunner":"vitest","testRunner_comment":"Take a look at https://stryker-mutator.io/docs/stryker-js/vitest-runner for information about the vitest plugin.","coverageAnalysis":"perTest","checkers":["typescript"],"tsconfigFile":"tsconfig.json","typescriptChecker":{"prioritizePerformanceOverAccuracy":true,"experimentalNativePreview":false},"ignoreStatic":true,"thresholds":{"high":95,"low":90,"break":90},"ignorePatterns":["**/node_modules/**"
