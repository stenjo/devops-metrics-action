equest\n  release: Release\n}\n\nexport interface LeadTimeLimits {\n  // Pull requests whose commits are fetched; the rest are dropped with a warning.\n  maxCommitFetches: number\n  // Commit requests in flight at once.\n  concurrency: number\n}\n\n// A function rather than constants so the values are not static mutants for Stryker.\nexport function defaultLeadTimeLimits(): LeadTimeLimits {\n  return {maxCommitFetches: 200, concurrency: 4}\n}\n\nexport interface LeadTimeOptions extends MetricOptions {\n  logger?: Pick<"+"Logger, 'warning'>\n  limits?: LeadTimeLimits\n}\n\n// Runs `fn` over `items` with at most `limit` calls in flight; results keep item order.\nasync function mapWithConcurrency<"+"T, R>(\n  items: readonly T[],\n  limit: number,\n  fn: (item: T) => Promise<"+"R>\n): Promise<"+"R[]> {\n  const results: R[] = []\n  let next = 0\n  const worker = async (): Promise<"+"void> => {\n    while (next <"+" items.length) {\n      const index = next++\n      results[index] = await fn(items[index])\n    }\n  }\n  await Promise.all(Array.from({length: limit}, worker))\n  return results\n}\n\nconst ONE_DAY = 24 * 60 * 60 * 1000\nexport class LeadTime {\n  log: PullLogEntry[] = []\n  pulls: MergedPullRequest[]\n  releases: Release[]\n  commitsAdapter: ICommitsAdapter\n  private readonly logger: Pick<"+"Logger, 'warning'>\n  private readonly limits: LeadTimeLimits\n\n  constructor(\n    pulls: PullRequest[],\n    releases: Release[],\n    commitsAdapter: ICommitsAdapter,\n    options: LeadTimeOptions\n  ) {\n    const {window} = options\n    this.pulls = pulls.filter(\n      (p): p is MergedPullRequest =>\n        p.mergedAt !== null && inWindow(window, p.mergedAt)\n    )\n    this.releases = releases\n    this.commitsAdapter = commitsAdapter\n    this.logger = options.logger ?? {warning: () => undefined}\n    this.limits = options.limits ?? defaultLeadTimeLimits()\n  }\n\n  getLog(): PullLogEntry[] {\n    return this.log\n  }\n\n  private candidates(filtered: boolean): Candidate[] {\n    const candidates: Candidate[] = []\n    for (const pull of this.pulls) {\n      if (pull.baseRef !== 'main') {\n        continue\n      }\n      if (\n        filtered &&\n        !(pull.title.startsWith('feat') || pull.title.startsWith('fix'))\n      ) {\n        continue\n      }\n      const release = this.releases.find(\n        r => r.publishedAt > pull.mergedAt && r.repo === pull.repo\n      )\n      if (release === undefined) {\n        continue\n      }\n      candidates.push({pull, release})\n    }\n    return candidates\n  }\n\n  async getLeadTime(filtered = false): Promise<"+"number> {\n    const candidates = this.candidates(filtered)\n    const sampled = candidates.slice(0, this.limits.maxCommitFetches)\n    if (sampled.length <"+" candidates.length) {\n      this.logger.warning(\n        `Lead time: fetching commits for only the first ${sampled.length.toString()} of ${candidates.length.toString()} qualifying pull requests`\n      )\n    }\n\n    const commitLists = await mapWithConcurrency(\n      sampled,\n      this.limits.concurrency,\n      async ({pull}) => this.commitsAdapter.getCommits(pull.repo, pull.number)\n    )\n\n    const leadTimes: number[] = []\n    for (const [index, {pull, release}] of sampled.entries()) {\n      const deployTime = release.publishedAt\n      const firstCommit = commitLists[index].sort(\n        (a, b) => a.committedAt - b.committedAt\n      )[0]\n\n      const leadTime = (deployTime - firstCommit.committedAt) / ONE_DAY\n      leadTimes.push(leadTime)\n      this.log.push({\n        kind: 'pull',\n        repo: pull.repo,\n        at: isoTimestamp(pull.mergedAt),\n        title: pull.title,\n        commitAt: isoTimestamp(firstCommit.committedAt),\n        commitMessage: firstCommit.message,\n        releaseAt: isoTimestamp(deployTime),\n        release: release.name,\n        leadTimeDays: Math.round(leadTime * 100) / 100\n      })\n    }\n    if (leadTimes.length === 0) {\n      return 0\n    }\ h(issue)\n      }\n    }\n    return bugs\n  }\n\n  hasPreviousRelease(date: number, repo: RepoKey): boolean {\n    return this.releases.some(r => r.publishedAt <"+" date && r.repo === repo)\n  }\n\n  getReleaseBefore(date: number, repo: RepoKey): Release {\n    const releases = this.releases.filter(\n      r => r.publishedAt <"+" date && r.repo === repo\n    )\n\n    if (releases.length === 0) {\n      throw new Error('No previous releases')\n    }\n\n    return releases.pop() as Release\n  }\n\n  getReleaseAfter(date: number, repo: RepoKey): Release {\n    const releases = this.releases.filter(\n      r => r.publishedAt > date && r.repo === repo\n    )\n\n    if (releases.length === 0) {\n      throw new Error('No later releases')\n    }\n\n    return releases[0]\n  }\n\n  hasLaterRelease(date: number, repo: RepoKey): boolean {\n    return this.releases.some(r => r.publishedAt > date && r.repo === repo)\n  }\n\n  private getRestoreWindow(bug: BugTime): {before: Release; after: Release} {\n    return {\n      before: this.getReleaseBefore(bug.start, bug.repo),\n      after: this.getReleaseAfter(bug.end, bug.repo)\n    }\n  }\n\n  getRestoreTime(bug: BugTime): number {\n    const {before, after} = this.getRestoreWindow(bug)\n\n    return after.publishedAt - before.publishedAt\n  }\n\n  getLog(): RestoreLogEntry[] {\n    return this.log\n  }\n\n  mttr(): number {\n    const bugs = this.getBugCount()\n    if (bugs.length === 0) {\n      return 0\n    }\n\n    let sum = 0\n    for (const bug of bugs) {\n      const {before, after} = this.getRestoreWindow(bug)\n      const restoreTime = after.publishedAt - before.publishedAt\n      sum += restoreTime\n      this.log.push({\n        kind: 'restore',\n        repo: bug.issue.repo,\n        number: bug.issue.number,\n        title: bug.issue.title,\n        createdAt: isoTimestamp(bug.start),\n        closedAt: isoTimestamp(bug.end),\n        releaseBefore: before.name,\n        releaseBeforeAt: isoTimestamp(before.publishedAt),\n        releaseAfter: after.name,\n        releaseAfterAt: isoTimestamp(after.publishedAt),\n        restoreDays: Math.round((restoreTime / ONE_DAY) * 100) / 100\n      })\n    }\n\n    return Math.round((sum / bugs.length / ONE_DAY) * 100) / 100 // Two decimals\n  }\n}\n"},"src/DeployFrequency.ts":{"language":"typescript","mutants":[{"id":"88","mutatorName":"ArithmeticOperator","replacement":"1000 * 60 / 60","status":"Survived","static":true,"testsCompleted":5,"coveredBy":["247","248","249","250","251"],"location":{"end":{"column":31,"line":8},"start":{"column":17,"line":8}}},{"id":"87","mutatorName":"ArithmeticOperator","replacement":"1000 * 60 * 60 / 24","status":"Survived","static":true,"testsCompleted":5,"coveredBy":["247","248","249","250","251"],"location":{"end":{"column":36,"line":8},"start":{"column":17,"line":8}}},{"id":"90","mutatorName":"ArrayDeclaration","replacement":"[\"Stryker was here\"]","statusReason":"src/DeployFrequency.ts(11,29): error TS2322: Type 'string' is not assignable to type 'ReleaseLogEntry'.\n","status":"CompileError","static":false,"coveredBy":["239","266","267","268","269","270","271","272","273","274","275","276","277","278","279","301","302","303","304"],"location":{"end":{"column":30,"line":11},"start":{"column":28,"line":11}}},{"id":"89","mutatorName":"ArithmeticOperator","replacement":"1000 / 60","status":"Survived","static":true,"testsCompleted":5,"coveredBy":["247","248","249","250","251"],"location":{"end":{"column":26,"line":8},"start":{"column":17,"line":8}}},{"id":"91","mutatorName":"BlockStatement","replacement":"{}","statusReason":"src/DeployFrequency.ts(15,13): error TS2355: A function whose declared type is neither 'undefined', 'void', nor 'any' must return a value.\n","status":"CompileError","static":false,"coveredBy":["239","273","274","275","276","277","278","279"],"location":{"end":{"column":4,"line":17},"start":{"column":31,"line":15}}},{"id":"92","mutatorName":"BlockStatement","replacement":"{}","status tringLiteral","replacement":"\"\"","statusReason":"expected \"vi.fn()\" to be called once with arguments: [ Array(1) ]\u001b[90m\n\nReceived:\n\n\u001b[1m  1st vi.fn() call:\n\n\u001b[22m\u001b[2m  [\u001b[22m\n\u001b[32m-   \"GitHub API rate limit remaining: unknown\",\u001b[90m\n\u001b[31m+   \"GitHub API rate limit remaining: \",\u001b[90m\n\u001b[2m  ]\u001b[22m\n\u001b[39m\u001b[90m\n\nNumber of calls: \u001b[1m1\u001b[22m\n\u001b[39m","status":"Killed","static":false,"testsCompleted":14,"killedBy":["84"],"coveredBy":["66","67","68","69","70","71","72","73","74","79","80","81","82","84"],"location":{"end":{"column":91,"line":283},"start":{"column":82,"line":283}}}],"source":"import type * as core from '@actions/core'\nimport type {GitHubClient} from './GitHubClient'\nimport {ReleaseAdapter} from './ReleaseAdapter'\nimport {DeployFrequency} from './DeployFrequency'\nimport {ChangeFailureRate} from './ChangeFailureRate'\nimport {IssuesAdapter} from './IssuesAdapter'\nimport {MeanTimeToRestore} from './MeanTimeToRestore'\nimport {PullRequestsAdapter} from './PullRequestsAdapter'\nimport {CommitsAdapter} from './CommitsAdapter'\nimport {LeadTime} from './LeadTime'\nimport {serializeLog} from './log'\nimport {metricsWindow} from './MetricsWindow'\nimport type {Release} from './types/Release'\nimport type {PullRequest} from './types/PullRequest'\n\nexport interface Inputs {\n  owner: string\n  repositories: string[]\n  token: string\n  logging: boolean\n  filtered: boolean\n  bugLabel: string\n}\n\nexport type MetricName =\n  'deploy-rate' | 'lead-time' | 'change-failure-rate' | 'mttr'\n\n// 'no-data' means the metric was defaulted to 0 because there was nothing to compute from.\nexport type MetricStatus = 'computed' | 'no-data'\n\nexport type MetricsStatus = Record<"+"MetricName, MetricStatus>\n\nexport interface Outputs {\n  'deploy-rate': string\n  'deploy-rate-log'?: string\n  'lead-time': number\n  'lead-time-log'?: string\n  'change-failure-rate': number\n  'change-failure-rate-log'?: string\n  mttr: number\n  'mttr-log'?: string\n  'metrics-status': string\n}\n\nexport type ActionsCore = Pick<"+"\n  typeof core,\n  'getInput' | 'info' | 'warning' | 'setOutput' | 'setSecret'\n>\n\nexport const TOKEN_REQUIRED_MESSAGE =\n  'A GitHub token is required: set the `token` input or the GH_TOKEN environment variable'\n\n// Every repository costs up to three paginated listings plus one request per\n// qualifying pull request, so a run is bounded here before any call is made.\nexport function maxRepositories(): number {\n  return 25\n}\n\n// GitHub owner and repository names: letters, digits, '_', '.', '-'; 1–100 chars.\nfunction validateName(kind: 'owner' | 'repo', value: string): string {\n  if (!/^[A-Za-z0-9_.-]{1,100}$/.test(value) || value.includes('..')) {\n    throw new Error(\n      `Invalid ${kind} ${JSON.stringify(value)}: GitHub names may only contain letters, digits, \"_\", \".\" and \"-\" (1-100 characters) and must not contain \"..\"`\n    )\n  }\n  return value\n}\n\n// Accepts `name` or `owner/name`; the owner part must agree with the owner input.\nfunction parseRepoEntry(entry: string, owner: string): string {\n  const parts = entry.split('/')\n  if (parts.length > 2) {\n    throw new Error(\n      `Invalid repo ${JSON.stringify(entry)}: expected \"name\" or \"owner/name\"`\n    )\n  }\n  if (parts.length === 2) {\n    const entryOwner = validateName('owner', parts[0])\n    if (entryOwner.toLowerCase() !== owner.toLowerCase()) {\n      throw new Error(\n        `Repo ${JSON.stringify(entry)} names owner ${JSON.stringify(entryOwner)} but the owner input is ${JSON.stringify(owner)}`\n      )\n    }\n  }\n  return validateName('repo', parts[parts.length - 1])\n}\n\nfunction parseBugLabel(value: string): string {\n  const label = value.trim()\n  if (label === '') {\n    return 'bug'\n  }\n  if (label.length > 50) {\n    throw new Error(\n      `Invalid bug-label ${JSON.stringify(label)}: must be at most 50 characters`\n    )\n  }\n  return label\n}\n\n// Only the literal 'true' enables a flag; anything else is off, loudly if unrecognised.\nfunction parseFlag(\n  core: Pick<"+"ActionsCore, 'getInput' | 'warning'>,\n  name: string\n): boolean {\n  const value = core.getInput(name)\n  if (value === 'true') {\n    return true\n  }\n  if (value !== '' && value !== 'false') {\n    core.warning(\n      `Unrecognised value ${JSON.stringify(value)} for input '${name}': expected 'true' or 'false', treating it as false`\n    )\n  }\n  return false\n}\n\nexport interface RepoContext {\n  owner: string\n  repo: string\n}\n\n// `github.context.repo` is a getter that throws outside Actions, so it must stay lazy.\nexport interface ActionsContext {\n  readonly repo: RepoContext\n}\n\nexport interface RunDeps {\n  inputs: Inputs\n  client: GitHubClient\n  core: Pick<"+"ActionsCore, 'info' | 'warning' | 'setOutput'>\n}\n\nfunction noDataReason(\n  metric: MetricName,\n  releases: Release[],\n  pulls: PullRequest[]\n): string | undefined {\n  if (releases.length === 0) {\n    return 'no releases in the window'\n  }\n  if (metric === 'lead-time' && pulls.length === 0) {\n    return 'no pull requests in the window'\n  }\n  return undefined\n}\n\n// Reports which metrics have data to compute from, warning once per metric that has none.\nexport function metricsStatus(\n  releases: Release[],\n  pulls: PullRequest[],\n  core: Pick<"+"ActionsCore, 'warning'>\n): MetricsStatus {\n  const check = (metric: MetricName): MetricStatus => {\n    const reason = noDataReason(metric, releases, pulls)\n    if (reason === undefined) {\n      return 'computed'\n    }\n    core.warning(`${metric} defaulted to 0: ${reason}`)\n    return 'no-data'\n  }\n  return {\n    'deploy-rate': check('deploy-rate'),\n    'lead-time': check('lead-time'),\n    'change-failure-rate': check('change-failure-rate'),\n    mttr: check('mttr')\n  }\n}\n\nexport function parseInputs(\n  core: Pick<"+"ActionsCore, 'getInput' | 'info' | 'warning' | 'setSecret'>,\n  context: ActionsContext,\n  env: NodeJS.ProcessEnv\n): Inputs {\n  let repo: string = core.getInput('repo')\n  if (repo === '' || repo === null) {\n    repo = context.repo.repo\n    core.info(`${context.repo.repo} - default repo.`)\n  }\n\n  let owner: string = core.getInput('owner')\n  if (owner === '' || owner === null) {\n    owner = context.repo.owner\n    core.info(`${context.repo.owner} - default owner.`)\n  }\n  owner = validateName('owner', owner)\n\n  // Allow for multiple repos, ex: [val1, val2, val3], one per line or space separated\n  const repositories = repo\n    .split(/[[\\]\\s,]+/)\n    .filter(x => x !== '')\n    .map(entry => parseRepoEntry(entry, owner))\n\n  if (repositories.length > maxRepositories()) {\n    throw new Error(\n      `Too many repositories (${repositories.length.toString()}): at most ${maxRepositories().toString()} repositories can be analysed in one run`\n    )\n  }\n\n  for (const repository of repositories) {\n    core.info(`${owner}/${repository}`)\n  }\n\n  const repoCount = repositories.length\n  if (repoCount > 1) {\n    core.info(`${repoCount.toString()} repositories registered.`)\n  } else {\n    core.info(`${repoCount.toString()} repository registered.`)\n  }\n\n  let token: string | undefined = core.getInput('token')\n  if (token === '' || token === null) {\n    token = env.GH_TOKEN\n  }\n  if (token === undefined || token === '') {\n    throw new Error(TOKEN_REQUIRED_MESSAGE)\n  }\n  // The GH_TOKEN fallback is not masked by the runner unless registered here.\n  core.setSecret(token)\n\n  return {\n    owner,\n    repositories,\n    token,\n    logging: parseFlag(core, 'logging'),\n    filtered: parseFlag(core, 'filtered'),\n    bugLabel: parseBugLabel(core.getInput('bug-label'))\n  }\n}\n\nexport async function run({inputs, client, core}: RunDeps): Promise<"+"Outputs> {\n  const {owner, repositories, logging, filtered, bugLabel} = inputs\n  // The only clock read in src/: every adapter and metric shares this window.\n  const window = metricsWindow(new Date())\n\n  // Fetch everything first so an API failure aborts before any output is set.\n  const releaseList = await new ReleaseAdapter(\n    client,\n    owner,\n    repositories,\n    window\n  ).GetAllReleasesLastMonth()\n  const pulls = await new PullRequestsAdapter(\n    client,\n    owner,\n    repositories,\n    window\n  ).GetAllPRsLastMonth()\n  const issueList = await new IssuesAdapter(\n    client,\n    owner,\n    repositories,\n    window\n  ).GetAllIssuesLastMonth()\n\n  const status = metricsStatus(releaseList, pulls, core)\n\n  const df = new DeployFrequency(releaseList, {window})\n  const lt = new LeadTime(pulls, releaseList, new CommitsAdapter(client), {\n    window,\n    logger: core\n  })\n  const leadTime = await lt.getLeadTime(filtered)\n  const cfr = new ChangeFailureRate(issueList, releaseList, {window, bugLabel})\n  const mttr = new MeanTimeToRestore(issueList, releaseList, {window, bugLabel})\n\n  const outputs: Outputs = {\n    'deploy-rate': df.rate(),\n    ...(logging && {'deploy-rate-log': serializeLog(df.getLog())}),\n    'lead-time': leadTime,\n    ...(logging && {'lead-time-log': serializeLog(lt.getLog())}),\n    'change-failure-rate': cfr.Cfr(),\n    ...(logging && {'change-failure-rate-log': serializeLog(cfr.getLog())}),\n    mttr: mttr.mttr(),\n    ...(logging && {'mttr-log': serializeLog(mttr.getLog())}),\n    'metrics-status': JSON.stringify(status)\n  }\n  for (const [name, value] of Object.entries(outputs)) {\n    core.setOutput(name, value)\n  }\n\n  core.info(\n    `GitHub API rate limit remaining: ${client.rateLimitRemaining?.toString() ?? 'unknown'}`\n  )\n\n  return outputs\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":95,"low":90,"break":90},"testFiles":{"__tests__/main.test.ts":{"tests":[{"id":"0","name":"main.ts performs no I/O when imported"},{"id":"1","name":"parseInputs uses the provided token, owner and repo inputs without touching the context"},{"id" nabled"},{"id":"70","name":"run does not set log outputs when logging is disabled"},{"id":"71","name":"run computes change-failure-rate and mttr from an empty issue list without warning"},{"id":"72","name":"run succeeds with zero outputs and one warning per metric when there is no data at all"},{"id":"73","name":"run warns before any output is set"},{"id":"74","name":"run marks only lead-time as no-data when there are releases but no pull requests"},{"id":"75","name":"run aborts before any output is set when fetching releases fails"},{"id":"76","name":"run aborts before any output is set when fetching pulls fails"},{"id":"77","name":"run aborts before any output is set when fetching issues fails"},{"id":"78","name":"run aborts before any output is set when fetching commits (via lead time) fails"},{"id":"79","name":"run fetches releases, pulls and issues before computing any metric"},{"id":"80","name":"run passes filtered=true to LeadTime"},{"id":"81","name":"run passes filtered=false to LeadTime"},{"id":"82","name":"run passes the bug label to ChangeFailureRate and MeanTimeToRestore"},{"id":"83","name":"run logs the remaining rate limit once, after the outputs are set"},{"id":"84","name":"run logs the remaining rate limit as unknown when no response carried it"},{"id":"85","name":"run does not log the rate limit when the run fails"},{"id":"86","name":"metricsStatus reports every metric as computed when releases and pulls exist"},{"id":"87","name":"metricsStatus keys the status object in output order"},{"id":"88","name":"metricsStatus prefers the missing-releases reason for lead-time when both lists are empty"}],"source":"import * as core from '@actions/core'\nimport {ReleaseAdapter} from '../src/ReleaseAdapter'\nimport {DeployFrequency} from '../src/DeployFrequency'\nimport {ChangeFailureRate} from '../src/ChangeFailureRate'\nimport {IssuesAdapter} from '../src/IssuesAdapter'\nimport {MeanTimeToRestore} from '../src/MeanTimeToRestore'\nimport {PullRequestsAdapter} from '../src/PullRequestsAdapter'\nimport {CommitsAdapter} from '../src/CommitsAdapter'\nimport {LeadTime} from '../src/LeadTime'\nimport type {GitHubClient} from '../src/GitHubClient'\nimport {\n  parseInputs,\n  run,\n  maxRepositories,\n  metricsStatus,\n  TOKEN_REQUIRED_MESSAGE\n} from '../src/main'\nimport type {ActionsContext, Inputs} from '../src/main'\nimport type {Release} from '../src/types/Release'\nimport type {PullRequest} from '../src/types/PullRequest'\nimport type {Issue} from '../src/types/Issue'\nimport {metricsWindow} from '../src/MetricsWindow'\n\nvi.mock('@actions/core')\nvi.mock('../src/ReleaseAdapter')\nvi.mock('../src/DeployFrequency')\nvi.mock('../src/ChangeFailureRate')\nvi.mock('../src/IssuesAdapter')\nvi.mock('../src/MeanTimeToRestore')\nvi.mock('../src/PullRequestsAdapter')\nvi.mock('../src/CommitsAdapter')\nvi.mock('../src/LeadTime')\n\nconst context: ActionsContext = {\n  repo: {owner: 'defaultOwner', repo: 'defaultRepo'}\n}\n\n// Mirrors github.context.repo outside Actions: throws unless the fallback is needed.\nconst throwingContext: ActionsContext = {\n  get repo(): never {\n    throw new Error('context.repo requires a GITHUB_REPOSITORY')\n  }\n}\n\nfunction fakeCore(inputs: Record<"+"string, string | null>): {\n  getInput: Mock<"+"(name: string) => string>\n  info: Mock<"+"(message: string) => void>\n  warning: Mock<"+"(message: string) => void>\n  setOutput: Mock<"+"(name: string, value: unknown) => void>\n  setSecret: Mock<"+"(secret: string) => void>\n} {\n  return {\n    getInput: vi.fn((name: string) =>\n      name in inputs ? (inputs[name] as string) : ''\n    ),\n    info: vi.fn(),\n    warning: vi.fn(),\n    setOutput: vi.fn(),\n    setSecret: vi.fn()\n  }\n}\n\ndescribe('main.ts', () => {\n  it('performs no I/O when imported', async () => {\n    const fetchSpy = vi.spyOn(globalThis, 'fetch')\n    vi.resetModules()\n\n    await import('../src/main')\n\n    expect(fetchSpy).not.toHaveBeenCalled()\n    expect(core.setOutput).not.toHaveBeenCalled()\n    expect(core.getInput).not.toHaveBeenCalled()\n    expect(core.setFailed).not.toHaveBeenCalled()\n  })\n})\n\ndescribe('parseInputs', () => {\n  it('uses the provided token, owner and repo inputs without touching the context', () => {\n    const inputs = parseInputs(\n      fakeCore({token: 'provided-token', repo: 'repo1', owner: 'o'}),\n      throwingContext,\n      {GH_TOKEN: 'env-token'}\n    )\n\n    expect(inputs).toEqual<"+"Inputs>({\n      owner: 'o',\n      repositories: ['repo1'],\n      token: 'provided-token',\n      logging: false,\n      filtered: false,\n      bugLabel: 'bug'\n    })\n  })\n\n  it('falls back to GH_TOKEN when the token input is empty', () => {\n    const fake = fakeCore({token: '', repo: 'repo1', owner: 'o'})\n\n    const inputs = parseInputs(fake, context, {GH_TOKEN: 'env-token'})\n\n    expect(inputs.token).toBe('env-token')\n    expect(fake.setSecret).toHaveBeenCalledExactlyOnceWith('env-token')\n  })\n\n  it('falls back to GH_TOKEN when the token input is null', () => {\n    const inputs = parseInputs(\n      fakeCore({token: null, repo: 'repo1', owner: 'o'}),\n      context,\n      {GH_TOKEN: 'env-token'}\n    )\n\n    expect(inputs.token).toBe('env-token')\n  })\n\n  it('registers the provided token input as a secret', () => {\n    const fake = fakeCore({token: 'provided-token', repo: 'repo1', owner: 'o'})\n\n    parseInputs(fake, context, {GH_TOKEN: 'env-token'})\n\n    expect(fake.setSecret).toHaveBeenCalledExactlyOnceWith('provided-token')\n  })\n\n  it.each([\n    ['GH_TOKEN unset', {}],\n    ['GH_TOKEN empty', {GH_TOKEN: ''}]\n  ])(\n    'fails with the required-token message when the token input is empty and %s',\n    (_label, env) => {\n      const fake = fakeCore({repo: 'repo1', owner: 'o'})\n\n      expect(() => parseInputs(fake, context, env)).toThrow(\n        new Error(TOKEN_REQUIRED_MESSAGE)\n      )\n      expect(fake.setSecret).not.toHaveBeenCalled()\n    }\n  )\n\n  it('names both the input and the environment variable in the required-token message', () => {\n    expect(TOKEN_REQUIRED_MESSAGE).toBe(\n      'A GitHub token is required: set the `token` input or the GH_TOKEN environment variable'\n    )\n  })\n\n  it('uses the context repo and owner when inputs are not provided and logs it', () => {\n    const fake = fakeCore({token: 'mock-token', logging: 'false'})\n\n    const inputs = parseInputs(fake, context, {})\n\n    expect(inputs.owner).toBe('defaultOwner')\n    expect(inputs.repositories).toEqual(['defaultRepo'])\n    expect(fake.info.mock.calls.map(c => c[0])).toEqual([\n      'defaultRepo - default repo.',\n      'defaultOwner - default owner.',\n      'defaultOwner/defaultRepo',\n      '1 repository registered.'\n    ])\n  })\n\n  it('uses the context repo and owner when inputs are null', () => {\n    const inputs = parseInputs(\n      fakeCore({token: 'mock-token', repo: null, owner: null}),\n      context,\n      {}\n    )\n\n    expect(inputs.owner).toBe('defaultOwner')\n    expect(inputs.repositories).toEqual(['defaultRepo'])\n  })\n\n  it('does not log defaults when repo and owner are provided', () => {\n    const fake = fakeCore({\n      token: 'mock-token',\n      repo: 'repo1',\n      owner: 'testOwner'\n    })\n\n    parseInputs(fake, context, {})\n\n    expect(fake.info.mock.calls.map(c => c[0])).toEqual([\n      'testOwner/repo1',\n      '1 repository registered.'\n    ])\n  })\n\n  it('parses bracketed, newline, comma and space separated repos and trims them', () => {\n    const inputs = parseInputs(\n      fakeCore({\n        token: 't',\n        owner: 'testOwner',\n        repo: '[ repo1 , repo2]\\nrepo3,,\\trepo4 repo5'\n      }),\n      context,\n      {}\n    )\n\n    expect(inputs.repositories).toEqual([\n      'repo1',\n      'repo2',\n      'repo3',\n      'repo4',\n      'repo5'\n    ])\n  })\n\n  it('accepts owner/repo entries and resolves them to the repo name', () => {\n    const fake = fakeCore({\n      token: 't',\n      owner: 'stenjo',\n      repo: 'stenjo/devops-metrics-action, other'\n    })\n\n    const inputs = parseInputs(fake, context, {})\n\n    expect(inputs.owner).toBe('stenjo')\n    expect(inputs.repositories).toEqual(['devops-metrics-action', 'other'])\n    expect(fake.info.mock.calls.map(c => c[0])).toEqual([\n      'stenjo/devops-metrics-action',\n      'stenjo/other',\n      '2 repositories registered.'\n    ])\n  })\n\n  it('matches the owner part of an owner/repo entry case-insensitively', () => {\n    const inputs = parseInputs(\n      fakeCore({token: 't', owner: 'StenJo', repo: 'stenjo/x'}),\n      context,\n      {}\n    )\n\n    expect(inputs.repositories).toEqual(['x'])\n  })\n\n  it('rejects an owner/repo entry whose owner conflicts with the owner input', () => {\n    expect(() =>\n      parseInputs(\n        fakeCore({token: 't', owner: 'stenjo', repo: 'someone-else/x'}),\n        context,\n        {}\n      )\n    ).toThrow(\n      new Error(\n        'Repo \"someone-else/x\" names owner \"someone-else\" but the owner input is \"stenjo\"'\n      )\n    )\n  })\n\n  it('rejects a repo entry with more than one slash', () => {\n    expect(() =>\n      parseInputs(\n        fakeCore({token: 't', owner: 'o', repo: 'a/b/c'}),\n        context,\n        {}\n      )\n    ).toThrow(\n      new Error('Invalid repo \"a/b/c\": expected \"name\" or \"owner/name\"')\n    )\n  })\n\n  it('rejects a path-traversal repo before any token handling', () => {\n    const fake = fakeCore({token: 't', owner: 'o', repo: '../../x'})\n\n    expect(() => parseInputs(fake, context, {})).toThrow(\n      new Error('Invalid repo \"../../x\": expected \"name\" or \"owner/name\"')\n    )\n    expect(fake.setSecret).not.toHaveBeenCalled()\n  })\n\n  it.each([\n    ['a..b', 'contains \"..\"'],\n    ['a~b', 'contains an invalid character'],\n    ['!abc', 'starts with an invalid character'],\n    ['abc!', 'ends with an invalid character'],\n    ['a\\\\b', 'contains a backslash'],\n    ['a%2F..%2Fb', 'contains percent-encoding'],\n    ['\\u00e5rhus', 'contains non-ASCII letters'],\n    ['a'.repeat(101), 'is longer than 100 characters']\n  ])(\"rejects repo '%s' because it %s\", repo => {\n    expect(() =>\n      parseInputs(fakeCore({token: 't', owner: 'o', repo}), context, {})\n    ).toThrow(\n      new Error(\n        `Invalid repo ${JSON.stringify(repo)}: GitHub names may only contain letters, digits, \"_\", \".\" and \"-\" (1-100 characters) and must not contain \"..\"`\n      )\n    )\n  })\n\n  it.each([\n    'abc',\n    'ABC',\n    '019',\n    'a_b',\n    'a.b',\n    'a-b',\n    '.github',\n    '-',\n    'a'.repeat(100)\n  ])(\"accepts repo '%s'\", repo => {\n    const inputs = parseInputs(\n      fakeCore({token: 't', owner: 'o', repo}),\n      context,\n      {}\n    )\n\n    expect(inputs.repositories).toEqual([repo])\n  })\n\n  it.each([\n    ['..', 'contains \"..\"'],\n    ['own er', 'contains a space'],\n    ['own/er', 'contains a slash'],\n    ['own\\ner', 'contains a newline'],\n    ['o'.repeat(101), 'is longer than 100 characters']\n  ])(\"rejects owner '%s' because it %s\", owner => {\n    expect(() =>\n      parseInputs(fakeCore({token: 't', owner, repo: 'r'}), context, {})\n    ).toThrow(\n      new Error(\n        `Invalid owner ${JSON.stringify(owner)}: GitHub names may only contain letters, digits, \"_\", \".\" and \"-\" (1-100 characters) and must not contain \"..\"`\n      )\n    )\n  })\n\n  it('rejects the owner part of an owner/repo entry as an owner', () => {\n    expect(() =>\n      parseInputs(fakeCore({token: 't', owner: 'o', repo: '../r'}), context, {})\n    ).toThrow('Invalid owner \"..\"')\n  })\n\n  it('validates the context fallback owner and repo too', () => {\n    const badContext: ActionsContext = {\n      repo: {owner: 'ok', repo: 'bad~name'}\n    }\n\n    expect(() => parseInputs(fakeCore({token: 't'}), badContext, {})).toThrow(\n      'Invalid repo \"bad~name\"'\n    )\n  })\n\n  it('logs every repository and pluralises the count', () => {\n    const fake = fakeCore({token: 't', owner: 'testOwner', repo: 'repo1,repo2'})\n\n    parseInputs(fake, context, {})\n\n    expect(fake.info.mock.calls.map(c => c[0])).toEqual([\n      'testOwner/repo1',\n      'testOwner/repo2',\n      '2 repositories registered.'\n    ])\n  })\n\n  describe('repository cap', () => {\n    const repos = (count: number): string =>\n      Array.from({length: count}, (_, i) => `repo${i.toString()}`).join(',')\n\n    it('allows exactly the maximum number of repositories', () => {\n      expect(maxRepositories()).toBe(25)\n      const fake = fakeCore({token: 't', owner: 'o', repo: repos(25)})\n\n      const inputs = parseInputs(fake, context, {})\n\n      expect(inputs.repositories).toHaveLength(25)\n      expect(fake.info).toHaveBeenLastCalledWith('25 repositories registered.')\n    })\n\n    it('fails fast naming the limit when one repository too many is given', () => {\n      const fake = fakeCore({token: 't', owner: 'o', repo: repos(26)})\n\n      expect(() => parseInputs(fake, context, {})).toThrow(\n        'Too many repositories (26): at most 25 repositories can be analysed in one run'\n      )\n      expect(fake.info).not.toHaveBeenCalled()\n      expect(fake.setSecret).not.toHaveBeenCalled()\n    })\n  })\n\n  it.each([\n    ['true', true],\n    ['false', false],\n    ['', false],\n    ['yes', false]\n  ])(\"maps filtered input '%s' to %s\", (value, expected) => {\n    const inputs = parseInputs(\n      fakeCore({token: 't', repo: 'r', owner: 'o', filtered: value}),\n      context,\n      {}\n    )\n\n    expect(inputs.filtered).toBe(expected)\n  })\n\n  it.each([\n    ['true', true],\n    ['false', false],\n    ['', false],\n    ['yes', false]\n  ])(\"maps logging input '%s' to %s\", (value, expected) => {\n    const inputs = parseInputs(\n      fakeCore({token: 't', repo: 'r', owner: 'o', logging: value}),\n      context,\n      {}\n    )\n\n    expect(inputs.logging).toBe(expected)\n  })\n\n  it.each(['yes', '1', 'TRUE', 'True '])(\n    \"warns about the unrecognised logging value '%s' and treats it as false\",\n    value => {\n      const fake = fakeCore({token: 't', repo: 'r', owner: 'o', logging: value})\n\n      const inputs = parseInputs(fake, context, {})\n\n      expect(inputs.logging).toBe(false)\n      expect(fake.warning).toHaveBeenCalledExactlyOnceWith(\n        `Unrecognised value ${JSON.stringify(value)} for input 'logging': expected 'true' or 'false', treating it as false`\n      )\n    }\n  )\n\n  it(\"warns about an unrecognised filtered value naming the 'filtered' input\", () => {\n    const fake = fakeCore({token: 't', repo: 'r', owner: 'o', filtered: 'on'})\n\n    parseInputs(fake, context, {})\n\n    expect(fake.warning).toHaveBeenCalledExactlyOnceWith(\n      `Unrecognised value \"on\" for input 'filtered': expected 'true' or 'false', treating it as false`\n    )\n  })\n\n  it.each(['true', 'false', ''])(\n    \"does not warn for the recognised flag value '%s'\",\n    value => {\n      const fake = fakeCore({\n        token: 't',\n        repo: 'r',\n        owner: 'o',\n        logging: value,\n        filtered: value\n      })\n\n      parseInputs(fake, context, {})\n\n      expect(fake.warning).not.toHaveBeenCalled()\n    }\n  )\n\n  it(\"passes the 'bug-label' input through\", () => {\n    const fake = fakeCore({\n      token: 't',\n      repo: 'r',\n      owner: 'o',\n      'bug-label': 'incident'\n    })\n\n    const inputs = parseInputs(fake, context, {})\n\n    expect(fake.getInput).toHaveBeenCalledWith('bug-label')\n    expect(inputs.bugLabel).toBe('incident')\n  })\n\n  it(\"trims the 'bug-label' input\", () => {\n    const inputs = parseInputs(\n      fakeCore({\n        token: 't',\n        repo: 'r',\n        owner: 'o',\n        'bug-label': '  type: bug '\n      }),\n      context,\n      {}\n    )\n\n    expect(inputs.bugLabel).toBe('type: bug')\n  })\n\n  it.each([\n    ['empty', ''],\n    ['whitespace only', '  \\t']\n  ])(\"defaults 'bug-label' to 'bug' when the input is %s\", (_label, value) => {\n    const inputs = parseInputs(\n      fakeCore({token: 't', repo: 'r', owner: 'o', 'bug-label': value}),\n      context,\n      {}\n    )\n\n    expect(inputs.bugLabel).toBe('bug')\n  })\n\n  it(\"accepts a 50 character 'bug-label'\", () => {\n    const label = 'b'.repeat(50)\n\n    const inputs = parseInputs(\n      fakeCore({token: 't', repo: 'r', owner: 'o', 'bug-label': label}),\n      context,\n      {}\n    )\n\n    expect(inputs.bugLabel).toBe(label)\n  })\n\n  it(\"rejects a 'bug-label' longer than 50 characters after trimming\", () => {\n    const label = 'b'.repeat(51)\n\n    expect(() =>\n      parseInputs(\n        fakeCore({\n          token: 't',\n          repo: 'r',\n          owner: 'o',\n          'bug-label': ` ${label} `\n        }),\n        context,\n        {}\n      )\n    ).toThrow(\n      new Error(\n        `Invalid bug-label ${JSON.stringify(label)}: must be at most 50 characters`\n      )\n    )\n  })\n})\n\ndescribe('run', () => {\n  const client = {} as GitHubClient\n  const NOW = new Date('2024-03-01T12:00:00Z')\n  const WINDOW = metricsWindow(NOW)\n\n  function inputsWith(overrides: Partial<"+"Inputs> = {}): Inputs {\n    return {\n      owner: 'o',\n      repositories: ['repo1'],\n      token: 't',\n      logging: false,\n      filtered: false,\n      bugLabel: 'bug',\n      ...overrides\n    }\n  }\n\n  const mockReleases = [{}, {}] as Release[]\n  const mockPRs = [{}, {}] as PullRequest[]\n  const mockIssues = [{}, {}] as Issue[]\n  const ALL_COMPUTED =\n    '{\"deploy-rate\":\"computed\",\"lead-time\":\"computed\",\"change-failure-rate\":\"computed\",\"mttr\":\"computed\"}'\n\n  afterEach(() => {\n    vi.useRealTimers()\n  })\n\n  beforeEach(() => {\n    vi.clearAllMocks()\n    vi.useFakeTimers({now: NOW, toFake: ['Date']})\n    ;(\n      ReleaseAdapter.prototype.GetAllReleasesLastMonth as Mock\n    ).mockResolvedValue(mockReleases)\n    ;(\n      PullRequestsAdapter.prototype.GetAllPRsLastMonth as Mock\n    ).mockResolvedValue(mockPRs)\n    ;(IssuesAdapter.prototype.GetAllIssuesLastMonth as Mock).mockResolvedValue(\n      mockIssues\n    )\n    ;(DeployFrequency.prototype.rate as Mock).mockReturnValue('5')\n    ;(DeployFrequency.prototype.getLog as Mock).mockReturnValue([\n      {\n        kind: 'release',\n        repo: 'o/r',\n        at: '2023-04-22T20:28:29Z',\n        name: 'v0.0.2'\n      },\n      {kind: 'release', repo: 'o/r', at: '2023-04-12T22:33:24Z', name: 'v0.0.1'}\n    ])\n    ;(LeadTime.prototype.getLeadTime as Mock).mockResolvedValue(10)\n    ;(LeadTime.prototype.getLog as Mock).mockReturnValue([\n      {\n        kind: 'pull',\n        repo: 'o/r',\n        at: '2023-04-28T17:50:53Z',\n        title: 'feat: something',\n        commitAt: '2023-04-20T00:00:00Z',\n        commitMessage: 'first',\n        releaseAt: '2023-04-30T17:50:53Z',\n        release: 'v1.0.0',\n        leadTimeDays: 10.74\n      }\n    ])\n    ;(ChangeFailureRate.prototype.Cfr as Mock).mockReturnValue(0.1)\n    ;(ChangeFailureRate.prototype.getLog as Mock).mockReturnValue([\n      {\n        kind: 'failed-release',\n        repo: 'o/r',\n        at: '2023-04-12T22:33:24Z',\n        name: 'v0.0.1',\n        bugs: [{number: 3, title: 'bug: x', createdAt: '2023-04-13T00:00:00Z'}]\n      }\n    ])\n    ;(MeanTimeToRestore.prototype.mttr as Mock).mockReturnValue(3)\n    ;(MeanTimeToRestore.prototype.getLog as Mock).mockReturnValue([\n      {\n        kind: 'restore',\n        repo: 'o/r',\n        number: 3,\n        title: 'bug: x',\n        createdAt: '2023-04-13T00:00:00Z',\n        closedAt: '2023-04-14T00:00:00Z',\n        releaseBefore: 'v0.0.1',\n        releaseBeforeAt: '2023-04-12T22:33:24Z',\n        releaseAfter: 'v0.0.2',\n        releaseAfterAt: '2023-04-22T20:28:29Z',\n        restoreDays: 9.91\n      }\n    ])\n  })\n\n  it('wires the injected client, owner, repositories and window into every adapter', async () => {\n    const inputs = inputsWith({owner: 'o', repositories: ['repo1', 'repo2']})\n\n    await run({inputs, client, core: fakeCore({})})\n\n    expect(ReleaseAdapter).toHaveBeenCalledWith(\n      client,\n      'o',\n      ['repo1', 'repo2'],\n      WINDOW\n    )\n    expect(PullRequestsAdapter).toHaveBeenCalledWith(\n      client,\n      'o',\n      ['repo1', 'repo2'],\n      WINDOW\n    )\n    expect(CommitsAdapter).toHaveBeenCalledWith(client)\n    expect(IssuesAdapter).toHaveBeenCalledWith(\n      client,\n      'o',\n      ['repo1', 'repo2'],\n      WINDOW\n    )\n  })\n\n  it('builds one window from the clock and shares the same object everywhere', async () => {\n    await run({inputs: inputsWith(), client, core: fakeCore({})})\n\n    const window = vi.mocked(ReleaseAdapter).mock.calls[0][3]\n    expect(window).toEqual(WINDOW)\n    expect(vi.mocked(PullRequestsAdapter).mock.calls[0][3]).toBe(window)\n    expect(vi.mocked(IssuesAdapter).mock.calls[0][3]).toBe(window)\n    expect(vi.mocked(DeployFrequency).mock.calls[0][1].window).toBe(window)\n    expect(vi.mocked(LeadTime).mock.calls[0][3].window).toBe(window)\n    expect(vi.mocked(ChangeFailureRate).mock.calls[0][2].window).toBe(window)\n    expect(vi.mocked(MeanTimeToRestore).mock.calls[0][2].window).toBe(window)\n  })\n\n  it('feeds the fetched releases, pulls, commits and issues into the metrics', async () => {\n    const fake = fakeCore({})\n    await run({inputs: inputsWith(), client, core: fake})\n\n    const commits = vi.mocked(CommitsAdapter).mock.instances[0]\n    expect(DeployFrequency).toHaveBeenCalledWith(mockReleases, {window: WINDOW})\n    expect(LeadTime).toHaveBeenCalledWith(mockPRs, mockReleases, commits, {\n      window: WINDOW,\n      logger: fake\n    })\n    expect(ChangeFailureRate).toHaveBeenCalledWith(mockIssues, mockReleases, {\n      window: WINDOW,\n      bugLabel: 'bug'\n    })\n    expect(MeanTimeToRestore).toHaveBeenCalledWith(mockIssues, mockReleases, {\n      window: WINDOW,\n      bugLabel: 'bug'\n    })\n  })\n\n  it('sets and returns all outputs including logs when logging is enabled', async () => {\n    const fake = fakeCore({})\n\n    const outputs = await run({\n      inputs: inputsWith({logging: true}),\n      client,\n      core: fake\n    })\n\n    const expected = {\n      'deploy-rate': '5',\n      'deploy-rate-log':\n        '[{\"kind\":\"release\",\"repo\":\"o/r\",\"at\":\"2023-04-22T20:28:29Z\",\"name\":\"v0.0.2\"},' +\n        '{\"kind\":\"release\",\"repo\":\"o/r\",\"at\":\"2023-04-12T22:33:24Z\",\"name\":\"v0.0.1\"}]',\n      'lead-time': 10,\n      'lead-time-log':\n        '[{\"kind\":\"pull\",\"repo\":\"o/r\",\"at\":\"2023-04-28T17:50:53Z\",\"title\":\"feat: something\",' +\n        '\"commitAt\":\"2023-04-20T00:00:00Z\",\"commitMessage\":\"first\",' +\n        '\"releaseAt\":\"2023-04-30T17:50:53Z\",\"release\":\"v1.0.0\",\"leadTimeDays\":10.74}]',\n      'change-failure-rate': 0.1,\n      'change-failure-rate-log':\n        '[{\"kind\":\"failed-release\",\"repo\":\"o/r\",\"at\":\"2023-04-12T22:33:24Z\",\"name\":\"v0.0.1\",' +\n        '\"bugs\":[{\"number\":3,\"title\":\"bug: x\",\"createdAt\":\"2023-04-13T00:00:00Z\"}]}]',\n      mttr: 3,\n      'mttr-log':\n        '[{\"kind\":\"restore\",\"repo\":\"o/r\",\"number\":3,\"title\":\"bug: x\",' +\n        '\"createdAt\":\"2023-04-13T00:00:00Z\",\"closedAt\":\"2023-04-14T00:00:00Z\",' +\n        '\"releaseBefore\":\"v0.0.1\",\"releaseBeforeAt\":\"2023-04-12T22:33:24Z\",' +\n        '\"releaseAfter\":\"v0.0.2\",\"releaseAfterAt\":\"2023-04-22T20:28:29Z\",' +\n        '\"restoreDays\":9.91}]',\n      'metrics-status': ALL_COMPUTED\n    }\n    expect(outputs).toEqual(expected)\n    expect(fake.setOutput.mock.calls).toEqual(Object.entries(expected))\n    expect(JSON.parse(outputs['deploy-rate-log'] as string)).toHaveLength(2)\n    expect(JSON.parse(outputs['lead-time-log'] as string)).toHaveLength(1)\n    expect(\n      JSON.parse(outputs['change-failure-rate-log'] as string)\n    ).toHaveLength(1)\n    expect(JSON.parse(outputs['mttr-log'] as string)).toHaveLength(1)\n  })\n\n  it('does not set log outputs when logging is disabled', async () => {\n    const fake = fakeCore({})\n\n    const outputs = await run({\n      inputs: inputsWith({logging: false}),\n      client,\n      core: fake\n    })\n\n    const expected = {\n      'deploy-rate': '5',\n      'lead-time': 10,\n      'change-failure-rate': 0.1,\n      mttr: 3,\n      'metrics-status': ALL_COMPUTED\n    }\n    expect(outputs).toEqual(expected)\n    expect(fake.setOutput.mock.calls).toEqual(Object.entries(expected))\n  })\n\n  it('computes change-failure-rate and mttr from an empty issue list without warning', async () => {\n    ;(IssuesAdapter.prototype.GetAllIssuesLastMonth as Mock).mockResolvedValue(\n      []\n    )\n    const fake = fakeCore({})\n\n    const outputs = await run({inputs: inputsWith(), client, core: fake})\n\n    expect(ChangeFailureRate).toHaveBeenCalledWith([], mockReleases, {\n      window: WINDOW,\n      bugLabel: 'bug'\n    })\n    expect(MeanTimeToRestore).toHaveBeenCalledWith([], mockReleases, {\n      window: WINDOW,\n      bugLabel: 'bug'\n    })\n    expect(outputs['metrics-status']).toBe(ALL_COMPUTED)\n    expect(fake.warning).not.toHaveBeenCalled()\n  })\n\n  it('succeeds with zero outputs and one warning per metric when there is no data at all', async () => {\n    ;(\n      ReleaseAdapter.prototype.GetAllReleasesLastMonth as Mock\n    ).mockResolvedValue([])\n    ;(\n      PullRequestsAdapter.prototype.GetAllPRsLastMonth as Mock\n    ).mockResolvedValue([])\n    ;(IssuesAdapter.prototype.GetAllIssuesLastMonth as Mock).mockResolvedValue(\n      []\n    )\n    ;(DeployFrequency.prototype.rate as Mock).mockReturnValue('0.00')\n    ;(LeadTime.prototype.getLeadTime as Mock).mockResolvedValue(0)\n    ;(ChangeFailureRate.prototype.Cfr as Mock).mockReturnValue(0)\n    ;(MeanTimeToRestore.prototype.mttr as Mock).mockReturnValue(0)\n    const fake = fakeCore({})\n\n    const outputs = await run({inputs: inputsWith(), client, core: fake})\n\n    expect(outputs).toEqual({\n      'deploy-rate': '0.00',\n      'lead-time': 0,\n      'change-failure-rate': 0,\n      mttr: 0,\n      'metrics-status':\n        '{\"deploy-rate\":\"no-data\",\"lead-time\":\"no-data\",\"change-failure-rate\":\"no-data\",\"mttr\":\"no-data\"}'\n    })\n    expect(fake.warning.mock.calls).toEqual([\n      ['deploy-rate defaulted to 0: no releases in the window'],\n      ['lead-time defaulted to 0: no releases in the window'],\n      ['change-failure-rate defaulted to 0: no releases in the window'],\n      ['mttr defaulted to 0: no releases in the window']\n    ])\n  })\n\n  it('warns before any output is set', async () => {\n    ;(\n      ReleaseAdapter.prototype.GetAllReleasesLastMonth as Mock\n    ).mockResolvedValue([])\n    const fake = fakeCore({})\n\n    await run({inputs: inputsWith(), client, core: fake})\n\n    expect(fake.warning.mock.invocationCallOrder.at(-1)).toBeLessThan(\n      fake.setOutput.mock.invocationCallOrder[0]\n    )\n  })\n\n  it('marks only lead-time as no-data when there are releases but no pull requests', async () => {\n    ;(\n      PullRequestsAdapter.prototype.GetAllPRsLastMonth as Mock\n    ).mockResolvedValue([])\n    const fake = fakeCore({})\n\n    const outputs = await run({inputs: inputsWith(), client, core: fake})\n\n    expect(JSON.parse(outputs['metrics-status'])).toEqual({\n      'deploy-rate': 'computed',\n      'lead-time': 'no-data',\n      'change-failure-rate': 'computed',\n      mttr: 'computed'\n    })\n    expect(fake.warning).toHaveBeenCalledExactlyOnceWith(\n      'lead-time defaulted to 0: no pull requests in the window'\n    )\n  })\n\n  /* eslint-disable @typescript-eslint/unbound-method */\n  it.each([\n    ['releases', () => ReleaseAdapter.prototype.GetAllReleasesLastMonth],\n    ['pulls', () => PullRequestsAdapter.prototype.GetAllPRsLastMonth],\n    ['issues', () => IssuesAdapter.prototype.GetAllIssuesLastMonth],\n    ['commits (via lead time)', () => LeadTime.prototype.getLeadTime]\n  ])(\n    'aborts before any output is set when fetching %s fails',\n    async (_name, method) => {\n      ;(method() as Mock).mockRejectedValueOnce(new Error('Failed to fetch'))\n      const fake = fakeCore({})\n\n      await expect(\n        run({inputs: inputsWith(), client, core: fake})\n      ).rejects.toThrow('Failed to fetch')\n      expect(fake.setOutput).not.toHaveBeenCalled()\n    }\n  )\n\n  it('fetches releases, pulls and issues before computing any metric', async () => {\n    await run({inputs: inputsWith(), client, core: fakeCore({})})\n\n    const order = (m: Mock): number => m.mock.invocationCallOrder[0]\n    const lastFetch = Math.max(\n      order(ReleaseAdapter.prototype.GetAllReleasesLastMonth as Mock),\n      order(PullRequestsAdapter.prototype.GetAllPRsLastMonth as Mock),\n      order(IssuesAdapter.prototype.GetAllIssuesLastMonth as Mock)\n    )\n    expect(order(vi.mocked(DeployFrequency))).toBeGreaterThan(lastFetch)\n    expect(order(vi.mocked(LeadTime))).toBeGreaterThan(lastFetch)\n    expect(order(vi.mocked(ChangeFailureRate))).toBeGreaterThan(lastFetch)\n    expect(order(vi.mocked(MeanTimeToRestore))).toBeGreaterThan(lastFetch)\n  })\n  /* eslint-enable @typescript-eslint/unbound-method */\n\n  it.each([true, false])('passes filtered=%s to LeadTime', async filtered => {\n    await run({inputs: inputsWith({filtered}), client, core: fakeCore({})})\n\n    // eslint-disable-next-line @typescript-eslint/unbound-method\n    expect(LeadTime.prototype.getLeadTime as Mock).toHaveBeenCalledWith(\n      filtered\n    )\n  })\n\n  it('passes the bug label to ChangeFailureRate and MeanTimeToRestore', async () => {\n    await run({\n      inputs: inputsWith({bugLabel: 'incident'}),\n      client,\n      core: fakeCore({})\n    })\n\n    expect(ChangeFailureRate).toHaveBeenCalledWith(mockIssues, mockReleases, {\n      window: WINDOW,\n      bugLabel: 'incident'\n    })\n    expect(MeanTimeToRestore).toHaveBeenCalledWith(mockIssues, mockReleases, {\n      window: WINDOW,\n      bugLabel: 'incident'\n    })\n  })\n\n  it('logs the remaining rate limit once, after the outputs are set', async () => {\n    const fake = fakeCore({})\n\n    await run({\n      inputs: inputsWith(),\n      client: {rateLimitRemaining: 812} as GitHubClient,\n      core: fake\n    })\n\n    expect(fake.info).toHaveBeenCalledExactlyOnceWith(\n      'GitHub API rate limit remaining: 812'\n    )\n    expect(fake.info.mock.invocationCallOrder[0]).toBeGreaterThan(\n      fake.setOutput.mock.invocationCallOrder.at(-1) as number\n    )\n  })\n\n  it('logs the remaining rate limit as unknown when no response carried it', async () => {\n    const fake = fakeCore({})\n\n    await run({inputs: inputsWith(), client, core: fake})\n\n    expect(fake.info).toHaveBeenCalledExactlyOnceWith(\n      'GitHub API rate limit remaining: unknown'\n    )\n  })\n\n  it('does not log the rate limit when the run fails', async () => {\n    ;(LeadTime.prototype.getLeadTime as Mock).mockRejectedValueOnce(\n      new Error('Failed to fetch')\n    )\n    const fake = fakeCore({})\n\n    await expect(\n      run({inputs: inputsWith(), client, core: fake})\n    ).rejects.toThrow()\n    expect(fake.info).not.toHaveBeenCalled()\n  })\n})\n\ndescribe('metricsStatus', () => {\n  const releases = [{}] as Release[]\n  const pulls = [{}] as PullRequest[]\n\n  it('reports every metric as computed when releases and pulls exist', () => {\n    const fake = fakeCore({})\n\n    expect(metricsStatus(releases, pulls, fake)).toEqual({\n      'deploy-rate': 'computed',\n      'lead-time': 'computed',\n      'change-failure-rate': 'computed',\n      mttr: 'computed'\n    })\n    expect(fake.warning).not.toHaveBeenCalled()\n  })\n\n  it('keys the status object in output order', () => {\n    expect(Object.keys(metricsStatus(releases, pulls, fakeCore({})))).toEqual([\n      'deploy-rate',\n      'lead-time',\n      'change-failure-rate',\n      'mttr'\n    ])\n  })\n\n  it('prefers the missing-releases reason for lead-time when both lists are empty', () => {\n    const fake = fakeCore({})\n\n    metricsStatus([], [], fake)\n\n    expect(fake.warning).toHaveBeenCalledWith(\n      'lead-time defaulted to 0: no releases in the window'\n    )\n    expect(fake.warning).not.toHaveBeenCalledWith(\n      expect.stringContaining('no pull requests')\n    )\n  })\n})\n"},"__tests__/LeadTime.test.ts":{"tests":[{"id":"89","name":"LeadTime should return 0 on no pull-requests"},{"id":"90","name":"LeadTime should return 0 on no closed pull-requests"},{"id":"91","name":"LeadTime should return 0 on no releases"},{"id":"92","name":"LeadTime should return 0 on no pull-requests with baseRef = main"},{"id":"93","name":"LeadTime should return 8 on pull-requests with baseRef = main"},{"id":"94","name":"LeadTime should return 8 on pull-requests with baseRef = main and earlier release on other repo"},{"id":"95","name":"LeadTime should return 0 on too old pull-requests"},{"id":"96","name":"LeadTime should return 11 on pull-requests with two commits"},{"id":"97","name":"LeadTime should return 10.5 on pull-requests with two pulls on different repos"},{"id":"98","name":"LeadTime should return 8.5 on two pull-requests with two commits"},{"id":"99","name":"LeadTime should return 6,67 on three pull-requests with one commit each"},{"id":"100","name":"LeadTime should return 6 on three pull-requests with one commit each and two latest not released"},{"id":"101","name":"LeadTime should return 8 on three pull-requests with one commit each and two repos, latest not released"},{"id":"102","name":"LeadTime should not attribute releases of a repo whose name is a prefix of another"},{"id":"103","name":"LeadTime should get an empty log of releases or pulls"},{"id":"104","name":"LeadTime should get release log list weekly when rate calculated"},{"id":"105","name":"LeadTime should get event log list when lead time calculated"},{"id":"106","name":"LeadTime should get event log list when lead time calculated and filtered"},{"id":"107","name":"LeadTime should get event log list when lead time calculated and filtered with no fix or feat"},{"id":"108","name":"LeadTime should edge cases exclude a pull merged 1 ms before the window starts"},{"id":"109","name":"LeadTime should edge cases include a pull merged exactly 30 days ago"},{"id":"110","name":"LeadTime should edge cases not write the filtered log line when there are no pulls"},{"id":"111","name":"LeadTime should edge cases not write the filtered log line when there are no releases"},{"id":"112","name":"LeadTime should edge cases log only pull records whether filtered or not"},{"id":"113","name":"LeadTime should edge cases drop unmerged pulls in the constructor"},{"id":"114","name":"LeadTime should edge cases ignore a pull not merged to main even when releases exist"},{"id":"115","name":"LeadTime should edge cases ignore a release published at the exact merge time"},{"id":"116","name":"LeadTime should edge cases only match titles starting with feat or fix when filtered"},{"id":"117","name":"LeadTime should edge cases log the earliest commit even when commits are unsorted"},{"id":"118","name":"LeadTime should request bounds default to at most 200 commit fetches, 4 in flight"},{"id":"119","name":"LeadTime should request bounds fetch commits for at most 200 pull requests by default and warn once"},{"id":"120","name":"LeadTime should request bounds not warn when the number of qualifying pull requests equals the cap"},{"id":"121","name":"LeadTime should request bounds count only qualifying pull requests against the cap"},{"id":"122","name":"LeadTime should request bounds keep the sampled pull requests in input order and skip the rest"},{"id":"123","name":"LeadTime should request bounds fetch commits with at most 4 requests in flight by default"},{"id":"124","name":"LeadTime should request bounds honour an injected concurrency limit"},{"id":"125","name":"LeadTime should request bounds keep log order by pull request even when fetches finish out of order"},{"id":"126","name":"LeadTime should request bounds propagate a failing commit fetch"}],"source":"import {CommitsAdapter} from '../src/CommitsAdapter'\nimport {GitHubClient} from '../src/GitHubClient'\nimport type {Commit} from '../src/types/Commit'\nimport type {PullRequest} from '../src/types/PullRequest'\nimport type {Release} from '../src/types/Release'\nimport type {RepoKey} from '../src/types/RepoKey'\nimport type {ICommitsAdapter} from '../src/interfaces/ICommitsAdapter'\nimport {LeadTime, defaultLeadTimeLimits} from '../src/LeadTime'\nimport {commit, pull, release, ts, windowAt} from './helpers/domain'\n\nconst DMA = 'stenjo/devops-metrics-action'\nconst OTHER = 'stenjo/other-repo'\n\ndescribe('LeadTime should', () => {\n  const commitsAdapter: CommitsAdapter = new CommitsAdapter(new GitHubClient())\n  commitsAdapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => {\n    return Promise.resolve([commit('2023-04-22T17:50:53Z')])\n  })\n\n  it('return 0 on no pull-requests', async () => {\n    const pulls = [] as PullRequest[]\n    const lt = new LeadTime(\n      pulls,\n      [release('2023-04-30T17:50:53Z')],\n      commitsAdapter,\n      {window: windowAt()}\n    )\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(0)\n  })\n\n  it('return 0 on no closed pull-requests', async () => {\n    const pulls = [pull({mergedAt: null})]\n    const lt = new LeadTime(\n      pulls,\n      [release('2023-04-30T17:50:53Z')],\n      commitsAdapter,\n      {window: windowAt('2023-05-01')}\n    )\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(0)\n  })\n\n  it('return 0 on no releases', async () => {\n    const pulls = [pull({mergedAt: ts('2023-04-28T17:50:53Z')})]\n\n    const lt = new LeadTime(pulls, [], commitsAdapter, {\n      window: windowAt('2023-05-01')\n    })\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(0)\n  })\n\n  it('return 0 on no pull-requests with baseRef = main', async () => {\n    const pulls = [pull({baseRef: 'other'})]\n    const lt = new LeadTime(\n      pulls,\n      [release('2023-04-30T17:50:53Z')],\n      commitsAdapter,\n      {window: windowAt('2023-05-01')}\n    )\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(0)\n  })\n\n  it('return 8 on pull-requests with baseRef = main', async () => {\n    const pullRequests = [pull({mergedAt: ts('2023-04-28T17:50:53Z')})] // 30-22 = 8\n    const releases = [release('2023-04-30T17:50:53Z')]\n    commitsAdapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => {\n      return Promise.resolve([commit('2023-04-22T17:50:53Z')])\n    })\n    const lt = new LeadTime(pullRequests, releases, commitsAdapter, {\n      window: windowAt('2023-05-01')\n    })\n\n    const leadTime = await lt.getLeadTime()\n\n    expect(leadTime).toBe(8)\n  })\n\n  it('return 8 on pull-requests with baseRef = main and earlier release on other repo', async () => {\n    const pullRequests = [\n      pull({\n        mergedAt: ts('2023-04-28T17:50:53Z'),\n        number: 1\n      }) // 30-22 = 8\n    ]\n    const releases = [\n      release('2023-04-29T17:50:53Z', OTHER),\n      release('2023-04-30T17:50:53Z', DMA)\n    ]\n    commitsAdapter.getCommits = vi.fn(async (): Promise<"+"Commit[]> => {\n      return Promise.resolve([commit('2023-04-22T17:50:53Z')])\n    })\n    const lt = new LeadTime(pullRequests, releases, commitsAdapter, {\n      window: windowAt('2023-05-01')\n    })\n\n    const leadTime = await lt.getLeadTime()\n\n    // eslint-disable-next-line @typescript-eslint/unbound-method\n    expect(commitsAdapter.getCommits).toHaveBeenCalled()\n    // eslint-disable-next-line @typescript-eslint/unbound-method\n    expect(commitsAdapter.getCommits).toHaveBeenLastCalledWith(DMA, 1)\n    expect(leadTime).toBe(8)\n  })\n\n  it('return 0)\n      expect(lt.getLog()).toHaveLength(200)\n      expect(lt.getLog().map(l => l.title)).toContain('feat: change 1')\n      expect(lt.getLog().map(l => l.title)).toContain('feat: change 200')\n      expect(lt.getLog().map(l => l.title)).not.toContain('feat: change 201')\n      expect(leadTime).toBe(10.74)\n      expect(logger.warning).toHaveBeenCalledExactlyOnceWith(\n        'Lead time: fetching commits for only the first 200 of 201 qualifying pull requests'\n      )\n    })\n\n    it('not warn when the number of qualifying pull requests equals the cap', async () => {\n      const logger = {warning: vi.fn()}\n      const getCommits = vi.fn(async (): Promise<"+"Commit[]> => [\n        commit('2023-04-20T00:00:00Z')\n      ])\n      const lt = new LeadTime(\n        pulls(3),\n        [repoRelease],\n        {getCommits},\n        {\n          window: windowAt(today),\n          logger,\n          limits: {maxCommitFetches: 3, concurrency: 4}\n        }\n      )\n\n      await lt.getLeadTime()\n\n      expect(getCommits).toHaveBeenCalledTimes(3)\n      expect(logger.warning).not.toHaveBeenCalled()\n    })\n\n    it('count only qualifying pull requests against the cap', async () => {\n      const logger = {warning: vi.fn()}\n      const getCommits = vi.fn(async (): Promise<"+"Commit[]> => [\n        commit('2023-04-20T00:00:00Z')\n      ])\n      const input = [\n        ...pulls(2),\n        pull({mergedAt: ts('2023-04-28T17:50:53Z'), baseRef: 'develop'}),\n        pull({mergedAt: ts('2023-04-28T17:50:53Z'), repo: OTHER})\n      ]\n      const lt = new LeadTime(\n        input,\n        [repoRelease],\n        {getCommits},\n        {\n          window: windowAt(today),\n          logger,\n          limits: {\n            maxCommitFetches: 2,\n            concurrency: 4\n          }\n        }\n      )\n\n      await lt.getLeadTime()\n\n      expect(getCommits).toHaveBeenCalledTimes(2)\n      expect(logger.warning).not.toHaveBeenCalled()\n    })\n\n    it('keep the sampled pull requests in input order and skip the rest', async () => {\n      const logger = {warning: vi.fn()}\n      const tracker = trackingAdapter()\n      const lt = new LeadTime(pulls(5), [repoRelease], tracker.adapter, {\n        window: windowAt(today),\n        logger,\n        limits: {maxCommitFetches: 3, concurrency: 1}\n      })\n\n      const run = lt.getLeadTime()\n      await settle()\n      tracker.release(1)\n      await settle()\n      tracker.release(1)\n      await settle()\n      tracker.release(1)\n      await run\n\n      expect(tracker.getCommits.mock.calls.map(c => c[1])).toEqual([1, 2, 3])\n      expect(lt.getLog().map(l => l.title)).toEqual([\n        'feat: change 1',\n        'feat: change 2',\n        'feat: change 3'\n      ])\n      expect(logger.warning).toHaveBeenCalledExactlyOnceWith(\n        'Lead time: fetching commits for only the first 3 of 5 qualifying pull requests'\n      )\n    })\n\n    it('fetch commits with at most 4 requests in flight by default', async () => {\n      const tracker = trackingAdapter()\n      const lt = new LeadTime(pulls(10), [repoRelease], tracker.adapter, {\n        window: windowAt(today)\n      })\n\n      const run = lt.getLeadTime()\n      await settle()\n      expect(tracker.inFlight()).toBe(4)\n      expect(tracker.getCommits).toHaveBeenCalledTimes(4)\n\n      tracker.release(1)\n      await settle()\n      expect(tracker.inFlight()).toBe(4)\n      expect(tracker.getCommits).toHaveBeenCalledTimes(5)\n\n      await drain(tracker, run)\n\n      expect(tracker.maxInFlight()).toBe(4)\n      expect(tracker.getCommits).toHaveBeenCalledTimes(10)\n      expect(lt.getLog()).toHaveLength(10)\n    })\n\n    it('honour an injected concurrency limit', async () => {\n      const tracker = trackingAdapter()\n      const lt = new LeadTime(pulls(5), [repoRelease], tracker.adapter, {\n        window: windowAt(today),\n        limits: {maxCommitFetches: 200, concurrency: 2}\n      })\n\n      const run = lt.getLeadTime()\n      await settle()\n      expect(tracker.inFlight()).toBe(2)\n\n      await drain(tracker, run)\n\n      expect(tracker.maxInFlight()).toBe(2)\n      expect(tracker.getCommits).toHaveBeenCalledTimes(5)\n    })\n\n    it('keep log order by pull request even when fetches finish out of order', async () => {\n      const tracker = trackingAdapter()\n      const lt = new LeadTime(pulls(4), [repoRelease], tracker.adapter, {\n        window: windowAt(today),\n        limits: {maxCommitFetches: 200, concurrency: 4}\n      })\n\n      const run = lt.getLeadTime()\n      await settle()\n      // All four are in flight; finish 4 and 3 before 1 and 2.\n      tracker.releaseLast()\n      tracker.releaseLast()\n      await settle()\n      tracker.release(2)\n      await run\n\n      expect(tracker.getCommits.mock.calls.map(c => c[1])).toEqual([1, 2, 3, 4])\n      expect(lt.getLog().map(l => [l.title, l.commitMessage])).toEqual([\n        ['feat: change 1', 'commit 1'],\n        ['feat: change 2', 'commit 2'],\n        ['feat: change 3', 'commit 3'],\n        ['feat: change 4', 'commit 4']\n      ])\n    })\n\n    it('propagate a failing commit fetch', async () => {\n      const getCommits = vi.fn(async (): Promise<"+"Commit[]> => {\n        throw new Error('boom')\n      })\n      const lt = new LeadTime(\n        pulls(3),\n        [repoRelease],\n        {getCommits},\n        {window: windowAt(today)}\n      )\n\n      await expect(lt.getLeadTime()).rejects.toThrow('boom')\n    })\n  })\n\n  // Returning commits from (10)=>22/4, (15)=>27/4 and (47)=>19/4\n  async function getCommits(\n    _repo: RepoKey,\n    pullNumber: number\n  ): Promise<"+"Commit[]> {\n    if (pullNumber === 10) {\n      return [commit('2023-04-22T17:50:53Z', 'wip: changed to commonjs')]\n    }\n    if (pullNumber === 15) {\n      return [\n        commit(\n          '2023-04-27T17:50:53Z',\n          'fix(workflow): update release and dora workflows'\n        )\n      ]\n    }\n    if (pullNumber === 47) {\n      return [commit('2023-04-19T17:50:53Z', 'all passing')]\n    }\n    return []\n  }\n})\n"},"__tests__/MeanTimeToRestore.test.ts":{"tests":[{"id":"127","name":"MeanTimeToRestore should get bugs last month"},{"id":"128","name":"MeanTimeToRestore should restore log log one restore record per contributing bug with the bounding releases"},{"id":"129","name":"MeanTimeToRestore should restore log skip open bugs and bugs without a bracketing release"},{"id":"130","name":"MeanTimeToRestore should restore log leave the log empty when no bug contributes"},{"id":"131","name":"MeanTimeToRestore should find release time before date"},{"id":"132","name":"MeanTimeToRestore should throw error when no earlier dates"},{"id":"133","name":"MeanTimeToRestore should find release time after date"},{"id":"134","name":"MeanTimeToRestore should throw error when no later dates"},{"id":"135","name":"MeanTimeToRestore should check if there are later releases"},{"id":"136","name":"MeanTimeToRestore should get time for a bug 1"},{"id":"137","name":"MeanTimeToRestore should get time for a bug 2"},{"id":"138","name":"MeanTimeToRestore should get mttr for bug 1 when no release after bug 2"},{"id":"139","name":"MeanTimeToRestore should returns 0 when both the issue and release lists are empty"},{"id":"140","name":"MeanTimeToRestore should get mttr for bug 1 when release in wrong repo after bug 2"},{"id":"141","name":"MeanTimeToRestore should get mttr for 2 bugs when release after bug 2"},{"id":"142","name":"MeanTimeToRestore should get mttr for 2 bugs on two repos when release after bug 2"},{"id":"143","name":"MeanTimeToRestore should get mttr for 2 bugs on two repos when no release after bug 1"},{"id":"144","name":"MeanTimeToRestore should not attribute releases of a repo whose name is a prefix of another"},{"id":"145","name":"MeanTimeToRestore should get average time to repair"},{"id":"146","name":"MeanTimeToRestore should returns 0 when there are bugs but no releases"},{"id":"147","name":"MeanTimeToRestore should return 0 when no bugs"},{"id":"148","name":"MeanTimeToRestore should not mutate the release list passed in"},{"id":"149","name":"MeanTimeToRestore should release boundaries not count a release published at the exact date as previous"},{"id":"150","name":"MeanTimeToRestore should release boundaries not count releases of other repos as previous"},{"id":"151","name":"MeanTimeToRestore should release boundaries skip a closer release of another repo in getReleaseBefore and getReleaseAfter"},{"id":"152","name":"MeanTimeToRestore should release boundaries not count a release published at the exact date as later"},{"id":"153","name":"MeanTimeToRestore should release boundaries skip the release published at the exact date in getReleaseBefore"},{"id":"154","name":"MeanTimeToRestore should release boundaries skip the release published at the exact date in getReleaseAfter"},{"id":"155","name":"MeanTimeToRestore should bug selection ignore bugs that are still open"},{"id":"156","name":"MeanTimeToRestore should bug selection include a bug created exactly 30 days ago and ignore older ones"},{"id":"157","name":"MeanTimeToRestore should with a custom bug label count issues tagged with the custom label"},{"id":"158","name":"MeanTimeToRestore should with a custom bug label ignore issues tagged bug when a custom label is given"},{"id":"159","name":"MeanTimeToRestore should with a custom bug label default to the bug label when none is given"}],"source":"import type {Issue} from '../src/types/Issue'\nimport type {Release} from '../src/types/Release'\nimport type {\n  GitHubIssuePayload,\n  GitHubReleasePayload\n} from '../src/github/payloads'\nimport {toIssue, toRelease} from '../src/github/mappers'\nimport fs from 'node:fs'\nimport {type BugTime, MeanTimeToRestore} from '../src/MeanTimeToRestore'\nimport {issue, release, ts, windowAt} from './helpers/domain'\n\nconst DMA = 'stenjo/devops-metrics-action'\nconst REPOSITORY = 'some-path/repository'\nconst OTHER = 'some-path/other-repo'\n\ndescribe('MeanTimeToRestore should', () => {\n  const issues: Issue[] = (\n    JSON.parse(\n      fs.readFileSync('./__tests__/test-data/issue-list.json').toString()\n    ) as GitHubIssuePayload[]\n  ).map(p => toIssue('stenjo', 'devops-metrics-action', p))\n  const releases: Release[] = (\n    JSON.parse(\n      fs.readFileSync('./__tests__/test-data/releases.json').toString()\n    ) as GitHubReleasePayload[]\n  ).map(p => toRelease('stenjo', 'devops-metrics-action', p))\n  const mttr = new MeanTimeToRestore(issues, releases, {\n    window: windowAt('2023-04-30T16:50:53Z')\n  })\n\n  it('get bugs last month', () => {\n    const bugCount = mttr.getBugCount()\n\n    expect(bugCount.length).toBe(2)\n    expect(bugCount[0].start).toBe(ts('2023-04-25T21:21:49Z'))\n    expect(bugCount[1].end).toBe(ts('2023-04-23T16:47:40Z'))\n    expect(bugCount.map(b => b.issue.number)).toEqual([26, 16])\n  })\n\n  describe('restore log', () => {\n    it('log one restore record per contributing bug with the bounding releases', () => {\n      const m = new MeanTimeToRestore(issues, releases, {\n        window: windowAt('2023-04-30T16:50:53Z')\n      })\n\n      expect(m.getLog()).toEqual([])\n      const mean = m.mttr()\n\n      expect(m.getLog()).toEqual([\n        {\n          kind: 'restore',\n          repo: 'stenjo/devops-metrics-action',\n          number: 26,\n          title: 'fix: include also closed issues in issue list',\n          createdAt: '2023-04-25T21:21:49Z',\n          closedAt: '2023-04-29T12:54:45Z',\n          releaseBefore: 'v0.0.2',\n          releaseBeforeAt: '2023-04-22T20:28:29Z',\n          releaseAfter: 'v0.2.0',\n          releaseAfterAt: '2023-04-30T16:06:06Z',\n          restoreDays: 7.82\n        },\n        {\n          kind: 'restore',\n          repo: 'stenjo/devops-metrics-action',\n          number: 16,\n          title: 'Add test json data to project',\n          createdAt: '2023-04-22T21:44:06Z',\n          closedAt: '2023-04-23T16:47:40Z',\n          releaseBefore: 'v0.0.2',\n          releaseBeforeAt: '2023-04-22T20:28:29Z',\n          releaseAfter: 'v0.1.0',\n          releaseAfterAt: '2023-04-29T06:18:36Z',\n          restoreDays: 6.41\n        }\n      ])\n      expect(m.getLog().length).toBe(m.getBugCount().length)\n      // Each restoreDays is rounded, so their mean may differ from mttr() by rounding noise only.\n      const days = m.getLog().map(e => e.restoreDays)\n      const meanOfRounded = days.reduce((a, b) => a + b) / days.length\n      expect(Math.abs(meanOfRounded - mean)).toBeLessThanOrEqual(0.005)\n      expect(mean).toBe(7.11)\n    })\n\n    it('skip open bugs and bugs without a bracketing release', () => {\n      const bugs = [\n        issue({\n          number: 1,\n          repo: REPOSITORY,\n          createdAt: ts('2023-04-22T21:44:06Z'),\n          closedAt: null\n        }),\n        issue({\n          number: 2,\n          repo: REPOSITORY,\n          createdAt: ts('2023-04-19T00:00:00Z'), // before the first release\n          closedAt: ts('2023-04-23T00:00:00Z')\n        }),\n        issue({\n          number: 3,\n          repo: REPOSITORY,\n          createdAt: ts('2023-04-25T00:00:00Z'),\n          closedAt: ts('2023-04-26T00:00:00Z') // no release after\n        }),\n        issue({\n          number: 4,\n          repo: REPOSITORY,\n          createdAt: ts('2023-04-21T00:00:00Z'),\n          closedAt: ts('2023-04-23T00:00:00Z')\n        })\n      ]\n      const localReleases = [\n        release('2023-04-20T00:00:00Z', REPOSITORY, 'early'),\n        release('2023-04-24T00:00:00Z', REPOSITORY, 'late')\n      ]\n      const m = new MeanTimeToRestore(bugs, localReleases, {\n        window: windowAt('2023-04-30T00:00:00Z')\n      })\n\n      expect(m.mttr()).toBe(4)\n      expect(m.getLog().map(e => e.number)).toEqual([4])\n      expect(m.getLog()[0]).toMatchObject({\n        releaseBefore: 'early',\n        releaseAfter: 'late',\n        restoreDays: 4\n      })\n    })\n\n    it('leave the log empty when no bug contributes', () => {\n      const m = new MeanTimeToRestore([], releases, {window: windowAt()})\n\n      expect(m.mttr()).toBe(0)\n      expect(m.getLog()).toEqual([])\n    })\n  })\n\n  it('find release time before date', () => {\n    const before1 = mttr.getReleaseBefore(ts('2023-04-25T21:21:49Z'), DMA)\n    const before2 = mttr.getReleaseBefore(ts('2023-04-29T12:54:45Z'), DMA)\n\n    expect(before1.publishedAt).toBe(ts('2023-04-22T20:28:29Z'))\n    expect(before2.publishedAt).toBe(ts('2023-04-29T06:18:36Z'))\n  })\n\n  it('throw error when no earlier dates', () => {\n    const t = (): void => {\n      mttr.getReleaseBefore(ts('2023-04-05T21:21:49Z'), DMA)\n    }\n\n    expect(t).toThrow('No previous releases')\n  })\n\n  it('find release time after date', () => {\n    const after1 = mttr.getReleaseAfter(ts('2023-04-25T21:21:49Z'), DMA)\n    const after2 = mttr.getReleaseAfter(ts('2023-04-29T12:54:45Z'), DMA)\n\n    expect(after1.publishedAt).toBe(ts('2023-04-29T06:18:36Z'))\n    expect(after2.publishedAt).toBe(ts('2023-04-30T16:06:06Z'))\n  })\n\n  it('throw error when no later dates', () => {\n    const t = (): void => {\n      mttr.getReleaseAfter(ts('2023-05-05T21:21:49Z'), DMA)\n    }\n\n    expect(t).toThrow('No later releases')\n  })\n\n  it('check if there are later releases', () => {\n    const hasLaterRelease = mttr.hasLaterRelease(\n      ts('2023-04-29T12:54:45Z'),\n      DMA\n    )\n    const hasNoLaterRelease = mttr.hasLaterRelease(\n      ts('2023-04-30T17:29:44Z'),\n      DMA\n    )\n\n    expect(hasLaterRelease).toBe(true)\n    expect(hasNoLaterRelease).toBe(false)\n  })\n\n  it('get time for a bug 1', () => {\n    const bug: BugTime = {\n      start: ts('2023-04-22T21:44:06Z'),\n      end: ts('2023-04-23T16:47:40Z'),\n      repo: DMA,\n      issue: issue()\n    }\n    const releaseDiff = ts('2023-04-29T06:18:36Z') - ts('2023-04-22T20:28:29Z')\n\n    const fixTime: number = mttr.getRestoreTime(bug)\n\n    expect(fixTime).toBe(releaseDiff)\n  })\n  it('get time for a bug 2', () => {\n    const bug: BugTime = {\n      start: ts('2023-04-25T21:21:49Z'),\n      end: ts('2023-04-29T12:54:45Z'),\n      repo: DMA,\n      issue: issue()\n    }\n    const releaseDiff = ts('2023-04-30T16:06:06Z') - ts('2023-04-22T20:28:29Z')\n\n    const fixTime: number = mttr.getRestoreTime(bug)\n\n    expect(fixTime).toBe(releaseDiff)\n  })\n\n  const twoBugs = (): Issue[] => [\n    issue({\n      repo: REPOSITORY,\n      createdAt: ts('2023-04-22T21:44:06Z'),\n      closedAt: ts('2023-04-23T16:47:40Z')\n    }),\n    issue({\n      repo: REPOSITORY,\n      createdAt: ts('2023-04-25T21:21:49Z'),\n      closedAt: ts('2023-04-29T12:54:45Z')\n    })\n  ]\n\n  it('get mttr for bug 1 when no release after bug 2', () => {\n    const localReleases = [\n      release('2023-04-25T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(twoBugs(), localReleases, {\n      window: windowAt('2023-04-29T12:54:45Z')\n    })\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(4)\n  })\n\n  it('returns 0 when both the issue and release lists are empty', () => {\n    const m = new MeanTimeToRestore([] as Issue[], [] as Release[], {\n      window: windowAt()\n    })\n\n    expect(m.mttr()).toBe(0)\n    expect(m.getLog()).toEqual([])\n  })\n\n  it('get mttr for bug 1 when release in wrong repo after bug 2', () => {\n    const localReleases = [\n      release('2023-04-25T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-30T00:00:00Z', OTHER),\n      release('2023-04-20T00:00:00Z', REPOSITORY)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(twoBugs(), localReleases, {\n      window: windowAt('2023-04-30T00:00:00Z')\n    })\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(4)\n  })\n\n  it('get mttr for 2 bugs when release after bug 2', () => {\n    const localReleases = [\n      release('2023-04-30T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(twoBugs(), localReleases, {\n      window: windowAt('2023-04-30T00:00:00Z')\n    })\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(5)\n  })\n\n  it('get mttr for 2 bugs on two repos when release after bug 2', () => {\n    const bugList: Issue[] = [\n      issue({\n        // 21 -> 24 = 3\n        repo: OTHER,\n        createdAt: ts('2023-04-22T21:44:06Z'),\n        closedAt: ts('2023-04-23T16:47:40Z')\n      }),\n      issue({\n        // 24 -> 30 = 6\n        repo: REPOSITORY,\n        createdAt: ts('2023-04-25T21:21:49Z'),\n        closedAt: ts('2023-04-29T12:54:45Z')\n      })\n    ]\n    const localReleases = [\n      release('2023-04-30T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY),\n      release('2023-04-21T00:00:00Z', OTHER),\n      release('2023-04-24T00:00:00Z', OTHER)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(bugList, localReleases, {\n      window: windowAt('2023-04-30T00:00:00Z')\n    })\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(4.5)\n  })\n\n  it('get mttr for 2 bugs on two repos when no release after bug 1', () => {\n    const bugList: Issue[] = [\n      issue({\n        repo: OTHER,\n        createdAt: ts('2023-04-22T21:44:06Z'),\n        closedAt: ts('2023-04-23T16:47:40Z')\n      }),\n      issue({\n        // 24 -> 30 = 6\n        repo: REPOSITORY,\n        createdAt: ts('2023-04-25T21:21:49Z'),\n        closedAt: ts('2023-04-29T12:54:45Z')\n      })\n    ]\n    const localReleases = [\n      release('2023-04-30T00:00:00Z', REPOSITORY),\n      release('2023-04-24T00:00:00Z', REPOSITORY),\n      release('2023-04-20T00:00:00Z', REPOSITORY),\n      release('2023-04-21T00:00:00Z', OTHER)\n    ]\n\n    const mttrEmpty = new MeanTimeToRestore(bugList, localReleases, {\n      window: windowAt('2023-04-30T00:00:00Z')\n    })\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(6)\n  })\n\n  it('not attribute releases of a repo whose name is a prefix of another', () => {\n    const bug = issue({\n      repo: 'o/api',\n      createdAt: ts('2023-04-25T00:00:00Z'),\n      closedAt: ts('2023-04-26T00:00:00Z')\n    })\n    const gatewayOnly = [\n      release('2023-04-20T00:00:00Z', 'o/api-gateway'),\n      release('2023-04-28T00:00:00Z', 'o/api-gateway')\n    ]\n    const both = [\n      ...gatewayOnly,\n      release('2023-04-22T00:00:00Z', 'o/api'),\n      release('2023-04-30T00:00:00Z', 'o/api')\n    ]\n    const today = new Date('2023-05-01T00:00:00Z')\n\n    expect(\n      new MeanTimeToRestore([bug], gatewayOnly, {\n        window: windowAt(today)\n      }).mttr()\n    ).toBe(0)\n    expect(\n      new MeanTimeToRestore([bug], both, {window: windowAt(today)}).mttr()\n    ).toBe(8) // 22/4 -> 30/4\n  })\n\n  it('get average time to repair', () => {\n    const avMttr: number = mttr.mttr()\n\n    expect(avMttr).toBeGreaterThan(6.4)\n    expect(avMttr).toBeLessThan(7.9)\n  })\n\n  it('returns 0 when there are bugs but no releases', () => {\n    const emptyReleaseList: Release[] = []\n\n    const m = new MeanTimeToRestore(issues, emptyReleaseList, {\n      window: windowAt()\n    })\n\n    expect(m.getBugCount()).toEqual([])\n    expect(m.mttr()).toBe(0)\n    expect(m.getLog()).toEqual([])\n  })\n\n  it('return 0 when no bugs', () => {\n    const emptyBugList: Issue[] = []\n\n    const mttrEmpty = new MeanTimeToRestore(emptyBugList, releases, {\n      window: windowAt()\n    })\n    const meanTime = mttrEmpty.mttr()\n\n    expect(meanTime).toBe(0)\n  })\n\n  it('not mutate the release list passed in', () => {\n    const input = [\n      release('2023-04-30
