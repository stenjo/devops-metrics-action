on:
  push:
    branches:
      - main

permissions:
  contents: read

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # PRs opened with GITHUB_TOKEN are authored by github-actions[bot], which GitHub
      # treats as an outside contributor, so every PR workflow sits in "awaiting approval".
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4
        id: release
        with:
          release-type: simple
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tag major and minor versions
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -d "v${MAJOR}" || true
          git tag -d "v${MAJOR}.${MINOR}" || true
          git push origin ":v${MAJOR}" || true
          git push origin ":v${MAJOR}.${MINOR}" || true
          git tag -a "v${MAJOR}" -m "Release v${MAJOR}"
          git tag -a "v${MAJOR}.${MINOR}" -m "Release v${MAJOR}.${MINOR}"
          git push origin "v${MAJOR}"
          git push origin "v${MAJOR}.${MINOR}"
