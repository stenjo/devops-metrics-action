name: Calculate DORA Metrics

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

# The action only reads; the job that commits history gets contents: write.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    name: Checking the dora metrics
    outputs:
      deploy-rate: ${{ steps.dora.outputs.deploy-rate }}
      lead-time: ${{ steps.dora.outputs.lead-time }}
      change-failure-rate: ${{ steps.dora.outputs.change-failure-rate }}
      mttr: ${{ steps.dora.outputs.mttr }}
    steps:
      - name: Dora metrics
        uses: stenjo/devops-metrics-action@25bbdbe7eb6a45c88ea7f1fceaf6a26b8f07a9fa # v2.1.2
        id: dora
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          logging: true

      # Use the output from the `dora` step
      - name: Get the output rate
        run: echo "The deploy rate was ${{ steps.dora.outputs.deploy-rate }}" # Use the output from the `dora` step
      - name: Get the lead time
        run: echo "The lead time was ${{ steps.dora.outputs.lead-time }}" # Use the output from the `dora` step
      - name: Get the change failure rate
        run: echo "The change failure rate was ${{
          steps.dora.outputs.change-failure-rate }}"
      - name: Get the mean time to restore
        run: echo "The mean time to restore was ${{ steps.dora.outputs.mttr }}"

      - name: Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1

      # The *-log outputs are JSON arrays; parse them, never echo them.
      - name: Summarize metric logs
        env:
          DEPLOY_RATE: ${{ steps.dora.outputs.deploy-rate }}
          LEAD_TIME: ${{ steps.dora.outputs.lead-time }}
          CHANGE_FAILURE_RATE: ${{ steps.dora.outputs.change-failure-rate }}
          MTTR: ${{ steps.dora.outputs.mttr }}
          DEPLOY_RATE_LOG: ${{ steps.dora.outputs.deploy-rate-log }}
          LEAD_TIME_LOG: ${{ steps.dora.outputs.lead-time-log }}
          CFR_LOG: ${{ steps.dora.outputs.change-failure-rate-log }}
          MTTR_LOG: ${{ steps.dora.outputs.mttr-log }}
        run: |
          for log in "$DEPLOY_RATE_LOG" "$LEAD_TIME_LOG" "$CFR_LOG" "$MTTR_LOG"; do
            jq -e 'type == "array"' <<< "$log" > /dev/null
          done
          {
            echo "## Releases behind deploy frequency ($DEPLOY_RATE deploys/week)"
            echo
            echo '| Repository | Published | Release |'
            echo '| --- | --- | --- |'
            jq -r '.[] | select(.kind == "release") | "| \(.repo) | \(.at) | \(.name | gsub("\\|"; "\\|")) |"' <<< "$DEPLOY_RATE_LOG"
            jq -r '.[] | select(.kind == "truncated") | "\n_\(.omitted) more omitted_"' <<< "$DEPLOY_RATE_LOG"
            echo
            echo "## Pull requests behind lead time ($LEAD_TIME days)"
            echo
            echo '| Repository | Merged | Pull request | First commit | Released | Days |'
            echo '| --- | --- | --- | --- | --- | --- |'
            jq -r '.[] | select(.kind == "pull") | "| \(.repo) | \(.at) | \(.title | gsub("\\|"; "\\|")) | \(.commitAt) | \(.release | gsub("\\|"; "\\|")) | \(.leadTimeDays) |"' <<< "$LEAD_TIME_LOG"
            jq -r '.[] | select(.kind == "truncated") | "\n_\(.omitted) more omitted_"' <<< "$LEAD_TIME_LOG"
            echo
            echo "## Releases behind change failure rate ($CHANGE_FAILURE_RATE%)"
            echo
            echo '| Repository | Published | Release | Bugs opened before next release |'
            echo '| --- | --- | --- | --- |'
            jq -r '.[] | select(.kind == "failed-release") | "| \(.repo) | \(.at) | \(.name | gsub("\\|"; "\\|")) | \([.bugs[] | "#\(.number) \(.title | gsub("\\|"; "\\|"))"] | join("<br>")) |"' <<< "$CFR_LOG"
            jq -r '.[] | select(.kind == "truncated") | "\n_\(.omitted) more omitted_"' <<< "$CFR_LOG"
            echo
            echo "## Bugs behind mean time to restore ($MTTR days)"
            echo
            echo '| Repository | Bug | Opened | Closed | Release before | Release after | Days |'
            echo '| --- | --- | --- | --- | --- | --- | --- |'
            jq -r '.[] | select(.kind == "restore") | "| \(.repo) | #\(.number) \(.title | gsub("\\|"; "\\|")) | \(.createdAt) | \(.closedAt) | \(.releaseBefore | gsub("\\|"; "\\|")) | \(.releaseAfter | gsub("\\|"; "\\|")) | \(.restoreDays) |"' <<< "$MTTR_LOG"
            jq -r '.[] | select(.kind == "truncated") | "\n_\(.omitted) more omitted_"' <<< "$MTTR_LOG"
          } >> "$GITHUB_STEP_SUMMARY"

  update-history:
    runs-on: ubuntu-latest
    name: Update DORA metric history
    needs: metrics
    # Only this job pushes to main.
    permissions:
      contents: write
    env:
      DEPLOY_RATE: ${{ needs.metrics.outputs.deploy-rate }}
      LEAD_TIME: ${{ needs.metrics.outputs.lead-time }}
      CHANGE_FAILURE_RATE: ${{ needs.metrics.outputs.change-failure-rate }}
      MTTR: ${{ needs.metrics.outputs.mttr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%m-%d')" >> "$GITHUB_OUTPUT"
          mkdir tmp

      - name: Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1

      # Store Deploy Rate history
      - name: Load deploy rate history
        run: |
          cp data/deploy-rate.json tmp/deploy-rate.json 2>/dev/null || echo '[]' > tmp/deploy-rate.json

      - name: Update deploy rate history
        run: |
          DATE="${{ steps.date.outputs.date }}"
          RATE="$DEPLOY_RATE"
          if jq -e "[.[]| select(.date == \"$DATE\")] | length > 0" tmp/deploy-rate.json > /dev/null 2>&1; then
            jq "(.[] | select(.date == \"$DATE\") ).rate |= \"$RATE\"" tmp/deploy-rate.json > data/deploy-rate.json
          else
            jq ".[. | length] |= . + {\"date\":\"$DATE\", \"rate\":\"$RATE\", \"target\":\"7\"}" tmp/deploy-rate.json > data/deploy-rate.json
          fi

      # Store Lead Time history
      - name: Load lead time history
        run: |
          cp data/lead-time.json tmp/lead-time.json 2>/dev/null || echo '[]' > tmp/lead-time.json

      - name: Update lead time history
        run: |
          DATE="${{ steps.date.outputs.date }}"
          RATE="$LEAD_TIME"
          if jq -e "[.[]| select(.date == \"$DATE\")] | length > 0" tmp/lead-time.json > /dev/null 2>&1; then
            jq "(.[] | select(.date == \"$DATE\") ).rate |= \"$RATE\"" tmp/lead-time.json > data/lead-time.json
          else
            jq ".[. | length] |= . + {\"date\":\"$DATE\", \"rate\":\"$RATE\", \"target\":\"7\"}" tmp/lead-time.json > data/lead-time.json
          fi

      # Store Change Failure Rate history
      - name: Load change failure rate history
        run: |
          cp data/change-failure-rate.json tmp/change-failure-rate.json 2>/dev/null || echo '[]' > tmp/change-failure-rate.json

      - name: Update change failure rate history
        run: |
          DATE="${{ steps.date.outputs.date }}"
          RATE="$CHANGE_FAILURE_RATE"
          if jq -e "[.[]| select(.date == \"$DATE\")] | length > 0" tmp/change-failure-rate.json > /dev/null 2>&1; then
            jq "(.[] | select(.date == \"$DATE\") ).rate |= \"$RATE\"" tmp/change-failure-rate.json > data/change-failure-rate.json
          else
            jq ".[. | length] |= . + {\"date\":\"$DATE\", \"rate\":\"$RATE\", \"target\":\"15\"}" tmp/change-failure-rate.json > data/change-failure-rate.json
          fi

      # Store Mean Time to Restore history
      - name: Load MTTR history
        run: |
          cp data/mttr.json tmp/mttr.json 2>/dev/null || echo '[]' > tmp/mttr.json

      - name: Update MTTR history
        run: |
          DATE="${{ steps.date.outputs.date }}"
          RATE="$MTTR"
          if jq -e "[.[]| select(.date == \"$DATE\")] | length > 0" tmp/mttr.json > /dev/null 2>&1; then
            jq "(.[] | select(.date == \"$DATE\") ).rate |= \"$RATE\"" tmp/mttr.json > data/mttr.json
          else
            jq ".[. | length] |= . + {\"date\":\"$DATE\", \"rate\":\"$RATE\", \"target\":\"1\"}" tmp/mttr.json > data/mttr.json
          fi

      - name: Commit DORA history data
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data/deploy-rate.json data/lead-time.json data/change-failure-rate.json data/mttr.json
          if ! git diff --staged --quiet; then
            git commit -m "Update DORA metric history [skip ci]"
            # Other badge workflows push to main concurrently; rebase and retry.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
            exit 1
          fi
